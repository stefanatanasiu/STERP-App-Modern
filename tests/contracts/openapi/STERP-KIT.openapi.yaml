  "/api/kit/v1/kits/{kitRef}/review":
    post:
      operationId: "kit_reviewKit"
      summary: "Review a DRAFT kit (DRAFT to REVIEWED)"
      description: "Reproduces KitService.Review (KitService.vb:64-66) -> KITCREAT REVIEW (KITCREAT.cob:503-570). Status must be DRAFT, else 422 KIT0005 'Only a draft kit may be reviewed; this kit is <status>.'. Line-completeness gate over every line, CLOSED and CANCELLED included: no line -> 422 KIT0004 'This kit has no material requirement lines.'; a line without UoM or with requirement <= 0 -> 422 KIT0004 'One or more material lines have no unit or no requirement quantity.'. Then KITDB HDRSTAT sets REVIEWED (no from-status predicate, no RowVer) and AUDITLOG writes entity KIT.EXECUTIONKIT, action REVIEW, Status DRAFT -> REVIEWED, blank reason and authority, source KITCREAT, site = X-STERP-Site (KITCREAT.cob:648-680). The legacy call passes no explicit correlation id: the Idempotency-Key or a new GUID is used."
      tags:
        - "Kit Maintenance"
      parameters:
        - "$ref": "#/components/parameters/KitKitRefPath"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: "No input beyond the path (legacy facade takes only the kit reference)."
        content:
          "application/json":
            schema:
              type: "object"
              properties: {}
            example: {}
      responses:
        "200":
          description: "RC 0 - kit reviewed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/KitLifecycleEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: "KIT-002"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  kitRef: "KIT0001004"
                  status: "REVIEWED"
                  prevStatus: "DRAFT"
                  completeness: "COMPLETE"
                  shortageCnt: 0
                  lineTotal: 2
                  needsAuth: "N"
                  reasonText: ""
                  warningText: ""
                  wipValue: 0.0
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-KIT-012"
        - "FR-STERP-KIT-050"
        - "FR-STERP-KIT-060"
      x-sterp-legacy:
        forms:
          - "frmKitMaint.ReviewClicked / OnConfirm F10 (frmKitMaint.vb:59-64,110-112)"
        facade:
          - "KitService.Review (KitService.vb:64-66)"
        cobol:
          - "KITCREAT REVIEW (KITCREAT.cob:503-570,648-709)"
          - "KITDB HDRGET/LINOPEN/LINNEXT/HDRSTAT"
          - "AUDITLOG WRITE -> core.usp_WriteAudit"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "No BEGN/COMT in KITCREAT (SME-643): autocommit per statement - header and line reads; UPDATE kit.ExecutionKit Status (KITDB HDRSTAT) commits alone; EXEC core.usp_WriteAudit (AUDITLOG) commits alone. A failure after HDRSTAT leaves the status changed without the audit row (reproduced)."
      x-sterp-wave: "W9"
      x-sterp-screen-gate:
        anyOf:
          - "KIT.EXEC.CREATE"
        sources:
          - "menu:KIT.MAINT=KIT.EXEC.CREATE"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/kit/v1/kits/{kitRef}/release":
    post:
      operationId: "kit_releaseKit"
      summary: "Release a kit (authority KIT.EXEC.RELEASE and freeze)"
      description: "Reproduces KitService.Release (KitService.vb:69-73) -> KITCREAT RELEASE (KITCREAT.cob:576-646). Status must be REVIEWED or DRAFT, else 422 KIT0005 'A kit in status <status> cannot be released.'. PERMCHK CHECK of KIT.EXEC.RELEASE for the user at the kit's own site: any non-zero PERMCHK result sets RC 6 KIT0009, needsAuth Y, message = PERMCHK reason text (normally core.usp_CheckPermission's 'STERP-E-0001: User <user> does not hold permission KIT.EXEC.RELEASE for company <co> site <site>.', db/procs/core/usp_CheckPermission.sql:15) or, when blank, 'Releasing an execution kit needs the kit release authority.'. RC 6 is not CA-FAILED (STCAHDR.cpy:27), so the release continues (BR-KITCREAT-026): the line-completeness gate (as review; RC 8 there replaces the hold and stops), KITDB HDRFRZ (frozen assumptions rewritten from the header just read, SupplyChoiceNote 'Released from bill <rev> selected at <yyyymmdd>'), HDRSTAT RELEASED with ReleasedBy/ReleasedAt, audit RELEASE (blank reason) and reasonText 'Revisions, units and calculation assumptions are now fixed for this kit.'. Without the authority the response is therefore HTTP 202 RC 6 KIT0009 for a kit that has been released (parity, SME-038; decision D-KIT-09; BC-KIT-10 proposes stopping on the hold). One Idempotency-Key per user instruction (the legacy drew a new correlation id per click)."
      tags:
        - "Kit Maintenance"
      parameters:
        - "$ref": "#/components/parameters/KitKitRefPath"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: "No input beyond the path (KC-OWNER-USER is set to the user but not written)."
        content:
          "application/json":
            schema:
              type: "object"
              properties: {}
            example: {}
      responses:
        "200":
          description: "RC 0 - kit released."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/KitLifecycleEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: "KIT-002"
                  correlationId: "7a0d5c1e-2b44-4f0e-8e9a-61c3b2d4e5f6"
                data:
                  kitRef: "KIT0001004"
                  status: "RELEASED"
                  prevStatus: "DRAFT"
                  completeness: "COMPLETE"
                  shortageCnt: 0
                  lineTotal: 2
                  needsAuth: "N"
                  reasonText: "Revisions, units and calculation assumptions are now fixed for this kit."
                  warningText: ""
                  wipValue: 0.0
        "202":
          description: "RC 6 HOLD KIT0009 - release authority missing; the legacy flow nevertheless froze and released the kit and wrote the audit row (BR-KITCREAT-026, SME-038)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/KitLifecycleEnvelope"
              example:
                outcome:
                  returnCode: 6
                  severity: "HOLD"
                  reasonCode: "KIT0009"
                  message: "STERP-E-0001: User WHSE does not hold permission KIT.EXEC.RELEASE for company STC site RDG."
                  messageCount: 0
                  documentRef: "KIT-002"
                  correlationId: "7a0d5c1e-2b44-4f0e-8e9a-61c3b2d4e5f6"
                data:
                  kitRef: "KIT0001004"
                  status: "RELEASED"
                  prevStatus: "DRAFT"
                  completeness: "COMPLETE"
                  shortageCnt: 0
                  lineTotal: 2
                  needsAuth: "Y"
                  reasonText: "Revisions, units and calculation assumptions are now fixed for this kit."
                  warningText: ""
                  wipValue: 0.0
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-KIT-013"
        - "FR-STERP-KIT-050"
        - "FR-STERP-KIT-060"
      x-sterp-legacy:
        forms:
          - "frmKitMaint.ReleaseClicked (frmKitMaint.vb:68-77)"
        facade:
          - "KitService.Release (KitService.vb:69-73)"
        cobol:
          - "KITCREAT RELEASE (KITCREAT.cob:576-680)"
          - "PERMCHK CHECK KIT.EXEC.RELEASE -> core.usp_CheckPermission"
          - "KITDB HDRFRZ/HDRSTAT (KITDB.cob:407-438,471-511)"
          - "AUDITLOG WRITE"
      x-sterp-permission:
        - "KIT.EXEC.RELEASE"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "No BEGN/COMT in KITCREAT (SME-643): autocommit per statement - PERMCHK read; line reads; UPDATE kit.ExecutionKit frozen assumptions (HDRFRZ) commits; UPDATE Status RELEASED (HDRSTAT) commits; core.usp_WriteAudit commits. The same writes happen on the RC 6 KIT0009 path (BR-KITCREAT-026); a failure after HDRFRZ leaves the freeze without the status change (reproduced)."
      x-sterp-wave: "W9"
      x-sterp-screen-gate:
        anyOf:
          - "KIT.EXEC.CREATE"
        sources:
          - "menu:KIT.MAINT=KIT.EXEC.CREATE"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/kit/v1/kits/{kitRef}/kind-check":
    post:
      operationId: "kit_checkKitKind"
      summary: "Kind check: may the parent be received into stock"
      description: "Reproduces KitService.KindCheck (KitService.vb:89-93) -> KITCREAT KINDCHK (KITCREAT.cob:119-175); the kit reference is passed but not read. mayReceive starts N; blank parentItem -> 422 KIT0003 'A parent item code is required.'; unknown item -> 404 KIT0001 'Item <item> is not known in this company.'; first match: COMMERCIAL -> N 'A commercial kit parent is a commercial identity, not an item balance.'; PHANTOM -> N 'A phantom grouping has no receipt, no run and no separate stock.'; TRIAL -> N 'A trial is a calculation and commits nothing.'; stocked item -> Y 'A stocked assembly may be completed into stock.'; otherwise N with RC 4 KIT0006 'This parent item does not hold stock and cannot be received as a finished assembly.'. Read only. The Kit Maintenance page sends kitKind blank (the worklist has no KitKind column, GridHelper.vb:171) and the selected ParentItemCode (decision D-KIT-07)."
      tags:
        - "Kit Maintenance"
      parameters:
        - "$ref": "#/components/parameters/KitKitRefPath"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/KitKindCheckRequest"
            example:
              kitKind: ""
              parentItem: "FG-BIKE-COMMUTE-M"
