      summary: "Genealogy trace FORWARD, BACKWARD or WHEREUSD"
      description: "Reproduces KitExecutionService.Genealogy (KitExecutionService.vb:101-121): function = BACKWARD or WHEREUSD when the trimmed upper-case direction says so, otherwise FORWARD; returns and scrap included; window 20; every further window re-runs GENEALOG with FROM-LINE = rows already returned (1-based start, so the row at position 20 repeats when the answer exceeds 20 rows; SME-644). GENEALOG (GENEALOG.cob:113-800): maxDepth <= 0 -> 5, > 12 -> 12; FORWARD/BACKWARD need an item, kit reference or completion id (422 KIT0012 'Give an item, a kit reference or a completion identity to trace.'); breadth-first over kit.KitGenealogy - FORWARD follows rows whose parent matches the identity (blank lot/serial = any) down to components, BACKWARD rows whose component matches up to parents; kit filter applied at every depth (SME-650); CONSUMED rows with substitution marking 'Substituted for <planned item>'; RETURN/SCRAP disposition rows at depth 1; 400 rows or 60 identities -> RC 4 KIT0026 'The trace was cut short - narrow the identity or reduce the depth.'; nothing found -> 404 KIT0026 'No genealogy is recorded for <item> <lot><serial>.'; WHEREUSD needs an item (422 KIT0012 'An item code is required for a where used enquiry.') and lists open kits (DRAFT..PARTCOMPLETE) still requiring it as component or substitute, by need date. GN-FROM-DATE/GN-TO-DATE are ignored by the program and not exposed (SME-1905). The completion-id identity is not sent by the legacy facade and is not exposed. Refusals carry the problem data member (contracts 4.7): a KitGenealogyTrace with the summary as left and the lines already collected (none when the first call fails), because frmKitGenealogy populates the grid before the error dialog (decision D-KIT-08)."
