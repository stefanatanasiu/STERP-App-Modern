openapi: "3.1.0"
info:
  title: "STERP Kits (kitting and assembly) API (STERP-KIT)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Online and batch API of the Kits slice (target application STERP-KIT, wave W9, API segment kit) of the modernized STERP ERP. Online operations run in STERP.Api (https://localhost:7101) and replace the WinForms kit screens (frmKitMaint, frmKitExecution, frmKitTrial, frmKitGenealogy), the VB facades KitService/KitExecutionService and the online COBOL programs KITCREAT, KITTRIAL, KITISSUE, KITCOST, KITCOMM, GENEALOG (with the internal callees KITDB and KITQTY) and the procedures kit.usp_KitReadiness and kit.usp_KitGenealogy. Job submissions run in STERP.Jobs (https://localhost:7102) and replace the batch programs KITRDY (catalogue KITRP010/020/030) and KITDOCP (KITRP040); run status, SYSOUT, spool and result are the platform resources /api/jobs/v1/runs/{jobRunId}... (STERP-PLATFORM). The legacy behaviour is the contract: return/reason codes, message texts, data effects, units of work and quirks are reproduced as specified in application-specs/STERP-KIT.md and 01-shared-platform-contracts.md (outcome envelope 4.6, problem details 4.7, input normalization 4.4). Item codes in examples are illustrative (the demo seed binds kit parents and components to the first MADE/BOUGHT items of the company, db/seed/95-kit-demo.sql:39-53); kit references, statuses and quantities are the seeded demo values. Deferred legacy routes (create, amend, reserve/pick, complete, return, scrap, close, multi-trial, disassembly) are not exposed in v1 (STERP-KIT-dispositions.csv)."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Kit Maintenance"
    description: "Legacy screen frmKitMaint (menu KIT.MAINT 'Kit Maintenance...'): worklist, lines, review, release, kind check, commercial sets."
  - name: "Kit Execution"
    description: "Legacy screen frmKitExecution (menu KIT.EXEC 'Kit Execution...'): enquiry, issue check, issue, backflush, cost."
  - name: "Trial Kitting"
    description: "Legacy screen frmKitTrial (menu KIT.TRIAL 'Trial Kitting...'): non-committing trial and maximum build."
  - name: "Genealogy Enquiry"
    description: "Legacy screen frmKitGenealogy (menu KIT.GENEALOGY 'Genealogy Enquiry...'): trace and recall list."
  - name: "Kit Reports"
    description: "Legacy report catalogue rows KITRP010, KITRP020, KITRP030 (KITRDY) and KITRP040 (KITDOCP)."
paths:
  "/api/kit/v1/kits":
    get:
      operationId: "kit_listKitWorklist"
      summary: "Kit worklist with readiness to pick"
      description: "Returns the complete result of kit.usp_KitReadiness for the caller's company, optionally filtered by site, status and kit reference (blank or absent = NULL = all; KitArea.Opt). One row per kit with line count, short lines (RemainingQty > ReservedQty), covered lines, readiness % (decimal(5,1)), ready flag and summed issued/returned/scrapped quantities over non-cancelled lines; every kit status is listed (unlike the KITRDY batch listing, SME-1156); ordered by NeedDate (NULL first) then KitRef. Legacy chain: frmKitMaint.LoadData (frmKitMaint.vb:45-47) -> KitService.Worklist (KitService.vb:36-40) -> kit.usp_KitReadiness (db/procs/kit/usp_KitEnquiry.sql:16-60). When the procedure is not deployed the legacy returns an empty table; the target returns an empty list. The Kit Maintenance page sends site = its Site filter (default session site) and status blank for ALL."
      tags:
        - "Kit Maintenance"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "site"
          in: "query"
          required: false
          description: "@SiteCode; blank = all sites."
          schema:
            type: "string"
            maxLength: 10
            x-sterp-legacy-field: "@SiteCode varchar(10)"
            x-sterp-length: 10
          example: "RDG"
        - name: "status"
          in: "query"
          required: false
          description: "@Status; blank = all statuses. The page offers ALL, DRAFT, RELEASED, PARTISSUED, COMPLETE, CLOSED, CANCELLED (COMPLETE and CLOSED match no kit status)."
          schema:
            type: "string"
            maxLength: 14
            x-sterp-legacy-field: "@Status varchar(14)"
            x-sterp-length: 14
          example: "RELEASED"
        - name: "kitRef"
          in: "query"
          required: false
          description: "@KitRef; blank = all kits."
          schema:
            type: "string"
            maxLength: 30
            x-sterp-legacy-field: "@KitRef varchar(30)"
            x-sterp-length: 30
          example: "KIT0001002"
      responses:
        "200":
          description: "Complete worklist in legacy order."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/KitWorklistList"
              example:
                items:
                  - kitRef: "KIT0001001"
                    siteCode: "RDG"
                    parentItemCode: "FG-BIKE-COMMUTE-M"
                    status: "PARTCOMPLETE"
                    plannedGoodQty: 10.0
                    completedGoodQty: 4.0
                    needDate: "2026-11-05"
                    wipValueGBP: 1842.5
                    lineCount: 3
                    shortLines: 0
                    coveredLines: 3
                    readyPct: 100.0
                    isReady: true
                    issuedQty: 121.0
                    returnedQty: 4.0
                    scrappedQty: 1.0
                  - kitRef: "KIT0001002"
                    siteCode: "RDG"
                    parentItemCode: "FG-BIKE-COMMUTE-M"
                    status: "RELEASED"
                    plannedGoodQty: 25.0
                    completedGoodQty: 0.0
                    needDate: "2026-11-20"
                    wipValueGBP: 0.0
                    lineCount: 3
                    shortLines: 1
                    coveredLines: 2
                    readyPct: 66.7
                    isReady: false
                    issuedQty: 0.0
                    returnedQty: 0.0
                    scrappedQty: 0.0
                count: 2
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-KIT-010"
        - "FR-STERP-KIT-050"
      x-sterp-legacy:
        forms:
          - "frmKitMaint.LoadData (dotnet/STERP.Desktop/Forms/Kits/frmKitMaint.vb:45-47)"
        facade:
          - "KitService.Worklist (dotnet/STERP.Business/Kits/KitService.vb:36-40)"
          - "KitArea.Opt (KitArea.vb:84-87)"
        sql:
          - "kit.usp_KitReadiness (db/procs/kit/usp_KitEnquiry.sql:16-60)"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One autocommit procedure call on a short connection (legacy SqlHelper, STERP.Data/SqlHelper.cs:56-120); kit.usp_KitReadiness makes no persistent write (Agent 03 SQL-Programmability.csv). No transaction."
      x-sterp-wave: "W9"
      x-sterp-screen-gate:
        anyOf:
          - "KIT.EXEC.CREATE"
        sources:
          - "menu:KIT.MAINT=KIT.EXEC.CREATE"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/kit/v1/kits/{kitRef}":
    get:
      operationId: "kit_getKit"
      summary: "Kit enquiry: header and every requirement line"
      description: "Reproduces KitService.Enquire (KitService.vb:76-83): KITCREAT ENQUIRE (KC-SITE = X-STERP-Site, FROM-LINE 0, WIN-MAX 20) then GETLINE while KC-MORE-LINES = Y with FROM-LINE = rows already returned (KitArea.Page, KitArea.vb:66-81), inside one request. Blank reference -> 422 KIT0003 'A kit reference is required.'; unknown kit -> 404 KIT0001 'Kit <ref> is not known in this company.'; driver failure -> 500 SQL0001. Lines come in LineNum order including CLOSED and CANCELLED, with net issued, remaining and excess recomputed by KITQTY LINEQTY (return code ignored) and a blank description (KITCREAT.cob:752-843). Parity: because the pager passes a count as a 1-based start, the line at position 20 is returned twice when the kit has more than 20 lines (SME-644; BC-KIT-05). completeness and shortageCnt are returned as ENQUIRE leaves them (blank, 0). The kit id KITCREAT retains between calls is replaced by the explicit kitRef (decision D-KIT-01; BC-KIT-01, SME-029). Refusals (404/422/500) carry the problem data member (contracts 4.7): a KitExecutionKit with the header as the program left it and the lines already collected (none when the first call fails), because frmKitMaint/frmKitExecution populate the grid from the facade table before the error dialog (decision D-KIT-08)."
      tags:
        - "Kit Maintenance"
        - "Kit Execution"
      parameters:
        - "$ref": "#/components/parameters/KitKitRefPath"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "RC 0 (or 4) - kit header and all lines."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/KitExecutionKitEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
