                  parentRev: ""
                  bomId: 0
                  bomRev: ""
                  sourceType: "STOCK"
                  sourceRef: "KIT0001001"
                  jobRef: ""
                  parentKitRef: ""
                  plannedQty: 10.0
                  completedQty: 4.0
                  rejectedQty: 0.0
                  grossStarts: 10.0
                  yield: 1.0
                  quantum: 0.0
                  batchSize: 0.0
                  runCount: 1
                  batchCount: 0
                  needDate: "2026-11-05"
                  startDate: "2026-10-26"
                  completeDate: "2026-11-05"
