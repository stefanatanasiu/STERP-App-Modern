      description: "Reproduces KitService.Trial (KitService.vb:100-109,129-148): KITTRIAL TRIAL then GETLINE (0-based offset, no repeated lines) inside one request; selection date = business date; committed always N; nothing is written. KITTRIAL (KITTRIAL.cob:116-650): blank parentItem -> 422 KIT0003 'A parent item is required for a trial.'; requestedQty <= 0 -> 422 KIT0003 'The requested quantity must be greater than zero.'; site and dates default to the session values; one probe: BOMEXPL EXPLODE (calculation EXECUTION, view LEVEL1 when useSubassy Y else LEAF) - BOMEXPL RC > 4 -> 422 KIT0004 with its message, incomplete bill -> RC 4 KIT0004; NOTE/RESOURCE/BYPROD nodes, SERVICE/COSTONLY/NONSTOCK/NOTE supply and zero lines are skipped; net = requirement - stock used by the explosion; free stock from AVAILQ AVAIL for demand KIT/kitRef at the required date (own reservations added back, read once per item, drawn down across lines); expected inbound only when useInbound Y; a residual makes the trial infeasible; the limiting item has the largest residual. Feasible -> RC 0 'Feasible. Maximum complete output <qty>.' with action hint 'RELEASE OR RESERVE'; infeasible -> RC 4 KIT0010 (unless an earlier RC was set) with 'Short on <item> by <qty>. Nothing has been reserved or ordered.' and action hint 'REDUCE, SUBSTITUTE OR ORDER' (KITTRIAL.cob:571-594). The retained KITTRIAL result never crosses requests (decision D-KIT-02). Refusals carry the problem data member (contracts 4.7): a KitTrialResult with the summary as left and no lines, because frmKitTrial populates the empty grid before the error dialog (decision D-KIT-08)."
      tags:
        - "Trial Kitting"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
