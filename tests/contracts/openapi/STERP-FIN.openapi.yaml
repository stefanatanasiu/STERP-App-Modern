openapi: "3.1.0"
info:
  title: "STERP Finance (general ledger, VAT, bank, period close) API (STERP-FIN)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Online and batch API of slice FIN (target application STERP-FIN, wave W5, API segment fin): manual journals (GLVALID LINE, JNLENTRY VALIDAT/SAVE, JNLPOST POST/REVERSE over the fin.JournalStage + fin.usp_PostJournal posting contract), journal enquiry, period close checklist (PERCLOSE), bank reconciliation (BANKREC), the nine-box VAT return (VATRET9, VATDET, VATERRC) with a local, never transmitted VAT hand-off file, and the finance batch programs and job streams (TBRPT, PLRPT, BSRPT, CASHBOOK, BUDGRPT, RECURJNL, REVALRUN, MTDJSON, YEAREND; MONTHEND, NIGHTLY, VATRET, YEAREND streams). The legacy behaviour is the contract: return codes, reason codes, messages, data effects and units of work reproduce the legacy VB.NET facades (STERP-App/dotnet/STERP.Business/Finance/*.vb), forms (STERP-App/dotnet/STERP.Desktop/Forms/Finance/*.vb), COBOL programs (STERP-App/cobol/online/fin, STERP-App/cobol/batch/fin) and procedures (STERP-App/db/procs/fin) at commit 00631916e85a. Conventions (headers, outcome envelope, status mapping, normalization, jobs) are those of 01-shared-platform-contracts.md; requirements are in STERP-FIN.md (FR-STERP-FIN-nnn). Generic job run status, SYSOUT, spool and result resources are PLATFORM paths under /api/jobs/v1/runs on STERP.Jobs."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Journal Entry"
    description: "Legacy screen frmJournalEntry (Finance > Journal Entry...)."
  - name: "Journal Enquiry"
    description: "Legacy screen frmJournalEnquiry (Finance > Journal Enquiry...)."
  - name: "Period Close Checklist"
    description: "Legacy screen frmPeriodClose (Finance > Period Close Checklist...)."
  - name: "Bank Reconciliation"
    description: "Legacy screen frmBankRecon (Finance > Bank Reconciliation...)."
  - name: "VAT Return"
    description: "Legacy screen frmVatReturn (Finance > VAT Return..., VAT Review / Finalise..., VAT Local File (not transmitted)...)."
  - name: "Finance Reports"
    description: "Report programs launched from Finance > Finance Reports (frmReportLauncher) and the report catalogue."
  - name: "Finance Runs"
    description: "Posting and extract programs launched from Finance > Finance Runs (frmReportLauncher)."
  - name: "Job Streams"
    description: "Windows job streams jobs/MONTHEND.cmd, NIGHTLY.cmd, VATRET.cmd, YEAREND.cmd, addressed by their catalogue codes JOB.<STREAM>."
paths:
  "/api/fin/v1/journal-lines/validate":
    post:
      operationId: "fin_validateJournalLine"
      summary: "Validate one journal line against the chart of accounts and the dimension rules"
      description: "Reproduces JournalService.ValidateLine (STERP-App/dotnet/STERP.Business/Finance/JournalService.vb:32-47), called by frmJournalEntry Add line (frmJournalEntry.vb:90-121): GLVALID function LINE with posting date = business date, source module FIN and manual entry Y. GLVALID (STERP-App/cobol/online/fin/GLVALID.cob) upper-cases account and dimensions (101-142), requires company GLV0001 and account GLV0002 (144-165), reads fin.Account + fin.AccountClass (not found RC 16 GLV0003, 180-260), refuses summary GLV0004, not ACTIVE GLV0005, outside ValidFrom..ValidTo GLV0006, manual entry on AllowManualJournal = 0 GLV0007 (262-320), then applies fin.AccountDimRule (missing rule = OPTIONAL) and active fin.DimensionValue for cost centre GLV0010-0012 and project GLV0013-0015 (325-505). VAT code, DR/CR and amount are accepted and not used (SME-135). Read-only. FR-STERP-FIN-011."
      tags:
        - "Journal Entry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FinJournalLineValidationRequest"
            example:
              account: "6500"
              costCentre: "ADMIN"
              project: "GEN"
              vatCode: ""
              drCr: "DR"
              amount: 25.0
      responses:
        "200":
          description: "RC 0 - the line is valid (GLVALID answer)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/FinJournalLineValidation"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: "FIN-002"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  account: "6500"
                  accountName: "Administrative expenses"
                  classCode: "ADMIN"
                  classType: "EXPENSE"
                  normalBalance: "DR"
                  statement: "PL"
                  accountKind: "POSTING"
                  accountStatus: "ACTIVE"
                  controlType: ""
                  controlSubledger: ""
                  allowManual: "Y"
                  vatEligible: "N"
                  ccRequirement: "MANDATORY"
                  projRequired: "OPTIONAL"
                  ccName: "Administration"
                  projName: "General"
                  valid: "Y"
                  failField: ""
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-FIN-011"
        - "FR-STERP-FIN-040"
      x-sterp-legacy:
        forms:
          - "frmJournalEntry.AddLineClicked (frmJournalEntry.vb:90-121)"
        facade:
          - "JournalService.ValidateLine (JournalService.vb:32-47)"
        programs:
          - "GLVALID#LINE (GLVALID.cob:325-505)"
        procedures: []
      x-sterp-permission:
        - "menu:FIN.JOURNAL.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read-only: GLVALID issues only SELECTs in autocommit; no unit of work (GLVALID has no transaction verbs; agent-02 L02-fin leaf-shared-state 3.2)."
      x-sterp-wave: "W5"
      x-sterp-screen-gate:
        anyOf:
          - "FIN.JOURNAL.ENTER"
        sources:
          - "menu:FIN.JOURNAL.ENTRY=FIN.JOURNAL.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/fin/v1/journal-drafts/validate":
    post:
      operationId: "fin_validateJournalDraft"
      summary: "Validate a manual journal (balance, lines, period) without writing anything"
      description: "Reproduces JournalService.Prepare(\"VALIDAT\") (JournalService.vb:50-81: type default GL, currency default the company base currency, prepared by the user, dates default to the business date, at most 50 lines) and JNLENTRY VALIDAT (STERP-App/cobol/online/fin/JNLENTRY.cob): defaults (108-147); JNL0001 company, JNL0002 correlation id (= Idempotency-Key), JNL0003 description, JNL0004 zero lines (151-184); per line JNL0010 both sides, JNL0011 no value, JNL0012 negative, then GLVALID LINE with manual Y for source FIN and type GL (212-278, 319-330); totals and out-of-balance (189-210); PERIODCK CHECK/POST, RC > 4 propagated - PER0003 hard closed RC 8, PER0006 soft closed RC 6 (280-302); JNL0020 unbalanced (304-317). Outcome precedence: balance over period over line errors; the reason code of the last bad line with the message of the first (SME-1339). Example refusal for posting date 2026-05-15: 422 PER0003 'Period 202602 is hard closed - post the correction in the current open period or ask the financial controller to reopen it'. FR-STERP-FIN-012."
      tags:
        - "Journal Entry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FinJournalDraftRequest"
            example:
              journalRef: "QA-2610-01"
              journalType: "GL"
              description: "Demo journal 25.00 6500/7000"
              currency: "GBP"
              evidenceRef: "QA-EVID-01"
              documentDate: "2026-10-15"
              postingDate: "2026-10-15"
              lines:
                - account: "6500"
                  debit: 25.0
                  credit: 0.0
                  costCentre: "ADMIN"
                  project: "GEN"
                  vatCode: ""
                  narrative: "Demo debit"
                - account: "7000"
                  debit: 0.0
                  credit: 25.0
                  costCentre: "ADMIN"
                  project: "GEN"
                  vatCode: ""
                  narrative: "Demo credit"
      responses:
        "200":
          description: "RC 0 - validated (or RC 4)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/FinJournalDraftResult"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Journal validated, 25.00 each side, period OPEN"
                  messageCount: 0
                  documentRef: "FIN-004"
                  correlationId: "7d0b8a51-6e0f-4c63-9f1b-2a64d1c9e0aa"
                data:
                  totalDebit: 25.0
                  totalCredit: 25.0
                  outOfBalance: 0.0
                  periodStatus: "OPEN"
                  fiscalYear: 2026
                  periodNo: 7
                  errorCnt: 0
                  firstBadLine: 0
                  stagedCnt: 0
                  status: ""
                  lines:
                    - lineNum: 1
                      account: "6500"
                      debit: 25.0
                      credit: 0.0
                      costCentre: "ADMIN"
                      project: "GEN"
                      vatCode: ""
                      narrative: "Demo debit"
                      lineStatus: "OK"
                      lineMessage: ""
                    - lineNum: 2
                      account: "7000"
                      debit: 0.0
                      credit: 25.0
                      costCentre: "ADMIN"
                      project: "GEN"
                      vatCode: ""
                      narrative: "Demo credit"
                      lineStatus: "OK"
                      lineMessage: ""
        "202":
          description: "RC 6 HOLD - the posting date is in a soft-closed period and the user lacks FIN.PERIOD.SOFTPOST (PER0006)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/FinJournalDraftResult"
              example:
                outcome:
                  returnCode: 6
                  severity: "HOLD"
                  reasonCode: "PER0006"
                  message: "Period 202606 is soft closed - only an authorised close adjustment may be posted into it"
                  messageCount: 1
                  documentRef: "FIN-004"
                  correlationId: "7d0b8a51-6e0f-4c63-9f1b-2a64d1c9e0aa"
                data:
                  totalDebit: 25.0
                  totalCredit: 25.0
                  outOfBalance: 0.0
                  periodStatus: "SOFT"
                  fiscalYear: 2026
                  periodNo: 6
                  errorCnt: 1
                  firstBadLine: 0
                  stagedCnt: 0
                  status: ""
                  lines: []
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-FIN-012"
        - "FR-STERP-FIN-040"
      x-sterp-legacy:
        forms:
          - "frmJournalEntry.ValidateClicked (frmJournalEntry.vb:138-146)"
        facade:
          - "JournalService.Prepare (JournalService.vb:50-81)"
        programs:
          - "JNLENTRY#VALIDAT (JNLENTRY.cob:189-330)"
          - "GLVALID#LINE"
          - "PERIODCK#CHECK (STERP-App/cobol/online/common/PERIODCK.cob)"
        procedures: []
      x-sterp-permission:
        - "menu:FIN.JOURNAL.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read-only: JNLENTRY VALIDAT, GLVALID and PERIODCK issue only SELECTs; nothing is written (JNLENTRY.cob:186-189)."
      x-sterp-wave: "W5"
      x-sterp-screen-gate:
        anyOf:
          - "FIN.JOURNAL.ENTER"
        sources:
          - "menu:FIN.JOURNAL.ENTRY=FIN.JOURNAL.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/fin/v1/journal-drafts/save":
    post:
      operationId: "fin_saveJournalDraft"
      summary: "Save the journal draft and stage its lines under the correlation id (Idempotency-Key)"
      description: "Reproduces JournalService.Prepare(\"SAVE\") called by frmJournalEntry Post before posting (frmJournalEntry.vb:150-169) and JNLENTRY SAVE (JNLENTRY.cob:335-372): the full validation runs first; the draft is saved even when lines or the period failed unless RC is 12 (guard at 337, SME-144); content hash (420-433); one unit of work opened only when @@TRANCOUNT = 0 (381-411): UPDATE fin.JournalDraft by CorrelationId (SUBMITTED/APPROVED return to DRAFT and the approver is cleared when the hash changed) or INSERT a DRAFT row (435-536), DELETE and re-INSERT fin.JournalStage lines (537-593), COMMIT; RC 12 rolls back. Message 'Draft journal saved with <status> period. No ledger effect until it is posted' when RC < 8, otherwise the validation error stays (and the draft is still written). JE-JOURNAL-REF and JE-FX-RATE are not stored (SME-148). Send the same Idempotency-Key as on validate and post (legacy JournalService.CorrelationId, JournalService.vb:16,27-29). FR-STERP-FIN-013."
      tags:
        - "Journal Entry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FinJournalDraftRequest"
            example:
              journalRef: "QA-2610-01"
              journalType: "GL"
              description: "Demo journal 25.00 6500/7000"
              currency: "GBP"
              evidenceRef: "QA-EVID-01"
              documentDate: "2026-10-15"
              postingDate: "2026-10-15"
              lines:
                - account: "6500"
                  debit: 25.0
                  credit: 0.0
                  costCentre: "ADMIN"
                  project: "GEN"
                  vatCode: ""
                  narrative: "Demo debit"
                - account: "7000"
                  debit: 0.0
                  credit: 25.0
                  costCentre: "ADMIN"
                  project: "GEN"
                  vatCode: ""
                  narrative: "Demo credit"
      responses:
        "200":
          description: "RC 0 - draft saved and lines staged."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/FinJournalDraftResult"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Draft journal saved with OPEN period. No ledger effect until it is posted"
                  messageCount: 0
                  documentRef: "FIN-004"
                  correlationId: "7d0b8a51-6e0f-4c63-9f1b-2a64d1c9e0aa"
                data:
                  totalDebit: 25.0
                  totalCredit: 25.0
                  outOfBalance: 0.0
                  periodStatus: "OPEN"
                  fiscalYear: 2026
                  periodNo: 7
                  errorCnt: 0
                  firstBadLine: 0
                  stagedCnt: 2
                  status: "DRAFT"
                  lines:
                    - lineNum: 1
                      account: "6500"
                      debit: 25.0
                      credit: 0.0
                      costCentre: "ADMIN"
                      project: "GEN"
                      vatCode: ""
                      narrative: "Demo debit"
                      lineStatus: "OK"
                      lineMessage: ""
                    - lineNum: 2
                      account: "7000"
                      debit: 0.0
                      credit: 25.0
                      costCentre: "ADMIN"
                      project: "GEN"
                      vatCode: ""
                      narrative: "Demo credit"
                      lineStatus: "OK"
                      lineMessage: ""
        "202":
          description: "RC 6 HOLD - soft-closed period without FIN.PERIOD.SOFTPOST (PER0006); the draft has been written."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/FinJournalDraftResult"
              example:
                outcome:
                  returnCode: 6
                  severity: "HOLD"
                  reasonCode: "PER0006"
                  message: "Period 202606 is soft closed - only an authorised close adjustment may be posted into it"
                  messageCount: 1
                  documentRef: "FIN-004"
                  correlationId: "7d0b8a51-6e0f-4c63-9f1b-2a64d1c9e0aa"
                data:
                  totalDebit: 25.0
                  totalCredit: 25.0
                  outOfBalance: 0.0
                  periodStatus: "SOFT"
                  fiscalYear: 2026
                  periodNo: 6
                  errorCnt: 1
                  firstBadLine: 0
                  stagedCnt: 2
                  status: "DRAFT"
                  lines: []
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-FIN-013"
        - "FR-STERP-FIN-040"
      x-sterp-legacy:
        forms:
          - "frmJournalEntry.PostClicked (frmJournalEntry.vb:150-169)"
        facade:
          - "JournalService.Prepare (JournalService.vb:50-81)"
        programs:
          - "JNLENTRY#SAVE (JNLENTRY.cob:335-593)"
          - "GLVALID#LINE"
          - "PERIODCK#CHECK"
        procedures: []
      x-sterp-permission:
        - "menu:FIN.JOURNAL.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "One unit of work owned by JNLENTRY when @@TRANCOUNT = 0 (always for an API request): UPDATE or INSERT fin.JournalDraft, DELETE fin.JournalStage for the correlation id, INSERT one fin.JournalStage row per line, COMMIT; ROLLBACK when RC 12 (JNLENTRY.cob:335-411). Validation reads precede the unit."
      x-sterp-wave: "W5"
      x-sterp-screen-gate:
        anyOf:
          - "FIN.JOURNAL.ENTER"
        sources:
          - "menu:FIN.JOURNAL.ENTRY=FIN.JOURNAL.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/fin/v1/journals/post":
    post:
      operationId: "fin_postJournal"
      summary: "Post the lines staged under the correlation id (Idempotency-Key)"
      description: "Reproduces JournalService.Post (JournalService.vb:84-94: description, source reference = journal ref, type, currency, evidence, posting date; no document date, so JNLPOST defaults it to the posting date, BC-FIN-08) and JNLPOST POST (STERP-App/cobol/online/fin/JNLPOST.cob): defaults GBP/GL/FIN/series JNL/dates (98-157); JNP0001 company, JNP0002 correlation id; PERMCHK FIN.JOURNAL.POST (163-167, 239-256; refusal RC 6 PRM0006 -> 202); period decision query - no period JNP0016 RC 8, SOFT without FIN.PERIOD.SOFTPOST JNP0017 RC 6, HARD/FUTURE JNP0018 RC 8 (417-492); EXEC fin.usp_PostJournal through the posting gateway (STERP-App/db/procs/fin/usp_PostJournal.sql; THROW 50009-50014, 50016, 50017; FR-STERP-FIN-010); duplicate correlation id -> RC 4 JNP0007 'That instruction had already been carried out. Journal <n> is the original result, and no second entry has been made' (258-288); no result row RC 12 JNP0003; driver errors classified by 9300 (630-648: STERP-E- at position 1 -> RC 8 with reason characters 7-12, else RC 12 SQL0001; SME-011); then fin.JournalDraft -> POSTED (290-307) and an AUDITLOG POST row (309-330), both unchecked and also on duplicates. FR-STERP-FIN-014, FR-STERP-FIN-010."
      tags:
        - "Journal Entry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FinJournalPostRequest"
            example:
              description: "Demo journal 25.00 6500/7000"
              sourceRef: "QA-2610-01"
              journalType: "GL"
              currency: "GBP"
              evidenceRef: "QA-EVID-01"
              postingDate: "2026-10-15"
      responses:
        "200":
          description: "RC 0 posted, or RC 4 JNP0007 (already posted under this correlation id)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/FinJournalPostResult"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Journal JN00000187 posted, 25.00 GBP each side"
                  messageCount: 0
                  documentRef: "FIN-005"
                  correlationId: "7d0b8a51-6e0f-4c63-9f1b-2a64d1c9e0aa"
                data:
                  journalId: 4211
                  journalNumber: "JN00000187"
                  fiscalYear: 2026
                  periodNo: 7
                  totalDrGbp: 25.0
                  totalCrGbp: 25.0
                  status: "POSTED"
                  wasDuplicate: "N"
        "202":
          description: "RC 6 HOLD - PRM0006 (user does not hold FIN.JOURNAL.POST) or JNP0017 (soft-closed period without FIN.PERIOD.SOFTPOST)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/FinJournalPostResult"
              example:
                outcome:
                  returnCode: 6
                  severity: "HOLD"
                  reasonCode: "PRM0006"
                  message: "VATOWNER does not hold FIN.JOURNAL.POST"
                  messageCount: 1
                  documentRef: "FIN-005"
                  correlationId: "7d0b8a51-6e0f-4c63-9f1b-2a64d1c9e0aa"
                data:
                  journalId: 0
                  journalNumber: ""
                  fiscalYear: 0
                  periodNo: 0
                  totalDrGbp: 0.0
                  totalCrGbp: 0.0
                  status: ""
                  wasDuplicate: "N"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-FIN-014"
        - "FR-STERP-FIN-010"
        - "FR-STERP-FIN-040"
      x-sterp-legacy:
        forms:
          - "frmJournalEntry.PostClicked (frmJournalEntry.vb:150-169)"
