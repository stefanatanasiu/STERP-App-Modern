          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: "Not authenticated (API0401)."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    Forbidden:
      description: "No STERP user (API0010), company/site not permitted (API0002), run-as refused (API0003), or a legacy permission refusal."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    NotFound:
      description: "Legacy RC 16 (NOT FOUND)."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    BusinessRule:
      description: "Legacy RC 08 or procedure THROW 'STERP-<s>-<code>: text' - no business effect."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    Severe:
      description: "Legacy RC 12 (SQL0001 and other severe errors) or SYS0001."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    NotImplemented:
      description: "API0501 - the operation belongs to a slice not yet delivered, or a job stream step is in an undelivered slice."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
