  "/api/ar/v1/customers/{customerCode}/credit-check":
    post:
      operationId: "ar_checkCustomerCredit"
      summary: "Credit check and release decision (CREDCHK CHECK)"
      description: "Links CREDCHK function CHECK as DebtorsService.CreditCheck (DebtorsService.vb:76-88): CK-CUSTOMER, CK-CHECK-POINT (blank -> ORDER), CK-DOCUMENT-REF, CK-EVAL-DATE = business date, CK-CURRENCY (blank -> base currency), CK-ORDER-VALUE, new correlation id. CREDCHK computes exposure = open debt - eligible credits + firm unshipped orders + shipped-not-billed - deposits (>= 0, sterling, as of the evaluation date), stores ar.CustomerCredit.LastExposureGBP, and decides: BLOCK (RC 08 CRD0020/CRD0021/CRD0022, 422), HOLD (RC 06 CRD0030-CRD0034, 202, raises a HOLD exception for CREDMGR), release under override (RC 04 CRD0040) or RC 00 \"Credit available: GBP <headroom>\" which discards an exposure error (SME-693, reproduced). Unknown customer RC 16 CRD0004 (404); validation RC 08 CRD0001-CRD0003, CRD0011 (422). CREDCHK.cob:85-845."
