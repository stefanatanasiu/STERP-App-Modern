  "/api/ar/v1/allocations":
    post:
      operationId: "ar_allocateReceipt"
      summary: "Allocate a receipt, credit or deposit to open items (RCPTALOC ALLOCATE)"
      description: "Links RCPTALOC ALLOCATE with the named source (sourceItemId and/or sourceDoc as returned by ar_recordReceipt), receipt and effective dates, posting date = business date and 1-20 lines. Same checks as ar_previewAllocation, plus the period check (RC >= 06 stops); any stop RC 06-16 rolls the whole instruction back. Writes one ACTIVE ar.Allocation per line, reduces target residuals (SETTLED/PARTIAL, WrittenOff), posts one GBP adjustment journal through ARPOSTGL only when discount, write-off or realised FX totals are non-zero (event = last component present; correlation = first 30 characters of the Idempotency-Key + -ALLOC), updates the source item and its receipt, commits, and returns \"Allocated <applied> from <source>; unapplied residual <left>\". ALLOCATE claims no idempotency key of its own (legacy). The page calls it after a successful ar_recordReceipt with a NEW Idempotency-Key (DebtorsService.RunReceipt draws a new correlation id per link, DebtorsService.vb:170-174). RCPTALOC.cob:826-890,893-1605."
