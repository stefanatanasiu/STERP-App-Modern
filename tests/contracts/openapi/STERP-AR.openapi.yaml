openapi: "3.1.0"
info:
  title: "STERP Debtors (accounts receivable) API (STERP-AR)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Module API of slice STERP-AR (wave W2), segment ar: the Debtors (sales ledger) online operations hosted by STERP.Api and the AR batch jobs and streams hosted by STERP.Jobs. The legacy behaviour is the contract: each operation reproduces the legacy WinForms facade DebtorsService (dotnet/STERP.Business/Debtors/DebtorsService.vb), the COBOL programs it links (CREDCHK, RCPTALOC, ARDISPUT, ARENQ) and the ar.* procedures it calls, with the same return/reason codes, messages, data effects and units of work (x-sterp-uow), mapped to HTTP by 01-shared-platform-contracts.md section 4.6 (RC 00/04 -> 200 envelope, RC 06 HOLD -> 202 envelope, RC 08 or procedure THROW -> 422, RC 16 -> 404, RC 12/SYS0001 -> 500). The in-process contracts consumed by STERP-SO (CREDCHK, ARDEPOS, ARINVPST, ARCRNOTE) and the internal kernels ARPOSTGL/ARVATWRT are not HTTP operations; their COMMAREA schemas are included as ArInproc* components for reference. Programs reachable only from legacy test drivers (ARADJUST, ARINSOLV, BADDEBT, CUSTVAL, DDMAND, DISHONOR, LATEINT) are deferred and not exposed (SME-004). Generic job run status, SYSOUT, spool and result resources are the platform resources (/api/jobs/v1/runs/...). Specification: application-specs/STERP-AR.md. Examples use the legacy demo data (company STC) and are illustrative where they show generated numbers or texts."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Customer Enquiry"
    description: "Debtors > Customer Enquiry... (frmCustomerEnquiry) and its lookups and credit check."
  - name: "Credit Overrides"
    description: "Debtors > Credit Overrides... and Sales > Request Credit Override... (frmCreditOverride)."
  - name: "Receipt Entry"
    description: "Debtors > Receipt Entry... (frmReceiptEntry): receipts, preview, allocation, correction."
  - name: "Credit Control Worklist"
    description: "Debtors > Credit Control Worklist... (frmCreditControl): worklist, disputes, promises to pay."
  - name: "Debtors Reports"
    description: "Debtors > Debtors Reports (report catalogue programs) on STERP.Jobs."
  - name: "Job Streams"
    description: "AR job streams DDCOLL and STMTS on STERP.Jobs."
paths:
  "/api/ar/v1/customers":
    get:
      operationId: "ar_listCustomers"
      summary: "Customer account list (F2 lookup)"
      description: "Named lookup replacing DebtorsService.CustomerPickSql: SELECT CustomerCode, LegalName AS CustomerName, CurrencyCode, CreditState, BalanceGBP FROM ar.vw_CustomerBalance WHERE CompanyCode = @CompanyCode AND (@Search IS NULL OR CustomerCode LIKE @Search + '%' OR LegalName LIKE '%' + @Search + '%') ORDER BY CustomerCode. An empty search is sent as SQL NULL (SqlHelper.cs:33) and returns every customer of the company. Complete result, no paging (contracts 4.10). No business permission check; the calling pages are menu-gated. Legacy chain: frmCustomerEnquiry.OnLookup / frmReceiptEntry.OnLookup -> frmLookup.Pick -> LookupService.Find (MaintService.vb:80-84) -> DebtorsService.CustomerPickSql (DebtorsService.vb:17-23)."
      tags:
        - "Customer Enquiry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "search"
          in: "query"
          required: false
          description: "Code prefix or part of the legal name; empty = all."
          schema:
            type: "string"
            x-sterp-legacy-field: "@Search (frmLookup txtSearch)"
          example: "C00"
      responses:
        "200":
          description: "Complete customer list ordered by code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ArCustomerPickList"
              examples:
                demo:
                  summary: "STC customers matching C00"
                  value:
                    items:
                      - customerCode: "C0001"
                        customerName: "Pennine Cycles"
                        currencyCode: "GBP"
                        creditState: "OVERDUE"
                        balanceGbp: 8200.0
                    count: 1
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-AR-011"
      x-sterp-legacy:
        - "dotnet/STERP.Business/Debtors/DebtorsService.vb:17-23"
        - "dotnet/STERP.Business/System/MaintService.vb:80-84"
        - "dotnet/STERP.Desktop/Forms/Debtors/frmCustomerEnquiry.vb:35-40"
        - "dotnet/STERP.Desktop/Forms/Debtors/frmReceiptEntry.vb:44-49"
        - "db/views/ar/vw_ArDebtors.sql:38-79"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One SELECT on a short ADO.NET connection in autocommit (SqlHelper text command); no transaction, no writes."
      x-sterp-wave: "W2"
      x-sterp-screen-gate:
        anyOf:
          - "AR.ENQUIRY"
          - "AR.RECEIPT.ENTER"
        sources:
          - "menu:AR.CUSTOMER.ENQ=AR.ENQUIRY"
          - "menu:AR.RECEIPT.ENTRY=AR.RECEIPT.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
