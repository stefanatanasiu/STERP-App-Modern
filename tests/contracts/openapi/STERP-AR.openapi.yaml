      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One call of ar.usp_CustomerStatementLines on a short ADO.NET connection in autocommit; read-only."
      x-sterp-wave: "W2"
      x-sterp-screen-gate:
        anyOf:
