          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-AR-013"
      x-sterp-legacy:
        - "dotnet/STERP.Desktop/Forms/Debtors/frmCustomerEnquiry.vb:145-153"
