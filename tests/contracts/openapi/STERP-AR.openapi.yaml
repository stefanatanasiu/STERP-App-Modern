                        openItemId: 1001
                        itemType: "INVOICE"
                        documentNumber: "SI-26-1001"
                        documentDate: "2026-05-14"
                        dueDate: "2026-06-13"
                        currencyCode: "GBP"
                        originalAmount: 9600.0
