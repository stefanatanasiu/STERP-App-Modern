  "/api/ar/v1/customers/{customerCode}/statement-lines":
    get:
      operationId: "ar_getCustomerStatementLines"
      summary: "Customer statement lines"
      description: "Calls ar.usp_CustomerStatementLines @CompanyCode, @CustomerCode, @AsOf, @Style WITHOUT @UserCode, so the procedure permission check is not applied (as DebtorsService.Statement, DebtorsService.vb:55-58). Returns the header (opening as at the day before the first of the as-at month, closing, movement, overdue, credits, rebuilt by ar.fn_OpenItemAsOf) and the lines (OPENITEM: items outstanding at asAt with running balance; TRANSACTION: brought-forward line then the month's movements). THROW 50306 (unknown style) and 50302 (unknown customer) -> 422 E-0306/E-0302. The enquiry page sends style OPENITEM and shows the last result set (frmCustomerEnquiry.vb:145-153)."
      tags:
        - "Customer Enquiry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "customerCode"
          in: "path"
          required: true
          description: "Legacy customer account code (ar.Customer.CustomerCode). Pages upper-case it before calling (frmCustomerEnquiry.vb:49, frmReceiptEntry.vb:70)."
          schema:
            type: "string"
            maxLength: 20
            x-sterp-legacy-field: "@CustomerCode varchar(20) / CK-CUSTOMER, EQ-CUSTOMER PIC X(20)"
        - name: "asAt"
          in: "query"
          required: false
          description: "Statement date; procedure default = server date when absent."
          schema:
            type: "string"
            format: "date"
            x-sterp-legacy-field: "@AsOf date"
          example: "2026-10-07"
        - name: "style"
          in: "query"
          required: false
          description: "OPENITEM or TRANSACTION (validated by the procedure)."
          schema:
            type: "string"
            maxLength: 12
            default: "OPENITEM"
            x-sterp-legacy-field: "@Style varchar(12)"
          example: "OPENITEM"
      responses:
        "200":
          description: "Header and lines."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ArStatementLines"
              examples:
                demo:
