  "/api/ar/v1/customers/{customerCode}/metrics":
    get:
      operationId: "ar_getCustomerMetrics"
      summary: "Customer trading metrics (ARENQ METRICS)"
      description: "Links ARENQ function METRICS with EQ-CUSTOMER, EQ-AS-AT = asAt, EQ-FROM-DATE = asAt - 12 months, EQ-TO-DATE = asAt (DebtorsService.Metrics, DebtorsService.vb:64-72). ARENQ validates (RC 08 ENQ0001-ENQ0003), checks AR.CUSTOMER.ENQUIRE (refusal RC 06 ENQ0004 -> 202 HOLD, no figures), reads the customer (RC 16 ENQ0010 -> 404), rebuilds the balance and ageing as at asAt, exposure/utilisation (RC 04 ENQ0021 when above a positive limit, ENQ0020 when buckets do not reconcile) and the metrics; DSO undefined (dsoDefined N, dso 0.00, RC 04 ENQ0030) without positive credit sales. ARENQ.cob:103-126,192-311,318-480,483-705."
      tags:
        - "Customer Enquiry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "customerCode"
          in: "path"
          required: true
          description: "Legacy customer account code (ar.Customer.CustomerCode). Pages upper-case it before calling (frmCustomerEnquiry.vb:49, frmReceiptEntry.vb:70)."
          schema:
            type: "string"
            maxLength: 20
            x-sterp-legacy-field: "@CustomerCode varchar(20) / CK-CUSTOMER, EQ-CUSTOMER PIC X(20)"
        - name: "asAt"
          in: "query"
          required: false
          description: "As-at date; default the business date (frmCustomerEnquiry.AsAt, frmCustomerEnquiry.vb:42-45)."
          schema:
            type: "string"
            format: "date"
            x-sterp-legacy-field: "EQ-AS-AT PIC 9(8)"
          example: "2026-10-07"
