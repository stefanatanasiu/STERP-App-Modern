                      severity: "WARNING"
                      reasonCode: "ENQ0030"
                      message: "Days sales outstanding is undefined: there were no credit sales in the stated period"
                      messageCount: 1
                      documentRef: null
                      correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    data:
                      customer: "C0001"
                      asAt: "2026-10-07"
                      fromDate: "2025-10-07"
                      toDate: "2026-10-07"
