                      asOf: "2026-10-07"
                      statementName: null
                      line1: null
                      town: null
                      county: null
                      postcode: null
                      countryCode: null
                      openingGbp: 8200.0
                      closingGbp: 8200.0
                      movementGbp: 0.0
                      overdueGbp: 8200.0
                      creditsGbp: 0.0
                      itemCount: 1
                    lines:
