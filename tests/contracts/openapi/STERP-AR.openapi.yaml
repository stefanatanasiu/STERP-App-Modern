      summary: "Reverse an allocation (RCPTALOC UNALLOC)"
      description: "Links RCPTALOC UNALLOC with RA-ALLOC-ID, RA-CORRECT-REASON and RA-CORRECT-DATE = business date (DebtorsService.CorrectAllocation, DebtorsService.vb:177-184). AR.ALLOCATE.RUN refusal RC 06 stops (202); RCP0040 no id, RCP0041 no reason (422); RCP0042 not held (404); RCP0043 already reversed (422). One unit: contra ar.Allocation (SourceType ADJUST, REVERSED, negative amounts, ReversalOfAllocationId), original marked REVERSED, applied amount restored to target and source residuals; the receipt row, discount, write-off and FX are untouched (SME-704) and no journal is posted (journalNo blank). Message \"Allocation reversed; <applied> is unapplied again. The receipt itself is untouched.\" RCPTALOC.cob:1618-1821."
