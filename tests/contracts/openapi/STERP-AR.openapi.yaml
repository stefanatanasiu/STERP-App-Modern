        - "Customer Enquiry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "customerCode"
          in: "path"
          required: true
          description: "Legacy customer account code (ar.Customer.CustomerCode). Pages upper-case it before calling (frmCustomerEnquiry.vb:49, frmReceiptEntry.vb:70)."
          schema:
            type: "string"
            maxLength: 20
