      x-sterp-outcome: "direct"
      x-sterp-uow: "Single read in autocommit; no writes."
      x-sterp-wave: "W0"
      x-sterp-screen-gate:
        anyOf: []
        sources:
          - "menu:SYS.ENGINE=SYS.ADMIN"
          - "toolbar:frmEngineDiag=(none)"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "at least one legacy entry has no PermissionCode, so the capability was reachable without a permission"
components:
  securitySchemes:
    windows:
      type: "http"
      scheme: "negotiate"
      description: "Windows integrated authentication (Kerberos/NTLM). Browsers send the signed-on Windows identity automatically; curl: add --negotiate -u : (contracts section 5.1)."
  parameters:
    XSterpCompany:
      name: "X-STERP-Company"
      in: "header"
      required: true
      description: "Company code of the session (legacy SterpSession.CompanyCode -> CA-COMPANY / @CompanyCode). Must be in the caller's access list (core.usp_GetUserContext result set 2); otherwise 403 API0002."
      schema:
        type: "string"
        maxLength: 10
        x-sterp-legacy-field: "CA-COMPANY PIC X(10)"
      example: "STC"
    XSterpSite:
      name: "X-STERP-Site"
      in: "header"
      required: false
      description: "Site code of the session (legacy SterpSession.SiteCode -> CA-SITE). Required by site-scoped operations; must pair with the company in the access list."
      schema:
        type: "string"
        maxLength: 10
        x-sterp-legacy-field: "CA-SITE PIC X(10)"
      example: "RDG"
    XSterpBusinessDate:
      name: "X-STERP-Business-Date"
      in: "header"
      required: false
      description: "Business date (legacy SterpSession.BusinessDate -> CA-BUSINESS-DATE yyyyMMdd). Default: server local date, as legacy DateTime.Today (CobolGateway.cs:77)."
      schema:
        type: "string"
        format: "date"
        x-sterp-legacy-field: "CA-BUSINESS-DATE PIC 9(8)"
      example: "2026-10-07"
    XSterpRunAs:
      name: "X-STERP-Run-As"
      in: "header"
      required: false
      description: "SYSADM 'Continue as' user code (LoginService.SignOnAs). Honoured only when the authenticated user resolves to SYSADM; otherwise 403 API0003."
      schema:
        type: "string"
        maxLength: 20
        x-sterp-legacy-field: "CA-USER PIC X(20)"
      example: "SALESREP"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Legacy correlation id (CA-CORRELATION-ID X(36)); default a new GUID per request (CobolGateway.cs:78). Send one stable key per user instruction where the legacy reused a correlation id (COM-015)."
      schema:
        type: "string"
        maxLength: 36
        x-sterp-legacy-field: "CA-CORRELATION-ID PIC X(36)"
      example: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
    PlatformXSterpCompanyOptional:
      name: "X-STERP-Company"
      in: "header"
      required: false
      description: "Optional company of the session for operations that also work before a company is chosen (platform_getSession). When supplied it must be in the caller's access list, otherwise 403 API0002."
      schema:
        type: "string"
        maxLength: 10
        x-sterp-legacy-field: "CA-COMPANY PIC X(10)"
      example: "STC"
  schemas:
    Outcome:
      type: "object"
      description: "Legacy STCAHDR result (STERP-App/cobol/copy/STCAHDR.cpy:12-32; CobolResult.cs:6-26). returnCode 0 OK, 4 WARNING, 6 HOLD (HTTP 202). Failures (8, 12, 16) are returned as ProblemDetails."
      required:
        - "returnCode"
        - "severity"
        - "reasonCode"
        - "message"
        - "messageCount"
        - "correlationId"
      properties:
        returnCode:
          type: "integer"
          enum:
            - 0
            - 4
            - 6
          x-sterp-legacy-field: "CA-RETURN-CODE PIC 9(2)"
        severity:
          type: "string"
          enum:
            - "OK"
            - "WARNING"
            - "HOLD"
        reasonCode:
          type: "string"
          maxLength: 8
          x-sterp-legacy-field: "CA-REASON-CODE PIC X(8)"
        message:
          type: "string"
          maxLength: 200
          x-sterp-legacy-field: "CA-MESSAGE PIC X(200)"
        messageCount:
          type: "integer"
          x-sterp-legacy-field: "CA-MSG-COUNT PIC 9(2)"
        documentRef:
          type:
            - "string"
            - "null"
          maxLength: 10
          x-sterp-legacy-field: "CA-REQ-REF PIC X(10)"
        correlationId:
          type: "string"
          maxLength: 36
          x-sterp-legacy-field: "CA-CORRELATION-ID PIC X(36)"
    ProblemDetails:
      type: "object"
      description: "RFC 9457 problem (contracts 4.6-4.7). type = https://sterp.local/problems/{business-rule|severe|not-found|validation|forbidden|unauthenticated|not-implemented}; detail = legacy message; reasonCode = legacy reason (or API#### for target-only conditions)."
      required:
        - "type"
        - "title"
        - "status"
      properties:
        type:
          type: "string"
          format: "uri"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type:
            - "string"
            - "null"
        instance:
          type:
            - "string"
            - "null"
        returnCode:
          type:
            - "integer"
            - "null"
          description: "legacy CA-RETURN-CODE (8, 12, 16 or other)"
        reasonCode:
          type:
            - "string"
            - "null"
        severity:
          type:
            - "string"
            - "null"
          enum:
            - "ERROR"
            - "SEVERE"
            - "NOT FOUND"
            - "E"
            - "W"
            - "I"
            - null
        messageCount:
          type:
            - "integer"
            - "null"
        correlationId:
          type:
            - "string"
            - "null"
        traceId:
          type:
            - "string"
            - "null"
        errors:
          type:
            - "object"
            - "null"
          additionalProperties:
            type: "array"
            items:
              type: "string"
        data:
          description: "Optional (contracts 4.7): for COBOL-backed operations whose legacy screen reads the COMMAREA after a refusal, the same data object the success envelope would carry."
      example:
        type: "https://sterp.local/problems/business-rule"
        title: "Business rule refused the request"
        status: 422
        detail: "Period 202602 is hard closed."
        returnCode: 8
        reasonCode: "PER0003"
        severity: "ERROR"
        messageCount: 1
        correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
        traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
    JobRunAccepted:
      type: "object"
      description: "Returned with HTTP 202 by every job submission (contracts 8.3). Poll /api/jobs/v1/runs/{jobRunId} on STERP.Jobs."
      required:
        - "jobRunId"
        - "jobName"
        - "status"
