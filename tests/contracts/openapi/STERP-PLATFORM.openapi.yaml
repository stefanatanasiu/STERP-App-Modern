openapi: "3.1.0"
info:
  title: "STERP Platform and system services API (STERP-PLATFORM)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Platform slice STERP-PLATFORM (wave W0) of the modernized STERP ERP: sign-on and session context, menu, permission probe, lookups, approvals inbox, exception worklist, audit enquiry, generic metadata-driven file maintenance for every core.MaintDef screen, report catalogue and launch, the generic job run resources (/api/jobs/v1/runs) used by every slice, spool and SYSOUT viewing, the operator console (STERPOPS) and service diagnostics. Online operations are served by STERP.Api (https://localhost:7101); job operations by STERP.Jobs (path-level server https://localhost:7102). The shared kernel (SQLIO, PERMCHK, PERIODCK, NUMGEN, IDEMPOT, AUDITLOG, EXCPRAIS, PARMGET, DATECALC, TERMCALC, FXCONV, RNDALLOC, STRUTIL, STFUNCS, CMDARGS, RUNPATH, JOBLOG, PING and the GL posting gateway) is internal and has no public API. The legacy behaviour at commit 00631916e85a4711b3db4d3e969a4b4d41d0e541 is the contract: values, messages, reason codes, ordering, limits and data effects reproduce the legacy WinForms client, its stored procedures and the COBOL operator console (specification application-specs/STERP-PLATFORM.md; conventions 01-shared-platform-contracts.md). Target-only reason codes: API0001-API0004, API0010, API0401, API0501 (contracts 5.10) and API0020-API0024 (this slice: catalogue entry not offered, path outside the run roots, run output missing, run not restartable, unknown restart label)."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Sign On"
    description: "frmLogin 'STERP - Sign On': Windows sign-on, access list, business date, Continue as, permission probe."
  - name: "Menu"
    description: "frmMain menu bar built from core.MenuItem (core.usp_UiMenuLoad)."
  - name: "Lookup"
    description: "frmLookup F2 lookups through fixed, named lookup sources."
  - name: "Approvals Inbox"
    description: "frmApprovals - approve or reject approval requests (core.usp_DecideApproval)."
  - name: "Exception Worklist"
    description: "frmExceptions - holds, warnings and errors raised by the engine."
  - name: "Audit Enquiry"
    description: "frmAudit - core.AuditLog enquiry."
  - name: "File Maintenance"
    description: "frmMaintLauncher and frmGenericMaint - metadata-driven maintenance of every core.MaintDef screen."
  - name: "Run Report"
    description: "frmReportLauncher - core.ReportDef catalogue, parameter panel and launch (STERP.Jobs)."
  - name: "Job Monitor"
    description: "frmJobMonitor and the generic run resources /api/jobs/v1/runs used by every slice (STERP.Jobs)."
  - name: "Spool File Viewer"
    description: "frmSpoolViewer - SYSOUT, logs and 132-column spool listings (STERP.Jobs)."
  - name: "Operator Console"
    description: "STERPOPS operator console (jobs\\OPSCON.cmd) - catalogue submission, monitor, exception queue, period status, health and SMOKE."
  - name: "Engine Diagnostics"
    description: "frmEngineDiag replaced by service diagnostics and the status-bar indicator."
paths:
  "/api/platform/v1/session":
    get:
      operationId: "platform_getSession"
      summary: "Session context: STERP user, access list, selected company/site, business date and fiscal period"
      description: "Resolves the authenticated Windows login with core.usp_GetUserContext @WindowsLogin (or @UserCode = X-STERP-Run-As for SYSADM) and returns what the legacy SterpSession held after LoginService.SignOnAs: user, realUserCode, isSysAdm, title '<user> (as <real>)', access list (result set 2, company/site order), selected company/site (the X-STERP-Company and X-STERP-Site headers when present in the list, else the first entry), business date (X-STERP-Business-Date or today) and the fiscal period of the selected company containing it (LoginService.LoadPeriod: first fin.Period row ordered by FiscalYear, PeriodNo; null when none or when the read fails). A login without an active STERP user is 403 API0010 'No STERP user is mapped to <login>.' - the legacy degraded fallback that signed such logins on as a stand-alone SYSADM (LoginService.vb:27-45,81-126) is excluded (contracts 5.2, Q-SEC-02). Legacy: frmLogin.vb:21-70, LoginService.vb:11-74,161-179, usp_CheckPermission.sql:19-35. Requirements FR-STERP-PLATFORM-031, FR-STERP-PLATFORM-050."
      tags:
        - "Sign On"
      parameters:
        - "$ref": "#/components/parameters/PlatformXSterpCompanyOptional"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
      responses:
        "200":
          description: "Session context: STERP user, access list, selected company/site, business date and fiscal period"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlatformSessionContext"
              example:
                windowsLogin: "STERP\\finctrl"
                user:
                  userCode: "FINCTRL"
                  displayName: "Financial Controller"
                  windowsLogin: "STERP\\finctrl"
                  emailAddress: null
                  jobTitle: "Financial Controller"
                  defaultCompanyCode: "STC"
                  defaultSiteCode: "RDG"
                  isReadOnly: false
                  isActive: true
                  businessDate: "2026-10-19"
                realUserCode: "FINCTRL"
                isSysAdm: false
                isImpersonating: false
                title: "FINCTRL"
                access:
                  - companyCode: "STC"
                    companyName: "Stellar Components Ltd"
                    siteCode: "BHM"
                    siteName: "Birmingham Distribution Centre"
                    nation: "ENG"
                    calendarCode: "ENG"
                    baseCurrency: "GBP"
                  - companyCode: "STC"
                    companyName: "Stellar Components Ltd"
                    siteCode: "RDG"
                    siteName: "Reading Works"
                    nation: "ENG"
                    calendarCode: "ENG"
                    baseCurrency: "GBP"
                selected:
                  companyCode: "STC"
                  companyName: "Stellar Components Ltd"
                  siteCode: "RDG"
                  siteName: "Reading Works"
                  nation: "ENG"
                  calendarCode: "ENG"
                  baseCurrency: "GBP"
                businessDate: "2026-10-19"
                fiscalPeriod:
                  fiscalYear: 2026
                  periodNo: 7
                  status: "OPEN"
                  periodText: "2026/07"
                message: "2 company/site combination(s) available."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PLATFORM-031"
        - "FR-STERP-PLATFORM-050"
      x-sterp-legacy:
        - "form:frmLogin (STERP-App/dotnet/STERP.Desktop/Forms/System/frmLogin.vb:21-70)"
        - "dotnet:LoginService.SignOnAs (STERP-App/dotnet/STERP.Business/System/LoginService.vb:23-74)"
        - "dotnet:LoginService.LoadPeriod (STERP-App/dotnet/STERP.Business/System/LoginService.vb:161-179)"
        - "sql:core.usp_GetUserContext (STERP-App/db/procs/core/usp_CheckPermission.sql:19-35)"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Two reads, each on its own connection in autocommit, no transaction: core.usp_GetUserContext (no writes) and the fin.Period SELECT TOP 1 (LoginService.vb:166-171)."
      x-sterp-wave: "W0"
      x-sterp-screen-gate:
        anyOf: []
        sources: []
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "no permission-coded legacy entry leads to this operation (shell/kernel service or API-only)"
  "/api/platform/v1/session/sign-on":
    post:
      operationId: "platform_signOn"
      summary: "Confirm company, site and business date (sign-on OK)"
      description: "Reproduces frmLogin.btnOk_Click: the company/site must be one of the caller's access-list entries (403 API0002 otherwise - RESTRICT is refused CAL/LIV), the fiscal period is loaded for the business date and the SIGNON note is written best effort by core.usp_WriteAudit (@UserCode session user, @CompanyCode chosen company, @EntityType 'SESSION', @EntityKey user code, @Action 'SIGNON', @Reason 'Signed on to <CO>/<SITE>', @Source 'STERP.exe'; a failure is logged and ignored as AuditService.Note did). Returns the session context for the chosen selection. Legacy: frmLogin.vb:81-93, LoginService.vb:161-179, AuditService.vb:15-25. Requirement FR-STERP-PLATFORM-031."
      tags:
        - "Sign On"
      parameters:
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Confirm company, site and business date (sign-on OK)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlatformSessionContext"
              example:
                windowsLogin: "STERP\\finctrl"
                user:
                  userCode: "FINCTRL"
                  displayName: "Financial Controller"
                  windowsLogin: "STERP\\finctrl"
                  emailAddress: null
                  jobTitle: "Financial Controller"
                  defaultCompanyCode: "STC"
                  defaultSiteCode: "RDG"
                  isReadOnly: false
                  isActive: true
                  businessDate: "2026-10-19"
                realUserCode: "FINCTRL"
                isSysAdm: false
                isImpersonating: false
                title: "FINCTRL"
                access:
                  - companyCode: "STC"
                    companyName: "Stellar Components Ltd"
                    siteCode: "BHM"
                    siteName: "Birmingham Distribution Centre"
                    nation: "ENG"
                    calendarCode: "ENG"
                    baseCurrency: "GBP"
                  - companyCode: "STC"
                    companyName: "Stellar Components Ltd"
                    siteCode: "RDG"
                    siteName: "Reading Works"
                    nation: "ENG"
                    calendarCode: "ENG"
                    baseCurrency: "GBP"
                selected:
                  companyCode: "STC"
                  companyName: "Stellar Components Ltd"
                  siteCode: "RDG"
                  siteName: "Reading Works"
                  nation: "ENG"
                  calendarCode: "ENG"
                  baseCurrency: "GBP"
                businessDate: "2026-10-19"
                fiscalPeriod:
                  fiscalYear: 2026
                  periodNo: 7
                  status: "OPEN"
                  periodText: "2026/07"
                message: "2 company/site combination(s) available."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PLATFORM-031"
      x-sterp-legacy:
        - "form:frmLogin (STERP-App/dotnet/STERP.Desktop/Forms/System/frmLogin.vb:81-102)"
        - "dotnet:AuditService.Note (STERP-App/dotnet/STERP.Business/System/AuditService.vb:15-25)"
        - "sql:core.usp_WriteAudit (STERP-App/db/procs/core/usp_WriteAudit.sql:4-13)"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Reads as platform_getSession; then core.usp_WriteAudit on its own connection in autocommit (single INSERT, no explicit transaction); its failure does not affect the response."
      x-sterp-wave: "W0"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlatformSignOnRequest"
            example:
              companyCode: "STC"
              siteCode: "RDG"
              businessDate: "2026-10-19"
      x-sterp-screen-gate:
        anyOf: []
        sources: []
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "no permission-coded legacy entry leads to this operation (shell/kernel service or API-only)"
  "/api/platform/v1/session/run-as":
    post:
      operationId: "platform_continueAsUser"
      summary: "SYSADM continues the session as another user"
      description: "Reproduces LoginService.RunAs: refused 403 API0003 'Only SYSADM may continue as another user.' unless the authenticated (real) user is SYSADM; loads the chosen user with core.usp_GetUserContext @UserCode (an unknown or inactive code is 403 API0010 'No STERP user is mapped to <code>.' instead of the legacy stand-alone fallback, Q-SEC-02); writes the RUNAS note best effort (UserCode = chosen user, CompanyCode = chosen user's first company, EntityType 'SESSION', EntityKey = code, Action 'RUNAS', Reason 'SYSADM continued the session as <code>', Source 'STERP.exe') and returns the chosen user's context (realUserCode SYSADM, isSysAdm only when the code is SYSADM). The GUI then sends X-STERP-Run-As. Legacy: frmLogin.vb:72-79, LoginService.vb:129-140. Requirement FR-STERP-PLATFORM-032."
      tags:
        - "Sign On"
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "SYSADM continues the session as another user"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlatformSessionContext"
              example:
                windowsLogin: "STERP\\sysadm"
                user:
                  userCode: "PURMGR"
                  displayName: "Purchasing Manager"
                  windowsLogin: null
                  emailAddress: null
                  jobTitle: "Purchasing Manager"
                  defaultCompanyCode: "STC"
                  defaultSiteCode: "BHM"
                  isReadOnly: false
                  isActive: true
                  businessDate: "2026-10-19"
                realUserCode: "SYSADM"
                isSysAdm: false
                isImpersonating: true
                title: "PURMGR (as SYSADM)"
                access:
                  - companyCode: "STC"
                    companyName: "Stellar Components Ltd"
                    siteCode: "BHM"
                    siteName: "Birmingham Distribution Centre"
                    nation: "ENG"
                    calendarCode: "ENG"
                    baseCurrency: "GBP"
                  - companyCode: "STC"
                    companyName: "Stellar Components Ltd"
                    siteCode: "RDG"
                    siteName: "Reading Works"
                    nation: "ENG"
                    calendarCode: "ENG"
                    baseCurrency: "GBP"
                selected:
                  companyCode: "STC"
                  companyName: "Stellar Components Ltd"
                  siteCode: "RDG"
                  siteName: "Reading Works"
                  nation: "ENG"
                  calendarCode: "ENG"
                  baseCurrency: "GBP"
                businessDate: "2026-10-19"
                fiscalPeriod:
                  fiscalYear: 2026
                  periodNo: 7
                  status: "OPEN"
                  periodText: "2026/07"
                message: "2 company/site combination(s) available."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PLATFORM-032"
      x-sterp-legacy:
        - "form:frmLogin (STERP-App/dotnet/STERP.Desktop/Forms/System/frmLogin.vb:72-79)"
        - "dotnet:LoginService.RunAs (STERP-App/dotnet/STERP.Business/System/LoginService.vb:129-140)"
        - "sql:core.usp_GetUserContext (STERP-App/db/procs/core/usp_CheckPermission.sql:19-35)"
        - "sql:core.usp_WriteAudit"
      x-sterp-permission:
        - "real user must be SYSADM (LoginService.vb:131)"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "core.usp_GetUserContext read (no writes) then core.usp_WriteAudit INSERT in autocommit; no transaction spans them."
      x-sterp-wave: "W0"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlatformRunAsRequest"
            example:
              userCode: "PURMGR"
      x-sterp-screen-gate:
        anyOf: []
        sources: []
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "no permission-coded legacy entry leads to this operation (shell/kernel service or API-only)"
  "/api/platform/v1/session/run-as-users":
    get:
      operationId: "platform_listRunAsUsers"
      summary: "Active users offered by Continue as"
      description: "Reproduces LoginService.UserList: SELECT UserCode, DisplayName FROM core.AppUser WHERE IsActive = 1 ORDER BY UserCode. The list is offered only when the real user is SYSADM (frmLogin.vb:46-53); other callers get 403 API0003. Legacy: LoginService.vb:182-189. Requirement FR-STERP-PLATFORM-032."
      tags:
        - "Sign On"
      parameters: []
      responses:
        "200":
          description: "Active users offered by Continue as"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlatformRunAsUserList"
              example:
                items:
                  - userCode: "APCLERK"
                    displayName: "Accounts Payable Clerk"
                  - userCode: "PURMGR"
                    displayName: "Purchasing Manager"
                count: 2
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PLATFORM-032"
      x-sterp-legacy:
        - "dotnet:LoginService.UserList (STERP-App/dotnet/STERP.Business/System/LoginService.vb:182-189)"
      x-sterp-permission:
        - "real user must be SYSADM (frmLogin.vb:46)"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Single read in autocommit; no transaction."
      x-sterp-wave: "W0"
      x-sterp-screen-gate:
        anyOf: []
        sources: []
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "no permission-coded legacy entry leads to this operation (shell/kernel service or API-only)"
  "/api/platform/v1/session/permission-checks":
    post:
      operationId: "platform_checkPermissions"
      summary: "Probe permissions for GUI enabling"
      description: "For each code reproduces LoginService.HasPermission: a blank code is allowed without a database call; otherwise core.usp_CheckPermission(@UserCode session or run-as user, @PermissionCode, @CompanyCode X-STERP-Company, @SiteCode X-STERP-Site) and allowed = its Allowed bit (no row = false) with its Reason. Answers enable GUI actions only; operations keep their own checks. A database failure is 500 SYS0001; the GUI treats a failed probe as allowed as legacy did (fail-open, BC-PLATFORM-01). Legacy: LoginService.vb:143-158, usp_CheckPermission.sql:5-17, frmCreditOverride.vb:49-51. Requirement FR-STERP-PLATFORM-033."
      tags:
        - "Sign On"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpRunAs"
      responses:
        "200":
          description: "Probe permissions for GUI enabling"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlatformPermissionCheckList"
              example:
                items:
                  - permissionCode: "AR.CREDIT.OVERRIDE"
                    allowed: false
                    checked: true
                    reason: "STERP-E-0001: User SALESREP does not hold permission AR.CREDIT.OVERRIDE for company CAL site LIV."
                  - permissionCode: "SO.ORDER.ENTER"
                    allowed: true
                    checked: true
                    reason: "Permitted"
                count: 2
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PLATFORM-033"
      x-sterp-legacy:
        - "dotnet:LoginService.HasPermission (STERP-App/dotnet/STERP.Business/System/LoginService.vb:143-158)"
        - "sql:core.usp_CheckPermission (STERP-App/db/procs/core/usp_CheckPermission.sql:5-17)"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One core.usp_CheckPermission read per non-blank code, each in autocommit; no writes."
      x-sterp-wave: "W0"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlatformPermissionCheckRequest"
            example:
              permissionCodes:
                - "AR.CREDIT.OVERRIDE"
                - "SO.ORDER.ENTER"
      x-sterp-screen-gate:
        anyOf: []
        sources: []
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "no permission-coded legacy entry leads to this operation (shell/kernel service or API-only)"
  "/api/platform/v1/menu":
    get:
      operationId: "platform_getMenu"
      summary: "Permission-filtered menu bar rows"
      description: "Executes core.usp_UiMenuLoad @UserCode, @CompanyCode, @SiteCode and returns its rows unchanged (active rows whose PermissionCode is empty or granted by core.usp_UiCheckAccess; emptied branches and orphans removed; ordered by ISNULL(ParentMenuCode,''), SortOrder, Caption). As MenuService.Load, a failure returns an empty list (the shell then uses its built-in menu). Legacy: MenuService.vb:11-18, usp_UiMenuLoad.sql:4-66, frmMain.vb:39-54. Requirements FR-STERP-PLATFORM-034, FR-STERP-PLATFORM-002."
      tags:
        - "Menu"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpRunAs"
      responses:
        "200":
          description: "Permission-filtered menu bar rows"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlatformMenu"
              example:
                items:
                  - menuCode: "SYSTEM"
                    parentMenuCode: null
                    caption: "&System"
                    formClass: null
                    formArgument: null
                    permissionCode: null
                    sortOrder: 20
                    shortcut: null
                  - menuCode: "SYS.APPROVAL"
                    parentMenuCode: "SYSTEM"
                    caption: "&Approvals Inbox..."
                    formClass: "frmApprovals"
                    formArgument: null
                    permissionCode: "SYS.APPROVAL.VIEW"
                    sortOrder: 200
                    shortcut: "F8"
                count: 2
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PLATFORM-034"
        - "FR-STERP-PLATFORM-002"
      x-sterp-legacy:
        - "dotnet:MenuService.Load (STERP-App/dotnet/STERP.Business/System/MenuService.vb:11-18)"
        - "sql:core.usp_UiMenuLoad (STERP-App/db/procs/core/usp_UiMenuLoad.sql:4-66)"
        - "sql:core.usp_UiCheckAccess (STERP-App/db/procs/core/usp_UiCheckAccess.sql:6-46)"
      x-sterp-permission:
        - "per row: core.MenuItem.PermissionCode through core.usp_UiCheckAccess"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Single procedure call in autocommit; temporary tables only, no persistent writes."
      x-sterp-wave: "W0"
      x-sterp-screen-gate:
        anyOf: []
        sources:
          - "menu:FILE.SPOOL=(none)"
          - "menu:RPT.JOBS=SYS.JOB.VIEW"
          - "menu:RPT.SPOOL=(none)"
          - "menu:SYS.APPROVAL=SYS.APPROVAL.VIEW"
          - "menu:SYS.AUDIT=SYS.AUDIT.VIEW"
          - "menu:SYS.ENGINE=SYS.ADMIN"
          - "menu:SYS.EXCEPTION=SYS.EXCEPTION.VIEW"
          - "menu:SYS.JOBS=SYS.JOB.VIEW"
          - "menu:SYS.MAINT=(none)"
          - "toolbar:frmApprovals=(none)"
          - "toolbar:frmAudit=(none)"
          - "toolbar:frmEngineDiag=(none)"
          - "toolbar:frmExceptions=(none)"
          - "toolbar:frmJobMonitor=(none)"
