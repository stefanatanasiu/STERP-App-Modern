  "/api/platform/v1/service-diagnostics":
    get:
      operationId: "platform_getServiceDiagnostics"
      summary: "Service diagnostics (replaces engine diagnostics)"
      description: "Returns service name and version, the PING-equivalent database probe (DB_NAME(), SYSDATETIME() style 121, LEFT(@@VERSION,80); a failure is a warning RC 04 SQL0001), status ONLINE/DEGRADED/DOWN, readiness, drift-check result (contracts 6.11), delivered slices and the console health text STERP-I-7000/STERP-E-7001. The COMMAREA echo test, program directory and copybook map are not provided (dispositions). Legacy: frmEngineDiag.vb:20-57, EngineService.vb:14-42, PING.cob:23-55, STERPOPS.cob:1066-1127. Requirements FR-STERP-PLATFORM-056, FR-STERP-PLATFORM-055, FR-STERP-PLATFORM-030."
      tags:
        - "Engine Diagnostics"
      parameters:
        - "$ref": "#/components/parameters/XSterpRunAs"
      responses:
        "200":
          description: "Service diagnostics (replaces engine diagnostics)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlatformServiceDiagnostics"
              example:
                serviceName: "STERP.Api"
                serviceVersion: "1.0.0+a06-20261020T112437Z-034eff00"
                database:
                  dbName: "STERP"
                  dbServerTime: "2026-10-19 21:07:15.4410000"
                  dbVersion: "Microsoft SQL Server 2022 (RTM-CU15) (KB5041321) - 16.0.4145.4 (X64)"
                  returnCode: 0
                  reasonCode: ""
                  message: "ENGINE AND DATABASE AVAILABLE"
                status: "ONLINE"
                readiness: "Healthy"
                driftCheck:
                  status: "OK"
                  differences: []
                deliveredSlices:
                  - targetApplicationId: "STERP-PLATFORM"
                    wave: "W0"
                    delivered: true
                  - targetApplicationId: "STERP-ITM"
                    wave: "W1"
                    delivered: false
                healthText: "STERP-I-7000 ENGINE AND DATABASE HEALTHY"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PLATFORM-056"
        - "FR-STERP-PLATFORM-055"
        - "FR-STERP-PLATFORM-030"
      x-sterp-legacy:
        - "form:frmEngineDiag (STERP-App/dotnet/STERP.Desktop/Forms/System/frmEngineDiag.vb:20-57)"
        - "dotnet:EngineService.Ping (STERP-App/dotnet/STERP.Business/System/EngineService.vb:14-29)"
        - "cobol:PING (STERP-App/cobol/online/common/PING.cob:23-55)"
      x-sterp-permission:
        - "menu row SYS.ENGINE requires SYS.ADMIN; the legacy toolbar opened the form without a check (observed)"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Single read in autocommit; no writes."
      x-sterp-wave: "W0"
      x-sterp-screen-gate:
        anyOf: []
        sources:
          - "menu:SYS.ENGINE=SYS.ADMIN"
          - "toolbar:frmEngineDiag=(none)"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "at least one legacy entry has no PermissionCode, so the capability was reachable without a permission"
  "/api/platform/v1/service-status":
    get:
      operationId: "platform_getServiceStatus"
      summary: "Status-bar engine indicator"
      description: "EngineService.Status semantics: ONLINE when the probe is OK and returned a database name, DEGRADED when it answered with a warning (RC <= 4), DOWN otherwise or on any exception. The shell polls it like frmMain's timer. Legacy: EngineService.vb:32-42, frmMain.vb:213-228. Requirement FR-STERP-PLATFORM-056."
