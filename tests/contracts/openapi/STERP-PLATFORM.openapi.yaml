      summary: "Submit a catalogue job from the operator console"
      description: "Reproduces STERPOPS 3200/3300 on STERP.Jobs: the command line is ' KEY=VALUE' for every non-blank key and value, unquoted (a value with a space becomes two arguments, SME-1175), at most 200 characters; ReportCode starting exactly 'JOB.' (case-sensitive) runs the stream ProgramName, otherwise the program ProgramName; no catalogue permission and no read-only restriction applies (SME-1172, SME-1173); CO and USER are whatever the panel holds (SME-1174). The console registers nothing itself: the 202 JobRunId is the job's own registration (FR-STERP-PLATFORM-057). An undelivered slice is 501 API0501. The page then shows the completion panel from the newest core.JobRun row whose JobName = ProgramName (SME-1177) with RC rendered in three digit positions. Legacy: STERPOPS.cob:683-770. Requirements FR-STERP-PLATFORM-051, FR-STERP-PLATFORM-057."
