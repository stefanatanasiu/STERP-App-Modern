          type: "integer"
          enum:
            - 0
            - 4
            - 6
          x-sterp-legacy-field: "CA-RETURN-CODE PIC 9(2)"
        severity:
          type: "string"
          enum:
            - "OK"
            - "WARNING"
            - "HOLD"
        reasonCode:
          type: "string"
