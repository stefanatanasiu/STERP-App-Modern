  "/api/so/v1/jobs/SOBACKLG/runs":
    servers:
      - url: "https://localhost:7102"
        description: "STERP.Jobs (batch)"
    post:
      operationId: "so_submitSobacklgRun"
      summary: "Submit the sales backlog and fulfilment report SOBACKLG (RPT-008)"
      description: "Starts SOBACKLG as the report catalogue row RPT-008 does (ParamSpec CO,SITE,FROM,TO; permission SO.ENQUIRY.VIEW; db/seed/72-so-menu.sql:74; menu Sales > Sales Reports > Sales Backlog and Fulfilment) [observed, FR-SOBACKLG-001..016, cobol/batch/so/SOBACKLG.cob]: CO, SITE, USER, FROM, TO, ASAT fixed fields and CUST by key; defaults CO=STC, USER=SALESMGR, ASAT=machine date (229-254); week boundaries ASAT+7 and ASAT+14 by DATECALC ADDDAYS (263-287); JOBLOG (293-300, 585-602); spool SOBACKLG-<CO>-<stamp>.lst, failure RC 12 (306-328); heading RPT-008 (334-382); backlog = OPEN/PARTIAL schedules of OPEN lines on ACCEPTED/AMENDED orders, by bucket Overdue/This week/Next week/Later (393-474); remaining and value outstanding ROUNDED half away 2 dp with no zero-divisor guard (516-535); dates and days late (538-561); held = ReleaseStatus other than RELEASED (491-500); totals and W-1605 RC 4 when any schedule is late on its original promise (564-581); backlog EXEC error RC 12 E-1603, spool still closed and announced (450-454); exit WS-RC (221-224). The uncalled facade member SalesOrderService.BacklogReport (no USER argument) is deferred (SME-1228)."
      tags:
        - "Sales Reports"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SoSobacklgParameters"
            example:
              SITE: "RDG"
              FROM: "20260901"
              TO: "20261031"
              ASAT: "20261007"
        description: "Legacy KEY=VALUE arguments as a JSON object (contracts 8.2); absent keys take the documented defaults."
      responses:
        "202":
          description: "Run registered with core.usp_JobRunStart and started in STERP.Jobs (contracts 8.3). Poll Location (/api/jobs/v1/runs/{jobRunId}); SYSOUT and spool are PLATFORM resources."
          headers:
            Location:
              description: "URL of the run resource /api/jobs/v1/runs/{jobRunId} on STERP.Jobs."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JobRunAccepted"
              example:
                jobRunId: 4711
                jobName: "SOBACKLG"
                status: "RUNNING"
                startedAt: "2026-10-07T10:15:02.1234567"
                links:
                  self: "/api/jobs/v1/runs/4711"
                  sysout: "/api/jobs/v1/runs/4711/sysout"
                  spool: "/api/jobs/v1/runs/4711/spool"
                  result: "/api/jobs/v1/runs/4711/result"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "Not produced by a submission (fixed job path); unknown run ids are answered by the PLATFORM run resources."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: "Not produced at submission: program refusals (for example SOACKDOC STERP-E-1800, ARINVPST ARI0050 inside SOINVRUN) are run outcomes with their legacy return codes, as in legacy where the launcher always started the program."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-SO-033"
      x-sterp-legacy:
        menu: "SO.RPT.BACKLOG -> frmReportLauncher (db/seed/72-so-menu.sql:56)"
        cobol:
          - "SOBACKLG (cobol/batch/so/SOBACKLG.cob)"
          - "DATECALC"
          - "JOBLOG"
          - "RUNPATH"
          - "CMDARGS"
        report: "core.ReportDef RPT-008 (db/seed/72-so-menu.sql:74)"
        file: "FL-060 spool SOBACKLG-<CO>-<stamp>.lst"
      x-sterp-permission:
        - "SO.ENQUIRY.VIEW"
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Batch, read only (SELECTs in autocommit); only core.JobRun registration writes (core.usp_JobRunStart/End, autocommit)."
      x-sterp-wave: "W3"
      x-sterp-screen-gate:
        anyOf:
          - "SO.ENQUIRY.VIEW"
        sources:
          - "report:RPT-008=SO.ENQUIRY.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "parameter-dependent: report rows filtered by core.usp_UiReportList -> core.usp_UiCheckAccess (ReportDef.PermissionCode)"
components:
  securitySchemes:
    windows:
      type: "http"
      scheme: "negotiate"
      description: "Windows integrated authentication (Kerberos/NTLM). Browsers send the signed-on Windows identity automatically; curl: add --negotiate -u : (contracts section 5.1)."
  parameters:
    XSterpCompany:
      name: "X-STERP-Company"
      in: "header"
      required: true
      description: "Company code of the session (legacy SterpSession.CompanyCode -> CA-COMPANY / @CompanyCode). Must be in the caller's access list (core.usp_GetUserContext result set 2); otherwise 403 API0002."
