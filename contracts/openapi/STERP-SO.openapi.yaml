            schema:
              "$ref": "#/components/schemas/SoAcceptanceRequest"
            example:
              customer: "K0004"
              orderDate: "2026-09-26"
              currency: "GBP"
              termsCode: "N14"
              salesperson: "SALESREP"
              incotermsRule: "DAP"
              incotermsPlace: "Livingston"
      responses:
