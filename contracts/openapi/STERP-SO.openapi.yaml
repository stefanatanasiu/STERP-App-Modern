openapi: "3.1.0"
info:
  title: "STERP Sales order processing API (STERP-SO)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Online and batch API of slice STERP-SO (wave W3, API segment so) of the modernized STERP ERP: sales order load, price explanation (PRICING), document totals (SODISC), line VAT decision (SOVAT), line margin (SOMARGN), availability (SOAVAIL), reservation (SORESV), validation and acceptance (SOACCEPT), despatch confirmation with stock issue and cost-of-sale journal (DESPATCH), and the batch programs SOINVRUN, SOACKDOC, SOANAL and SOBACKLG. The legacy behaviour is the contract: every operation reproduces the legacy VB facade (dotnet/STERP.Business/Sales/SalesOrderService.vb), COBOL program and SQL effects cited in its description, including return/reason codes, messages and unit-of-work boundaries, on the shared STERP database. Conventions (headers, outcome envelope, status mapping, normalization, jobs, spool) are those of 01-shared-platform-contracts.md; the binding specification is application-specs/STERP-SO.md."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Sales Order Entry"
    description: "Operations behind the legacy screen frmSalesOrderEntry (menu Sales > Sales Order Entry...)."
  - name: "Despatch Confirmation"
    description: "Operations behind the legacy screen frmDespatchConfirm (menu Sales > Despatch Confirmation...)."
  - name: "Sales Invoice Run"
    description: "Batch program SOINVRUN behind frmSalesInvoiceRun and the report catalogue row SOINVRUN."
  - name: "Sales Reports"
    description: "Catalogue report programs SOACKDOC, SOANAL and SOBACKLG (RPT-008) launched through the report launcher."
paths:
  "/api/so/v1/sales-orders":
    get:
      operationId: "so_listSalesOrders"
      summary: "F2 sales order picker"
      description: "Lists the sales orders of X-STERP-Company for the F2 picker of Sales Order Entry: OrderNumber, CustomerCode, OrderDate, CurrencyCode, ReleaseStatus, FulfilmentStatus from so.SalesOrder where, when `search` is not empty, OrderNumber or CustomerCode starts with it; ordered by OrderNumber (dotnet/STERP.Business/Sales/SalesOrderService.vb:23-27) [observed]. Legacy chain: frmSalesOrderEntry.OnLookup with the focus on the order field (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:244-254) -> frmLookup.Pick -> SqlHelper ad-hoc parameterised SQL; an empty search is passed as NULL (dotnet/STERP.Data/SqlHelper.cs:33) and lists every order. Complete result set in legacy order (contracts 4.10)."
      tags:
        - "Sales Order Entry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - name: "search"
          in: "query"
          required: false
          description: "Prefix of the order number or the customer code (@Search); empty or absent = all orders."
          schema:
            type: "string"
            x-sterp-legacy-field: "@Search (frmLookup search box)"
          example: "SOS9000"
      responses:
        "200":
          description: "Direct result (contracts 4.6, x-sterp-outcome direct)."
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ListEnvelope"
                  - type: "object"
                    properties:
                      items:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/SoOrderPickRow"
              example:
                items:
                  - orderNumber: "SOS900003"
                    customerCode: "C0008"
                    orderDate: "2026-09-28"
                    currencyCode: "GBP"
                    releaseStatus: "CREDITHOLD"
                    fulfilmentStatus: "UNALLOCATED"
                  - orderNumber: "SOS900008"
                    customerCode: "C0090"
                    orderDate: "2026-10-02"
                    currencyCode: "GBP"
                    releaseStatus: "RELEASED"
                    fulfilmentStatus: "PICKED"
                count: 2
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-SO-010"
        - "FR-STERP-SO-020"
      x-sterp-legacy:
        forms:
          - "frmSalesOrderEntry.OnLookup (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:244-254)"
        facade:
          - "SalesOrderService.OrderPickSql (dotnet/STERP.Business/Sales/SalesOrderService.vb:23-27)"
        sql:
          - "so.SalesOrder (SELECT)"
      x-sterp-permission:
        - "SO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Read only. Legacy: one short ADO.NET connection per SqlHelper query, autocommit (dotnet/STERP.Data/SqlHelper.cs:56-120); the target runs the same parameterised SELECT(s) without a transaction (READ COMMITTED, RCSI) and takes no locks."
      x-sterp-wave: "W3"
      x-sterp-screen-gate:
        anyOf:
          - "SO.ORDER.ENTER"
        sources:
          - "menu:SO.ORDER.ENTRY=SO.ORDER.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/so/v1/sales-orders/{orderNumber}":
    get:
      operationId: "so_getSalesOrder"
      summary: "Load a sales order (header and lines)"
      description: "Returns the order header (HeaderSql: so.SalesOrder LEFT JOIN ar.Customer for LegalName, dotnet/STERP.Business/Sales/SalesOrderService.vb:47-54, 80-83) and all its lines (LineSql ordered by LineNum, dotnet/STERP.Business/Sales/SalesOrderService.vb:56-60, 85-88) in X-STERP-Company [observed]. When no header row exists the response is 404 with the legacy screen text \"Order <n> is not on file in <company>.\" (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:61-66). The facade Deployed() probe (missing table -> \"not on file\") is replaced by the readiness drift check (contracts 6.11). Legacy chain: frmSalesOrderEntry.LoadOrder (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:53-74), triggered by F5, the Load button, the F2 picker and the form argument; the screen upper-cases and trims the order number first (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:54) and then calls so_calculateDocumentTotals for the totals (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:159-174)."
      tags:
        - "Sales Order Entry"
      parameters:
        - name: "orderNumber"
          in: "path"
          required: true
          description: "Legacy business key so.SalesOrder.OrderNumber."
          schema:
            type: "string"
            x-sterp-length: 30
            x-sterp-legacy-field: "so.SalesOrder.OrderNumber varchar(30)"
          example: "SOS900008"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
      responses:
        "200":
          description: "Direct result (contracts 4.6, x-sterp-outcome direct)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SoSalesOrder"
              example:
                header:
                  orderNumber: "SOS900008"
                  orderType: "STANDARD"
                  siteCode: "RDG"
                  customerCode: "C0090"
                  customerName: "Thameside Demonstration Cycles Limited"
                  customerOrderRef: "COT-5589"
                  orderDate: "2026-10-02"
                  currencyCode: "GBP"
                  termsCode: "DOM31"
                  salespersonCode: "SALESREP"
                  incotermsRule: "DAP"
                  incotermsNamedPlace: "Cotswold Gravel, Stroud"
                  deliveryAddressRef: null
                  commercialStatus: "ACCEPTED"
                  releaseStatus: "RELEASED"
                  fulfilmentStatus: "PICKED"
                  billingStatus: "ELIGIBLE"
                  holdReason: null
                  netAmount: 2747.2
                  vatAmount: 549.44
                  grossAmount: 3296.64
                lines:
                  - lineNum: 1
                    itemCode: "FG-FRAME-GRAVEL-M"
                    description: "Frame, gravel Trailhead, medium"
                    acceptedQty: 8.0
                    uomCode: "EA"
                    conversionFactor: 1.0
                    unitPrice: 298.0
                    pricePerQty: 1.0
                    priceSource: "GROUP"
                    discountPct1: 5.0
                    discountPct2: 0.0
                    netAmount: 2264.8
                    vatCode: "S"
                    vatRatePct: 20.0
                    vatAmount: 452.96
                    marginPct: 30.15
                    costSnapshotGbp: 208.0
                    despatchedQty: 0.0
                    cancelledQty: 0.0
                    status: "OPEN"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "No so.SalesOrder row for the company and order number; detail = \"Order <n> is not on file in <company>.\" (frmSalesOrderEntry.vb:61-66)."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
              example:
                type: "https://sterp.local/problems/not-found"
                title: "Not found"
                status: 404
                detail: "Order SOS999999 is not on file in STC."
                returnCode: null
                reasonCode: null
                severity: "NOT FOUND"
                messageCount: 1
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-SO-010"
        - "FR-STERP-SO-020"
      x-sterp-legacy:
        forms:
          - "frmSalesOrderEntry.LoadOrder (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:53-74)"
        facade:
          - "SalesOrderService.Header (dotnet/STERP.Business/Sales/SalesOrderService.vb:80-83)"
          - "SalesOrderService.Lines (dotnet/STERP.Business/Sales/SalesOrderService.vb:85-88)"
        sql:
          - "so.SalesOrder (SELECT)"
          - "so.SalesOrderLine (SELECT)"
          - "ar.Customer (SELECT LegalName)"
      x-sterp-permission:
        - "SO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Read only. Legacy: one short ADO.NET connection per SqlHelper query, autocommit (dotnet/STERP.Data/SqlHelper.cs:56-120); the target runs the same parameterised SELECT(s) without a transaction (READ COMMITTED, RCSI) and takes no locks. Header and lines were two separate autocommit queries; the target may issue both on one connection, still without a transaction."
      x-sterp-wave: "W3"
      x-sterp-screen-gate:
        anyOf:
          - "SO.ORDER.ENTER"
        sources:
          - "menu:SO.ORDER.ENTRY=SO.ORDER.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/so/v1/pricing/explain":
    post:
      operationId: "so_explainPrice"
      summary: "Explain the selling price of an order line (PRICING EXPLAIN)"
      description: "Links PRICING with function EXPLAIN exactly as SalesOrderService.Price fills the COMMAREA (dotnet/STERP.Business/Sales/SalesOrderService.vb:106-121; called from frmSalesOrderEntry.ExplainClicked, dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:178-203): item, customer, unit, currency (blank -> company base currency), quantity, PR-ORDER-DATE = PR-PRICE-DATE = orderDate, PR-DOC-TYPE SALESORDER, PR-DOC-REF. Program rules [observed, Agent 02 FR-PRICING-001..019]: header reset, outputs cleared and keys upper-cased (cobol/online/so/PRICING.cob:121-166); blank currency -> GBP, zero price date -> order date then business date, max level outside 1..5 -> 5 (141-153); company and item required, RC 08 PRC0001 (171-177); quantity <= 0 RC 08 PRC0002 (179-185); manual price without approval RC 08 PRC0009 (187-195); cross-currency candidates only when PR-XCURR-ALLOW or parameter SO.PRICE.XCURR.ALLOW (default N) allows (726-746); candidates are active so.PriceList/so.PriceListLine lines of the company and item at or below the max level, valid on the price date, visible by scope, fetched by level, break descending, list (259-325); each line is rejected with a reason for break above quantity, currency or unit mismatch, price-per <= 0 treated as 1 (332-394); at most 40 candidates, further rows dropped and PR-CAND-TRUNC = Y (602-627); lowest level then largest break wins, an equal rival with a different price is ambiguous (404-480); the winner and an explanation sentence are returned (487-540); ambiguity sets PR-BLOCK-CONFIRM = Y and returns RC 08 PRC0007 with the price still populated (536-537, 585-598) - nothing in production reads the flag (SME-2150); no surviving candidate returns RC 16 PRC0004 (currency reject), PRC0005 (unit), PRC0006 (quantity) or PRC0003 (488-490, 544-578); a SQLIO error returns RC 12 SQL0001 and a later ranking may overwrite the message or the RC (208-212, 770-780; FR-PRICING-019). EXPLAIN always returns the ranked candidate table (PR-CAND, PR-CAND-CNT; 213-216)."
      tags:
        - "Sales Order Entry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SoPriceExplainRequest"
            example:
              itemCode: "FG-FRAME-GRAVEL-M"
              customer: "C0090"
              uomCode: "EA"
              currency: "GBP"
              quantity: 8.0
              orderDate: "2026-10-02"
              docRef: "SOS900008"
      responses:
        "200":
          description: "RC 00 with the chosen price and the ranked candidates."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/SoPricingResult"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Level 4 GROUP price from list TRADE26, GBP 298.000000 per 1.000000 EA, quantity break 0.000000, effective on 20260101"
                  messageCount: 0
                  documentRef: "SO-004"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  itemCode: "FG-FRAME-GRAVEL-M"
                  customer: "C0090"
                  uomCode: "EA"
                  currency: "GBP"
                  quantity: 8.0
                  unitPrice: 298.0
                  pricePerQty: 1.0
                  discountPct: 5.0
                  priceLevel: 4
                  priceScope: "GROUP"
                  priceListCode: "TRADE26"
                  priceSource: "GROUP"
                  priceFound: "Y"
                  ambiguous: "N"
                  blockConfirm: "N"
                  candCnt: 1
                  candTrunc: "N"
                  cand:
                    - cLevel: 4
                      cScope: "GROUP"
                      cList: "TRADE26"
                      cCurrency: "GBP"
                      cUom: "EA"
                      cQtybrk: 0.0
                      cPrice: 298.0
                      cPerQty: 1.0
                      cDisc: 5.0
                      cRank: 1
                      cChosen: "Y"
                      cWhy: "Chosen: lowest level, largest break"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "RC 16 PRC0003/PRC0004/PRC0005/PRC0006 - no candidate survived (FR-PRICING-015); data carries PR-EXPLANATION and the candidate list."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ProblemDetails"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/SoPricingResult"
                        description: "COMMAREA body as the legacy program returned it; the legacy screens read it after a refusal (decision D-SO-03)."
              example:
                type: "https://sterp.local/problems/not-found"
                title: "Not found"
                status: 404
                detail: "No effective price for item FG-FRAME-GRAVEL-M on 20261002"
                returnCode: 16
                reasonCode: "PRC0003"
                severity: "NOT FOUND"
                messageCount: 1
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        "422":
          description: "RC 08 PRC0001, PRC0002, PRC0009 or PRC0007 (ambiguous - the chosen price is still populated in data)."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ProblemDetails"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/SoPricingResult"
                        description: "COMMAREA body as the legacy program returned it; the legacy screens read it after a refusal (decision D-SO-03)."
              example:
                type: "https://sterp.local/problems/business-rule"
                title: "Business rule refused the request"
                status: 422
                detail: "Price lists TRADE26 and DIST26 are equally ranked for item FG-FRAME-GRAVEL-M and disagree - confirmation is blocked"
                returnCode: 8
                reasonCode: "PRC0007"
                severity: "ERROR"
                messageCount: 1
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        "500":
          description: "RC 12 SEVERE (SQL0001 with the driver text) or SYS0001."
          content:
            "application/problem+json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ProblemDetails"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/SoPricingResult"
                        description: "COMMAREA body as the legacy program returned it; the legacy screens read it after a refusal (decision D-SO-03)."
              example:
                type: "https://sterp.local/problems/severe"
                title: "Severe error"
                status: 500
                detail: "[Microsoft][ODBC Driver 18 for SQL Server]..."
                returnCode: 12
                reasonCode: "SQL0001"
                severity: "SEVERE"
                messageCount: 1
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
      x-sterp-requirements:
        - "FR-STERP-SO-011"
        - "FR-STERP-SO-020"
      x-sterp-legacy:
        forms:
          - "frmSalesOrderEntry.ExplainClicked (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:178-203)"
        facade:
          - "SalesOrderService.Price (dotnet/STERP.Business/Sales/SalesOrderService.vb:106-121)"
          - "SalesOrderService.Candidates (dotnet/STERP.Business/Sales/SalesOrderService.vb:125-128)"
        cobol:
          - "PRICING EXPLAIN (cobol/online/so/PRICING.cob:108-113)"
          - "PARMGET SO.PRICE.XCURR.ALLOW"
        copybook: "cobol/copy/PRICINGCA.cpy"
        sql:
          - "so.PriceList (SELECT)"
          - "so.PriceListLine (SELECT)"
      x-sterp-permission:
        - "SO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read only. The program issues no SQLIO BEGN; its reads run in autocommit on the engine connection (contracts 6.4); the target runs them on the request connection without a transaction and writes nothing. PRICING reads so.PriceList, so.PriceListLine and core.Parameter (PARMGET) only."
      x-sterp-wave: "W3"
      x-sterp-screen-gate:
        anyOf:
          - "SO.ORDER.ENTER"
        sources:
          - "menu:SO.ORDER.ENTRY=SO.ORDER.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/so/v1/discounts/document":
    post:
      operationId: "so_calculateDocumentTotals"
      summary: "Document discount, allowance, charge and VAT totals (SODISC DOCUMENT)"
      description: "Links SODISC with function DOCUMENT as SalesOrderService.Discount does (dotnet/STERP.Business/Sales/SalesOrderService.vb:134-155): SD-DOC-TYPE SALESORDER, doc ref, customer, currency (blank -> company base currency), price date, SD-ROUND-PLACES 2, and one SD-LINE per order line mapped by AddDiscountLine (dotnet/STERP.Business/Sales/SalesOrderService.vb:159-175; price-per 0 -> 1, price unit = PriceUomCode else UomCode, missing conversion factor left at the row value). Only the first 30 lines are sent (MaxLines, dotnet/STERP.Business/Sales/SalesOrderService.vb:20,146-151); further lines are ignored exactly as the facade ignored them (BC-SO-01). Called by frmSalesOrderEntry.Totals after every load (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:159-174). Program rules [observed, FR-SODISC-001..019]: function upper-cased, other functions RC 08 DSC0008 (cobol/online/so/SODISC.cob:88-99,784-790); inputs normalised in place (107-149); company required DSC0001, 1..200 lines DSC0002/DSC0003 (153-177); applied-tag signature (223-252); quantity <= 0 DSC0004, factor arithmetic ROUNDED 6 dp or UOMCONV TOSTOCK/FACTOR, failures DSC0007 (492-518, 716-770); per-qty <= 0 DSC0005, unit price at 6 dp, gross rounded to the places (524-551); up to three sequential percentages within -100..100 DSC0006, rounding after every step (558-586); line allowance above the discounted value -> line REVIEW, RC 04 DSC0009 (590-603); document allowance/charge allocated by RNDALLOC (269-349, 680-698); line net, VAT per line (S/R with zero rate DSC0011), margin, totals, reconciliation DSC0010 RC 12 (607-672, 365-417); explanation sentence (421-458); a failing line is marked ERROR, RC 08, other lines still processed, document totals left zero (794-802, 197-212). No database access other than through UOMCONV."
      tags:
        - "Sales Order Entry"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SoDocumentTotalsRequest"
            example:
              docRef: "SOS900008"
              customer: "C0090"
              currency: "GBP"
              priceDate: "2026-10-02"
              lines:
                - lineNum: 1
                  itemCode: "FG-FRAME-GRAVEL-M"
                  acceptedQty: 8.0
                  uomCode: "EA"
                  conversionFactor: 1.0
                  unitPrice: 298.0
                  pricePerQty: 1.0
                  discountPct1: 5.0
                  discountPct2: 0.0
                  vatCode: "S"
                  vatRatePct: 20.0
                  costSnapshotGbp: 208.0
      responses:
        "200":
          description: "RC 00, or RC 04 DSC0009 (line allowance above the discounted value)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/SoDiscountResult"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Gross 2384.00, sequential discount 119.20, allowance 0.00, charges 0.00, net 2264.80, VAT 452.96, gross total 2717.76"
                  messageCount: 0
                  documentRef: "SO-005"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  docRef: "SOS900008"
                  lineCnt: 1
                  totGross: 2384.0
                  totDiscount: 119.2
                  totAllowance: 0.0
                  totCharge: 0.0
                  totNet: 2264.8
                  totVat: 452.96
                  totGrossTotal: 2717.76
                  totCostGbp: 1664.0
                  docMarginPct: 26.5277
                  reconciled: "Y"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "Not produced by SODISC (no RC 16 path); listed for completeness."
          content:
            "application/problem+json":
