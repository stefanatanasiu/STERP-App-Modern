          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "422":
          description: "Not produced at submission: program refusals (for example SOACKDOC STERP-E-1800, ARINVPST ARI0050 inside SOINVRUN) are run outcomes with their legacy return codes, as in legacy where the launcher always started the program."
