RC 08 DSP0008, SQL failure RC 12 SQL0001 (2107-2126). A failed confirmation returns no despatch reference, COGS or journal (the screen shows them only on success, dotnet/STERP.Desktop/Forms/Sales/frmDespatchConfirm.vb:149-155)."
