      x-sterp-permission:
        - "SO.INVOICE.RUN"
        - "AR.INVOICE.POST"
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Batch, per invoice group (COMMIT only; PREVIEW writes nothing but the job registration): SOINVRUN BEGN (SOINVRUN.cob:911-920) -> ARINVPST POST; ARINVPST's PERMCHK, PERIODCK, IDEMPOT BEGIN and NUMGEN run inside that open unit, then ARINVPST issues its own unconditional BEGN and COMT (cobol/online/ar/ARINVPST.cob:775,814), which commits the invoice, journal, VAT and open item and restores autocommit (c/sterpsql.c:264-272) [inferred driver effect, SME-013/SME-014]; ARINVPST IDEMPOT END runs in autocommit; the SO write-back (so.DespatchLine BilledQty guarded increment, so.SalesOrderLine BilledQty, AUDITLOG, so.SalesOrder BillingStatus) therefore executes statement by statement in autocommit, and SOINVRUN's later COMT (940-946) or ROLB (3900-ROLLBACK, 1205) has no remaining unit to act on. The target reproduces exactly these commit points (contracts 6.4): one transaction from the group start to ARINVPST's commit, then autocommitted write-back statements. Job registration via core.usp_JobRunStart/End in autocommit."
