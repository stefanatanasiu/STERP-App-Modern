      summary: "Accept and release an order (SOACCEPT ACCEPT, F10)"
      description: "Links SOACCEPT with function ACCEPT and a new correlation id per instruction (Idempotency-Key), as SalesOrderService.Accept does (dotnet/STERP.Business/Sales/SalesOrderService.vb:223-242), after the user confirmed \"Accept and release order <n> for <customer>?\" (dotnet/STERP.Desktop/Forms/Sales/frmSalesOrderEntry.vb:328-330). Algorithm [observed, FR-SOACCEPT-005/006]: VALIDATE (above); CREDCHK CHECK at check point ORDER with the order gross and exclusions (cobol/online/so/SOACCEPT.cob:793-840; CREDCHK RC > 11 -> RC 12 SOA0008, an RC 08 with a blank decision is used as a decision, SME-1131); release decision (842-890): more than 30 days overdue without an active, unexpired override -> CREDITHOLD with \"Invoices <n> days past due totalling <amount> hold new release (D-06)\" (SME-2217); CREDCHK HELD or BLOCKED -> CREDITHOLD (no distinction, SME-2267); findings -> COMMERCIALHOLD \"Commercial findings on the order require review before release\"; required deposit not received -> COMMERCIALHOLD \"Cleared deposit of <amount> is still outstanding (SO-019)\"; any hold -> RC 06 SOA0008; then BEGN, UPDATE so.SalesOrder SET CommercialStatus ACCEPTED, ReleaseStatus, HoldReason, CreditOverrideId, ApprovalId (NULL - the facade never sends one), ModifiedBy, ModifiedAt WHERE CommercialStatus IN (DRAFT, ACCEPTED, AMENDED) (892-920), COMT, AUDITLOG (1250-1294) and the message \"Order <n> accepted and released for fulfilment\" or \"... accepted but held - <reason>\" (923-937). ACCEPT never applies RELEASE's supply and margin-approval checks (SME-2218). Program rules [observed, FR-SOACCEPT-001..006, 011, 012]: company and order number required RC 08 SOA0001 (cobol/online/so/SOACCEPT.cob:211-221); the order header and up to 200 non-cancelled lines are read from so.SalesOrder/so.SalesOrderLine, overwriting the header fields sent (224-348, 311-345, 413-429); unknown order RC 16 SOA0006, cancelled or completed order RC 08 SOA0010; up to 30 findings - blockers for missing commercial fields, price source, VAT code, item eligibility and units (UOMCONV), warnings for superseded revisions and authorised items (441-723, 1388-1405); a finding after the 30th is dropped (SME-1127); any blocker RC 08, warnings only RC 04, none RC 00 (726-757); unsupported function RC 08 SOA0009; SQL failure RC 12 SQL0001; RC > 4 rolls back an open transaction (162-166, 1366-1384)."
      tags:
        - "Sales Order Entry"
      parameters:
        - name: "orderNumber"
          in: "path"
          required: true
          description: "SA-ORDER-NUMBER."
          schema:
            type: "string"
