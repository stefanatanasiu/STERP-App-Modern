                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Order SOC900003 accepted and released for fulfilment"
                  messageCount: 0
                  documentRef: "SO-003"
                  correlationId: "9b2e4f61-0c7d-4f0e-8a33-5d1e2c3b4a59"
