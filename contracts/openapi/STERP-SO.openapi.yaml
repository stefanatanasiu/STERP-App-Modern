      summary: "Submit the sales invoice run SOINVRUN (PREVIEW or COMMIT)"
      description: "Starts SOINVRUN with KEY=VALUE arguments CO, SITE, FROM, TO, MODE and USER = effective user, exactly as SalesOrderService.InvoiceRun -> ReportService.Run(\"SOINVRUN\",\"SOINVRUN\") did from Sales Invoice Run (dotnet/STERP.Business/Sales/SalesOrderService.vb:376-386; dotnet/STERP.Business/System/ReportService.vb:98-182; dotnet/STERP.Desktop/Forms/Sales/frmSalesInvoiceRun.vb:39-63) and as the catalogue row SOINVRUN does (db/seed/72-so-menu.sql:78). Program behaviour [observed, FR-SOINVRUN-001..021, cobol/batch/so/SOINVRUN.cob]: defaults CO=STC, USER=ARCLERK, MODE=PREVIEW; only the exact text PREVIEW previews (331-363, 95-96, 834-839); STERP-I-1400, own JOBLOG registration (double registration with the launcher, SME-010), parameter SO.INVOICE.PERORDER (357-399); 132-column spool SOINVRUN-<CO>-<stamp>.lst (401-484); selection of confirmed despatch lines with BilledQty < DespatchedQty, at most 400 rows (490-591); withholding reasons - nothing left, CREDITHOLD, export proof PENDING/OVERDUE/FAILED, RC/DRC/EXP without evidence, blank VAT code, PERIODCK RC > 6 (620-687); grouping by invoice customer, currency, incoterms, order (per-order mode) and despatch, split before a 26th line (595-616, 695-732); line valuation with 6-decimal truncation steps and RNDALLOC (736-797); the first line after a flush is billed with the previous group's total quantity (FR-SOINVRUN-009, SME-1110; BC-SO-03); correlation id SOI-<co>-<first despatch line id>-<group qty> cut at 36 (849-863); deposit application (869-908); COMMIT: ARINVPST POST per group then BilledQty write-back, order BillingStatus and audit (910-959, 1033-1211); an ARINVPST refusal (for example ARI0050 when USER lacks AR.INVOICE.POST, cobol/online/ar/ARINVPST.cob:830-846) prints \"REFUSED <reason>\", displays STERP-W-1405 and raises the run to 4 (921-932); after the first RC 12 every later group is posted and then rolled back (FR-SOINVRUN-016, SME-1105; BC-SO-04); exit 0, 4 or 12 with STERP-I-SPOOL <path> (1240-1274)."
      tags:
        - "Sales Invoice Run"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SoSoinvrunParameters"
            example:
              SITE: "RDG"
              FROM: "20261001"
              TO: "20261007"
              MODE: "PREVIEW"
