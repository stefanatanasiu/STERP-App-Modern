openapi: "3.1.0"
info:
  title: "STERP Bills of material API (STERP-BOM)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Online and batch API of the Bills of material slice (target application STERP-BOM, wave W8) of the modernized STERP ERP. It replaces the legacy VB facades BomService and BomBulkService, the GnuCOBOL programs of cobol/online/bom and cobol/batch/bom and the bom stored procedures as used by the WinForms client (frmBomEditor, frmBomExplosion, frmBomWhereUsed, frmBomBulkPreview) and the report catalogue (BOMRP010, BOMRP020, BOMRP030, BOMRP040, RPT-012). Legacy behaviour is the contract: every operation reproduces the observed legacy outcome, messages, reason codes and data effects for the same inputs and database state (application specification STERP-BOM.md; shared conventions 01-shared-platform-contracts.md). Online operations run on STERP.Api; job submissions run on STERP.Jobs and are polled through the platform resources /api/jobs/v1/runs/{jobRunId}. The public in-process contracts used by the KIT and CST slices (BOMEXPL, BOMCOST) are documented by the component schemas BomExplosionEngineArea and BomCostEngineArea and are never called over HTTP."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Explosion Enquiry"
    description: "Legacy menu BOM.EXPLODE (frmBomExplosion): indented, single-level, leaf, costed and netted readings."
  - name: "Where Used Enquiry"
    description: "Legacy menu BOM.WHEREUSED (frmBomWhereUsed) and the Where used tool of frmBomExplosion."
  - name: "Revision Comparison"
    description: "Legacy menu BOM.COMPARE (frmBomExplosion with argument COMPARE)."
  - name: "Bill Maintenance"
    description: "Legacy menu BOM.EDIT (frmBomEditor): structure reads, validation, release."
  - name: "Bulk Change Preview"
    description: "Legacy menu BOM.CHANGE.PREVIEW (frmBomBulkPreview)."
  - name: "Reports (BOMRP010)"
    description: "Indented Parts List / Costed Explosion (catalogue BOMRP010, BOMRP020, RPT-012)."
  - name: "Reports (BOMRP030)"
    description: "Where used and revision comparison listings (catalogue BOMRP030, BOMRP040)."
paths:
  "/api/bom/v1/items/{parentItemCode}/explode":
    post:
      operationId: "bom_explodeBill"
      summary: "Explosion enquiry: single level, indented or leaf view of one gross explosion"
      description: "Reproduces BomService.Explode (dotnet/STERP.Business/Bom/BomService.vb:138-195): BOMLEAF SINGLE/INDENT/FLATTEN (cobol/online/bom/BOMLEAF.cob:67-309) runs one GROSS explosion through BOMEXPL (phantoms expanded, notes and by-products included) and pages the result; the API returns every line in engine order. Completeness, stop summary, occurrence count and depth come from the first engine call. The outcome is that of the last engine call the facade made: an explosion with more than one window returns RC 0 from the last page call even when the calculation was INCOMPLETE (data.completeness tells). Errors: RC 8 BOM0504 unknown item, BOM0503 negative quantity, BOM0513 cycle, BOMSELCT reasons when no bill is selected; RC 12 SQL0001. FR-STERP-BOM-010. Example values are illustrative; the legacy oracle is authoritative."
      tags:
        - "Explosion Enquiry"
      parameters:
        - name: "parentItemCode"
          in: "path"
          required: true
          description: "Parent item code (BL/BC/BN-PARENT-ITEM X(40)); the screen upper-cases it."
          schema:
            type: "string"
            maxLength: 40
            x-sterp-legacy-field: "BL-PARENT-ITEM PIC X(40)"
            x-sterp-length: 40
          example: "FG-BIKE-COMMUTE-M"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: "Explosion parameters as entered on the Explosion Enquiry screen."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BomExplodeRequest"
            example:
              revision: ""
              quantity: 10
              effectiveDate: "2026-10-07"
              view: "INDENTED"
              maxDepth: 0
      responses:
        "200":
          description: "Explosion (RC 0 or 4)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BomExplosionEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: ""
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  completeness: "COMPLETE"
                  stopSummary: "Stopped: purchased 0, use stock 0, depth limit 0, no child bill 0"
                  occurrences: 95
                  depthReached: 4
                  lines:
                    - level: 0
                      item: "FG-BIKE-COMMUTE-M"
                      revision: ""
                      description: "Complete bicycle, commuter, medium"
                      kind: "INTERMED"
                      supply: "MAKE"
                      basis: "PROPORTION"
                      usage: 1.0
                      unit: "EA"
                      required: 10.0
                      unrounded: 10.0
                      stopReason: "ROOT"
                      path: "FG-BIKE-COMMUTE-M"
                      warning: ""
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-BOM-010"
        - "FR-STERP-BOM-021"
        - "FR-STERP-BOM-040"
      x-sterp-legacy:
        forms:
          - "frmBomExplosion.ExplodeClicked dotnet/STERP.Desktop/Forms/Bom/frmBomExplosion.vb:70-99"
        facade:
          - "BomService.Explode dotnet/STERP.Business/Bom/BomService.vb:138-195"
          - "BomService.ViewToFunction dotnet/STERP.Business/Bom/BomService.vb:399-408"
        programs:
          - "BOMLEAF SINGLE|INDENT|FLATTEN cobol/online/bom/BOMLEAF.cob:67-309"
          - "BOMEXPL EXPLODE|NODE cobol/online/bom/BOMEXPL.cob:183-1335"
          - "BOMSELCT, BOMREAD, BOMMATH, BOMWORK, BOMSUPPL (internal callees)"
        procedures: []
        reports: []
        jobs: []
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read-only. Reproduces the COBOL engine session of the facade call: every statement is a SELECT executed in autocommit (no SQLIO BEGN on this path); no row is written. In-process calls run on the caller's connection."
      x-sterp-wave: "W8"
      x-sterp-screen-gate:
        anyOf:
          - "BOM.EXPLODE.RUN"
          - "BOM.VIEW"
        sources:
          - "menu:BOM.COMPARE=BOM.VIEW"
          - "menu:BOM.EXPLODE=BOM.EXPLODE.RUN"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/bom/v1/items/{parentItemCode}/cost":
    post:
      operationId: "bom_costBill"
      summary: "Costed explosion roll-up against a cost set"
      description: "Reproduces BomService.CostedExplosion (BomService.vb:247-308): BOMCOST COST then GETLINE pages (cobol/online/bom/BOMCOST.cob:114-374). Every occurrence is valued once (material at the ranked rate of the cost set or item standard cost, conversion per manufactured node, services and cost-only lines at their line rate, by-products as recovery credit, notes and phantoms at zero), each extended value ROUNDED to 2 decimals; unit cost = ROUNDED(total / quantity) to 6 decimals; a missing rate makes the result INCOMPLETE. conversionCost equals BC-CONVERSION-COST + BC-SETUP-COST as the legacy screen showed it (SME-640). When COST returns RC <= 4 the outcome is that of the last GETLINE (RC 0), so a BOM0810 warning shows only as data.missingRates > 0. FR-STERP-BOM-011. Example: ten DEMO-FRAME at BOMDEMO (TBOMCOST B1)."
      tags:
        - "Explosion Enquiry"
      parameters:
        - name: "parentItemCode"
          in: "path"
          required: true
          description: "Parent item code (BL/BC/BN-PARENT-ITEM X(40)); the screen upper-cases it."
          schema:
            type: "string"
            maxLength: 40
            x-sterp-legacy-field: "BL-PARENT-ITEM PIC X(40)"
            x-sterp-length: 40
          example: "FG-BIKE-COMMUTE-M"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: "Costing parameters; the screen sends the Cost set field (default BOMDEMO)."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BomCostRequest"
            example:
              revision: ""
              quantity: 10
              effectiveDate: "2026-10-07"
              costSet: "BOMDEMO"
      responses:
        "200":
          description: "Costed roll-up (RC 0 or 4)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BomCostedExplosionEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: ""
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  completeness: "COMPLETE"
                  occurrences: 12
                  missingRates: 0
                  totalCost: 100.1
                  unitCost: 10.01
                  materialCost: 70.1
                  conversionCost: 40.0
                  recoveryCredit: 0.0
                  errorPath: ""
                  lines:
                    - level: 0
                      item: "DEMO-FRAME"
                      revision: ""
                      description: "Demonstration frame assembly (B1 root)"
                      kind: "INTERMED"
                      element: "LAB"
                      source: "BOMHEADER"
                      required: 10.0
                      unit: "EA"
                      unitCost: 10.0
                      extendedCost: 15.0
                      branchCost: 0.0
                      path: "DEMO-FRAME"
                      warning: ""
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-BOM-011"
        - "FR-STERP-BOM-021"
        - "FR-STERP-BOM-041"
      x-sterp-legacy:
        forms:
          - "frmBomExplosion.ExplodeClicked (view COSTED) dotnet/STERP.Desktop/Forms/Bom/frmBomExplosion.vb:91-92"
        facade:
          - "BomService.CostedExplosion dotnet/STERP.Business/Bom/BomService.vb:247-308"
        programs:
          - "BOMCOST COST|GETLINE cobol/online/bom/BOMCOST.cob:114-452"
          - "BOMEXPL (FR-STERP-BOM-040)"
        procedures: []
        reports: []
        jobs: []
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read-only. Reproduces the COBOL engine session of the facade call: every statement is a SELECT executed in autocommit (no SQLIO BEGN on this path); no row is written. In-process calls run on the caller's connection."
      x-sterp-wave: "W8"
      x-sterp-screen-gate:
        anyOf:
          - "BOM.EXPLODE.RUN"
          - "BOM.VIEW"
        sources:
          - "menu:BOM.COMPARE=BOM.VIEW"
          - "menu:BOM.EXPLODE=BOM.EXPLODE.RUN"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/bom/v1/items/{parentItemCode}/net":
    post:
      operationId: "bom_netBillRequirement"
      summary: "Netted plan: eligible stock and supply consumed once"
      description: "Reproduces BomService.NettedPlan (BomService.vb:198-244): BOMNET NET then GETLINE pages (cobol/online/bom/BOMNET.cob:103-381). Free stock of the finished parent is taken first, the remainder is exploded in NET mode against live stock (BOMSUPPL), short leaves are counted; RC 8 BOM0710 when the explosion is ERROR, RC 4 BOM0711 when a leaf is short (masked by the final GETLINE, RC 0), maximum buildable 0. Tier-1 seam SEAM-LINK-015 (SME-1245). FR-STERP-BOM-012."
      tags:
        - "Explosion Enquiry"
      parameters:
        - name: "parentItemCode"
          in: "path"
          required: true
          description: "Parent item code (BL/BC/BN-PARENT-ITEM X(40)); the screen upper-cases it."
          schema:
            type: "string"
            maxLength: 40
            x-sterp-legacy-field: "BL-PARENT-ITEM PIC X(40)"
            x-sterp-length: 40
          example: "FG-BIKE-COMMUTE-M"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: "Netting parameters."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BomNetRequest"
            example:
              quantity: 10
              effectiveDate: "2026-10-07"
      responses:
        "200":
          description: "Netted plan (RC 0 or 4)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BomNettedPlanEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: ""
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  maxBuildable: 0.0
                  shortages: 0
                  completeness: "COMPLETE"
                  lines:
                    - level: 0
                      item: "DEMO-FRAME"
                      description: "Demonstration frame assembly (B1 root)"
                      unit: "EA"
                      required: 10.0
                      stockUsed: 0.0
                      inbound: 0.0
                      toMake: 10.0
                      shortage: 0.0
                      excess: 0.0
                      stopReason: "ROOT"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-BOM-012"
        - "FR-STERP-BOM-021"
        - "FR-STERP-BOM-040"
      x-sterp-legacy:
        forms:
          - "frmBomExplosion.ExplodeClicked (view NETTED) dotnet/STERP.Desktop/Forms/Bom/frmBomExplosion.vb:89-90"
        facade:
          - "BomService.NettedPlan dotnet/STERP.Business/Bom/BomService.vb:198-244"
        programs:
          - "BOMNET NET|GETLINE cobol/online/bom/BOMNET.cob:73-381"
          - "BOMSUPPL cobol/online/bom/BOMSUPPL.cob"
          - "BOMEXPL (FR-STERP-BOM-040)"
        procedures: []
        reports: []
        jobs: []
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read-only. Reproduces the COBOL engine session of the facade call: every statement is a SELECT executed in autocommit (no SQLIO BEGN on this path); no row is written. In-process calls run on the caller's connection."
      x-sterp-wave: "W8"
      x-sterp-screen-gate:
        anyOf:
          - "BOM.EXPLODE.RUN"
          - "BOM.VIEW"
        sources:
          - "menu:BOM.COMPARE=BOM.VIEW"
          - "menu:BOM.EXPLODE=BOM.EXPLODE.RUN"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/bom/v1/items/{componentItemCode}/where-used":
    get:
      operationId: "bom_getWhereUsed"
      summary: "Where used: direct and indirect parents of a component"
      description: "Reproduces BomService.WhereUsed (BomService.vb:372-377): bom.usp_BomWhereUsed with the session company, the component, the as-at date, the levels (outside 1..25 the procedure uses 12) and the draft flag; @VariantCode and @IncludeDemand keep their defaults. Only the first result set is returned, as SqlHelper.ExecuteDataTable did (SqlHelper.cs:87-91). Rows ordered by Level, ParentItemCode, BomRef, BomRevision. FR-STERP-BOM-013."
      tags:
        - "Where Used Enquiry"
      parameters:
        - name: "componentItemCode"
          in: "path"
          required: true
          description: "Component item code (@ComponentItemCode varchar(40))."
          schema:
            type: "string"
            maxLength: 40
            x-sterp-legacy-field: "bom.usp_BomWhereUsed.@ComponentItemCode varchar(40)"
            x-sterp-length: 40
          example: "DEMO-PIN"
        - name: "asOf"
          in: "query"
          required: true
          description: "As-at date (@AsOf)."
          schema:
            type: "string"
            format: "date"
            x-sterp-legacy-field: "@AsOf date"
          example: "2026-10-07"
        - name: "maxLevels"
          in: "query"
          required: true
          description: "Levels (@MaxLevels smallint); the screen sends 25 for ALL."
          schema:
            type: "integer"
            format: "int32"
            x-sterp-legacy-field: "@MaxLevels smallint"
          example: 25
        - name: "includeDraft"
          in: "query"
          required: true
          description: "Include DRAFT and REVIEW bills (@IncludeDraft bit)."
          schema:
            type: "boolean"
            x-sterp-legacy-field: "@IncludeDraft bit"
          example: true
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Where-used rows."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BomWhereUsedList"
              example:
                items:
                  - level: 1
                    bomHeaderId: 1001
                    bomRef: "BOM-DEMO-FRAME"
                    bomRevision: "A"
                    status: "RELEASED"
                    parentItemCode: "DEMO-FRAME"
                    componentItemCode: "DEMO-PIN"
                    variantCode: null
                    purpose: "STANDARD"
                    effectiveFrom: "2026-01-01"
                    effectiveTo: null
                    usageQty: 1.0
                    uomCode: "EA"
                    usageBasis: "PROPORTION"
                    isOptional: false
                    alternateGroup: null
                    pathText: "DEMO-PIN < DEMO-FRAME"
                    qtyPerTopUnit: 1.0
                    isDirect: true
                count: 1
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-BOM-013"
        - "FR-STERP-BOM-021"
        - "FR-STERP-BOM-022"
      x-sterp-legacy:
        forms:
          - "frmBomWhereUsed.FindClicked dotnet/STERP.Desktop/Forms/Bom/frmBomWhereUsed.vb:57-84"
          - "frmBomExplosion.WhereUsedClicked dotnet/STERP.Desktop/Forms/Bom/frmBomExplosion.vb:123-136"
        facade:
          - "BomService.WhereUsed dotnet/STERP.Business/Bom/BomService.vb:372-377"
        programs: []
        procedures:
          - "bom.usp_BomWhereUsed db/procs/bom/usp_BomWhereUsed.sql:16-66"
        reports: []
        jobs: []
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One procedure call on its own short ADO.NET connection in autocommit (legacy SqlHelper.ExecuteDataTable, dotnet/STERP.Data/SqlHelper.cs:56-91); the procedure opens no transaction and writes nothing."
      x-sterp-wave: "W8"
      x-sterp-screen-gate:
        anyOf:
          - "BOM.EXPLODE.RUN"
          - "BOM.VIEW"
          - "BOM.WHEREUSED.VIEW"
        sources:
          - "menu:BOM.COMPARE=BOM.VIEW"
          - "menu:BOM.EXPLODE=BOM.EXPLODE.RUN"
          - "menu:BOM.WHEREUSED=BOM.WHEREUSED.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/bom/v1/bills/{bomRef}/revision-comparison":
    get:
      operationId: "bom_compareBillRevisions"
      summary: "Revision comparison with standard-cost impact"
      description: "Reproduces BomService.CompareRevisions (BomService.vb:380-386): bom.usp_BomCompareRevisions with the session company, the bill, the two revisions and the cost set (empty -> NULL). THROW 51421 E-BOM0901 (a revision does not exist) and 51422 E-BOM0902 (same revision) become 422 business-rule problems. Example values are illustrative. FR-STERP-BOM-014."
      tags:
        - "Revision Comparison"
      parameters:
        - name: "bomRef"
          in: "path"
          required: true
          description: "Bill reference (bom.BomHeader.BomRef varchar(30)); the screens upper-case it."
          schema:
            type: "string"
            maxLength: 30
            x-sterp-legacy-field: "bom.BomHeader.BomRef varchar(30)"
            x-sterp-length: 30
          example: "BK-COMMUTE-M"
        - name: "fromRevision"
          in: "query"
          required: true
          description: "@FromRevision varchar(4)."
          schema:
            type: "string"
            maxLength: 4
            x-sterp-length: 4
            x-sterp-legacy-field: "@FromRevision varchar(4)"
          example: "A"
        - name: "toRevision"
          in: "query"
          required: true
          description: "@ToRevision varchar(4)."
          schema:
            type: "string"
            maxLength: 4
            x-sterp-length: 4
            x-sterp-legacy-field: "@ToRevision varchar(4)"
          example: "B"
        - name: "costSetCode"
          in: "query"
          required: false
          description: "@CostSetCode varchar(20); empty or absent -> NULL."
          schema:
            type: "string"
            maxLength: 20
            x-sterp-length: 20
            x-sterp-legacy-field: "@CostSetCode varchar(20)"
          example: "BOMDEMO"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Differences."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BomRevisionDifferenceList"
              example:
                items:
                  - changeType: "CHANGED"
                    componentItemCode: "DEMO-PIN"
                    alternateGroup: null
                    fromQtyPerUnit: 1.0
                    toQtyPerUnit: 2.0
                    qtyDifference: 1.0
                    fromUom: "EA"
                    toUom: "EA"
                    fromBasisType: "PROPORTION"
                    toBasisType: "PROPORTION"
                    fromScrap: 0.0
                    toScrap: 0.0
                    fromSupply: "PURCHASED"
                    toSupply: "PURCHASED"
                    fromRev: null
                    toRev: null
                    fromEff: null
                    toEff: null
                    changedFields: "quantity"
                    unitCost: 0.25
                    costImpact: 0.25
                count: 1
        "400":
