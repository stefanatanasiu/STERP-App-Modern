  "/api/bom/v1/bills/{bomRef}/validate":
    post:
      operationId: "bom_validateBill"
      summary: "Validate a bill revision without recording (BOMVALID CHECK)"
      description: "Reproduces BomService.Validate with record = false as frmBomEditor calls it (BomService.vb:311-340; frmBomEditor.vb:169): BOMVALID CHECK with BV-BOM-REF, BV-BOM-REV, the date and BV-FIND-MAX 50; BV-BOM-ID is never set and BOMVALID reads the bill by id only (BOMVALID.cob:123-156), so the legacy path answers RC 16 BOM0303 \"No bill of materials holds that identity\" (404). Reproduced pending SME-629 (BC-BOM-02). When a bill is found the full rule set applies: FAIL RC 8 BOM0340 -> 422 with data (no findings, SME-1766), WARNING RC 4 BOM0341 and PASS RC 0 -> 200 with up to 50 findings. CHECK writes nothing. FR-STERP-BOM-016."
      tags:
        - "Bill Maintenance"
      parameters:
        - name: "bomRef"
          in: "path"
          required: true
          description: "Bill reference (BV-BOM-REF / @BomRef)."
          schema:
            type: "string"
            maxLength: 30
            x-sterp-legacy-field: "bom.BomHeader.BomRef varchar(30)"
            x-sterp-length: 30
          example: "BK-COMMUTE-M"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: "Validation parameters."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BomValidateRequest"
            example:
              bomRevision: "A"
              effectiveDate: "2026-10-19"
      responses:
        "200":
          description: "PASS or WARNING."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BomValidationEnvelope"
              example:
                outcome:
                  returnCode: 4
                  severity: "WARNING"
                  reasonCode: "BOM0341"
                  message: "Validation passed with warnings to review"
                  messageCount: 1
                  documentRef: ""
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  outcome: "WARNING"
                  errorCount: 0
                  warningCount: 1
                  releaseAllowed: true
                  cyclePath: ""
                  findings:
                    - severity: "WARNING"
                      reason: "BOM0330"
                      lineNum: 20
                      item: "DEMO-PACK"
                      path: "DEMO-FRAME/20:DEMO-PACK"
                      message: "This line expands a bill that is not marked phantom"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "Legacy editor path: bill not found by id (RC 16 BOM0303)."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
              example:
                type: "https://sterp.local/problems/not-found"
                title: "Not found"
                status: 404
                detail: "No bill of materials holds that identity"
                returnCode: 16
                reasonCode: "BOM0303"
                severity: "NOT FOUND"
                messageCount: 1
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        "422":
          description: "FAIL (RC 8 BOM0340) with the result the facade kept."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/BomValidationProblem"
              example:
                type: "https://sterp.local/problems/business-rule"
                title: "Business rule refused the request"
                status: 422
                detail: "Validation failed with 2 error(s) - this bill cannot be released"
                returnCode: 8
                reasonCode: "BOM0340"
                severity: "ERROR"
