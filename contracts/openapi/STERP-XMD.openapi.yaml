openapi: "3.1.0"
info:
  title: "STERP Cross-module control and reporting API (STERP-XMD)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Slice XMD (wave W4) of the modernized STERP ERP: the online business chain trace (legacy CHAINTRC through XmdService.ChainTrace) and its set-based twin rpt.usp_ChainTrace, plus the batch jobs of the cross-module control suite (RECONCTL, EXCPAGE, OBLIGREG, KPIOTIF, CHAINRPT, CONVLOAD, CASHFCST, VATAUDIT) and the job streams XMDCLOSE and XMDCONV. The evidenced legacy behaviour is the contract: return codes, reason codes, messages, data effects and spool content must equal the legacy result for the same inputs and database state after the normalization of 01-shared-platform-contracts.md section 11. Specification: memory/STERP-App/agent-06/application-specs/STERP-XMD.md. Generic run status, SYSOUT, spool and JSON result resources are PLATFORM paths /api/jobs/v1/runs/{jobRunId}[/sysout|/spool|/result] on STERP.Jobs and are not redefined here."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Business Chain Trace"
    description: "Legacy frmChainTrace (menu RPT.CONTROLS.CHAIN 'Business chain trace'): CHAINTRC TRACE and rpt.usp_ChainTrace."
  - name: "Control account reconciliation"
    description: "Catalogue RPT-015 / program RECONCTL (menu RPT.CONTROLS.RECON)."
  - name: "Exception ageing and escalation"
    description: "Catalogue RPT-016 / program EXCPAGE (menu RPT.CONTROLS.EXCP)."
  - name: "Statutory obligations register"
    description: "Catalogue XMD.OBLIGREG / program OBLIGREG (menu RPT.CONTROLS.OBLIG)."
  - name: "On time in full (KPI)"
    description: "Catalogue XMD.KPIOTIF / program KPIOTIF (menu RPT.CONTROLS.KPI)."
  - name: "Chain trace report"
    description: "Catalogue XMD.CHAINRPT / program CHAINRPT (menu RPT.CONTROLS.CHAINRPT)."
  - name: "Legacy conversion load"
    description: "Catalogue XMD.CONVLOAD / program CONVLOAD (menu RPT.CONTROLS.CONV) and stream XMDCONV."
  - name: "Cash forecast"
    description: "Catalogue RPT-004 / program CASHFCST."
  - name: "VAT detail and return review"
    description: "Catalogue RPT-007 and RPT-017 / program VATAUDIT."
  - name: "Job streams"
    description: "Command-file streams jobs/XMDCLOSE.cmd and jobs/XMDCONV.cmd run by the PLATFORM stream runner."
paths:
  "/api/xmd/v1/business-chains/trace":
    post:
      operationId: "xmd_traceBusinessChain"
      summary: "Trace the business chain of one document (CHAINTRC TRACE)"
      description: "Returns the ordered steps of the order-to-cash (ORDER/SALESORDER), procure-to-pay (PO/PURCHASE) or assembly (KIT) chain of one document, with its financial effects, reversal count and completeness judgement, exactly as legacy CHAINTRC function TRACE (STERP-App/cobol/online/xmd/CHAINTRC.cob:60-535) answered the facade XmdService.ChainTrace (STERP-App/dotnet/STERP.Business/Xmd/XmdService.vb:54-68). Rules: validation order company XMD0001, reference XMD0002, type XMD0003 (type upper-cased; CHAINTRC.cob:103-134), RC 8 -> 422 with no SQL; head step from so.DeliverySchedule / po.PurchaseSchedule aggregates or kit.ExecutionKit (missing -> broken, RC 16 XMD0016 -> 404); one operational step per so.Despatch / po.Receipt row or one 'Material issue' aggregate for a kit; one JOURNAL step per fin.Journal row whose ISNULL(SourceRef,'') equals the reference (no status filter), kind REVERSAL when IsReversal = 1; at most 24 steps (truncated -> RC 4 XMD0005); no journal -> broken, RC 4 XMD0004; complete when more than one operational step and at least one journal (CHAINTRC.cob:385-413). Notes are cut to 60 characters, quantities truncated to 3 and values to 2 decimals. Carried legacy behaviour: the response docType is CT-DOC-TYPE as CHAINTRC leaves it (DESPATCH, RECEIPT or KITLINE once the head step was found); an SQL error on the head query is reported as RC 16 XMD0016; list and journal query errors are silent (Agent 04 BRF-CHAINTRC-01/02/07). Read-only. Specification FR-STERP-XMD-010."
      tags:
        - "Business Chain Trace"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/XmdChainTraceRequest"
            examples:
              salesOrder:
                summary: "Demo workflow 1 order SOS900008 (STC/RDG)"
                value:
                  docType: "ORDER"
                  docRef: "SOS900008"
              kit:
                summary: "An execution kit (reference illustrative)"
                value:
                  docType: "KIT"
                  docRef: "KIT-26-0001"
              unsupportedType:
                summary: "Type offered by the legacy picker but refused by CHAINTRC (XMD0003)"
                value:
                  docType: "INVOICE"
                  docRef: "SI-26-1001"
      responses:
        "200":
          description: "RC 0 (severity OK) or RC 4 (severity WARNING: XMD0004 no posted financial effect, XMD0005 truncated) with the chain."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/XmdChainTraceEnvelope"
              examples:
                complete:
                  summary: "Illustrative values - the answer depends on the database state; parity with legacy CHAINTRC is the contract"
                  value:
                    outcome:
                      returnCode: 0
                      severity: "OK"
                      reasonCode: ""
                      message: ""
                      messageCount: 0
                      documentRef: null
                      correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    data:
                      docType: "DESPATCH"
                      docRef: "SOS900008"
                      chainType: "O2C"
                      chainName: "Order to cash"
                      party: "C0090"
                      stepCount: 3
                      maxSteps: 24
                      truncated: "N"
                      complete: "Y"
                      broken: "N"
                      reversals: 0
                      totalGbp: 1104.0
                      steps:
                        - seq: 1
                          stage: "Sales order schedules"
                          docType: "ORDER"
                          reference: "SOS900008"
                          date: "2026-10-09"
                          status: "ACCEPTED"
                          quantity: 24.0
                          valueGbp: 0.0
                          kind: "OPERATION"
                          note: "Scheduled 24.000000    despatched 24.000000    cancelled lin"
                        - seq: 2
                          stage: "Despatch"
                          docType: "DESPATCH"
                          reference: "DSP-26-0101"
                          date: "2026-10-12"
                          status: "CONFIRMED"
                          quantity: 0.0
                          valueGbp: 1104.0
                          kind: "OPERATION"
                          note: ""
                        - seq: 3
                          stage: "Financial effect"
                          docType: "JOURNAL"
                          reference: "JNL-26-004410"
                          date: "2026-10-12"
                          status: "POSTED"
                          quantity: 0.0
                          valueGbp: 1104.0
                          kind: "FINANCIAL"
                          note: "Event SO.DESPATCH              raised by SO"
                noFinancialEffect:
                  summary: "RC 4 XMD0004 - operational steps but no journal (illustrative)"
                  value:
                    outcome:
                      returnCode: 4
                      severity: "WARNING"
                      reasonCode: "XMD0004"
                      message: "The chain has no posted financial effect yet."
                      messageCount: 0
                      documentRef: null
                      correlationId: "5b0d7c1e-2a44-4f0e-8d0b-1c6a9e2f7a31"
                    data:
                      docType: "RECEIPT"
                      docRef: "POS900003"
                      chainType: "P2P"
                      chainName: "Procure to pay"
                      party: "S0004"
                      stepCount: 2
                      maxSteps: 24
                      truncated: "N"
                      complete: "N"
                      broken: "Y"
                      reversals: 0
                      totalGbp: 0.0
                      steps:
                        - seq: 1
                          stage: "Purchase order schedules"
                          docType: "PO"
                          reference: "POS900003"
                          date: "2026-10-20"
                          status: "APPROVED"
                          quantity: 100.0
                          valueGbp: 0.0
                          kind: "OPERATION"
                          note: "Ordered 100.000000   received 40.000000    unreceived commit"
                        - seq: 2
                          stage: "Receipt and GRNI"
                          docType: "RECEIPT"
                          reference: "GRN-26-0042"
                          date: "2026-10-14"
                          status: "CONFIRMED"
                          quantity: 0.0
                          valueGbp: 860.0
                          kind: "OPERATION"
                          note: ""
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "RC 16 XMD0016: head document not found (or the head query failed - BRF-CHAINTRC-01) or nothing recorded for the reference."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
              example:
                type: "https://sterp.local/problems/not-found"
                title: "Not found"
                status: 404
                detail: "No sales order schedule carries that number."
                returnCode: 16
                reasonCode: "XMD0016"
                severity: "NOT FOUND"
                messageCount: 0
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        "422":
          description: "RC 8: XMD0001 (company), XMD0002 (reference), XMD0003 (type), XMD0008 (function; unreachable through this operation)."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
              examples:
                noReference:
                  value:
                    type: "https://sterp.local/problems/business-rule"
                    title: "Business rule refused the request"
                    status: 422
                    detail: "A document reference is required."
                    returnCode: 8
                    reasonCode: "XMD0002"
                    severity: "ERROR"
                    messageCount: 0
                    correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
                unsupportedType:
                  value:
                    type: "https://sterp.local/problems/business-rule"
                    title: "Business rule refused the request"
                    status: 422
                    detail: "Document type must be ORDER, PO or KIT."
                    returnCode: 8
                    reasonCode: "XMD0003"
                    severity: "ERROR"
                    messageCount: 0
                    correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-XMD-010"
        - "FR-STERP-XMD-012"
      x-sterp-legacy:
        forms:
          - "frmChainTrace.TraceClicked (STERP-App/dotnet/STERP.Desktop/Forms/Xmd/frmChainTrace.vb:52-62)"
          - "frmChainTrace.OnConfirm (STERP-App/dotnet/STERP.Desktop/Forms/Xmd/frmChainTrace.vb:47-49)"
        facade:
          - "XmdService.ChainTrace (STERP-App/dotnet/STERP.Business/Xmd/XmdService.vb:54-68)"
          - "XmdService.Copy/NewTable/Steps/Text/Num (STERP-App/dotnet/STERP.Business/Xmd/XmdService.vb:19-46,90-133)"
        programs:
          - "CHAINTRC function TRACE (STERP-App/cobol/online/xmd/CHAINTRC.cob:60-535)"
          - "COMMAREA CHAINTRCCA (STERP-App/cobol/copy/CHAINTRCCA.cpy:16-41)"
        procedures: []
        reports: []
        jobs: []
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read-only. CHAINTRC issues no SQLIO BEGN: the head, list and journal SELECTs run in autocommit on the request connection; no row is written; IDEMPOT is not called (Idempotency-Key is only echoed as the correlation id)."
      x-sterp-wave: "W4"
      x-sterp-screen-gate:
        anyOf:
          - "FIN.ENQUIRY.VIEW"
        sources:
          - "menu:RPT.CONTROLS.CHAIN=FIN.ENQUIRY.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/xmd/v1/business-chains/steps":
    post:
      operationId: "xmd_listBusinessChainSteps"
      summary: "Whole chain from rpt.usp_ChainTrace (legacy 'Whole chain' button)"
      description: "Reproduces XmdService.ChainTraceList (STERP-App/dotnet/STERP.Business/Xmd/XmdService.vb:75-79): probes OBJECT_ID('rpt.usp_ChainTrace') as ServiceBase.Deployed did (absent -> deployed=false, empty list), then executes rpt.usp_ChainTrace @CompanyCode, @DocType, @Reference only (no @UserCode, so no permission check; @MaxSteps default 24) with the SqlHelper rules (empty string -> NULL, timeout 120 s) and returns result set 1 only (at most 24 rows ordered by SortGroup, SortDate, SortRef, RowId; STERP-App/db/procs/rpt/usp_ChainTrace.sql:13-179). THROW 50801/50802/50803 ('STERP-E-080n: ...') -> 422 with reasonCode E-0801..E-0803. The result differs from CHAINTRC in ordering, notes, kit component step and party and is reproduced as is (specification section 4.2; SME-685). Specification FR-STERP-XMD-011."
      tags:
        - "Business Chain Trace"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/XmdChainStepsRequest"
            examples:
              salesOrder:
                summary: "Demo workflow 1 order"
                value:
                  docType: "ORDER"
                  reference: "SOS900008"
      responses:
        "200":
          description: "Result set 1 of rpt.usp_ChainTrace (direct list)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/XmdChainStepList"
              examples:
                steps:
                  summary: "Illustrative values - parity with the procedure result on the same database state is the contract"
                  value:
                    items:
                      - stepNo: 1
                        stage: "Sales order schedules"
                        stepKind: "OPERATION"
                        documentType: "ORDER"
                        reference: "SOS900008"
                        stepDate: "2026-10-09"
                        status: "ACCEPTED"
                        quantity: 24.0
                        amountGbp: 0.0
                        note: "Scheduled 24.000000 despatched 24.000000 cancelled lines 0"
                      - stepNo: 2
                        stage: "Despatch"
                        stepKind: "OPERATION"
                        documentType: "DESPATCH"
                        reference: "DSP-26-0101"
                        stepDate: "2026-10-12"
                        status: "CONFIRMED"
                        quantity: null
                        amountGbp: 1104.0
                        note: "Customer C0090"
                      - stepNo: 3
                        stage: "Financial effect"
                        stepKind: "FINANCIAL"
                        documentType: "JOURNAL"
                        reference: "JNL-26-004410"
                        stepDate: "2026-10-12"
                        status: "POSTED"
                        quantity: null
                        amountGbp: 1104.0
                        note: "Event SO.DESPATCH raised by SO"
                    count: 3
                    deployed: true
                notDeployed:
                  summary: "Procedure absent (legacy warning 'rpt.usp_ChainTrace is not deployed on this database.')"
                  value:
                    items: []
                    count: 0
                    deployed: false
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          description: "Procedure THROW 50801-50803 (BusinessRuleException)."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
              example:
                type: "https://sterp.local/problems/business-rule"
                title: "Business rule refused the request"
                status: 422
                detail: "Document type must be ORDER, PO or KIT."
                returnCode: null
                reasonCode: "E-0803"
                severity: "E"
                messageCount: null
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-XMD-011"
        - "FR-STERP-XMD-012"
      x-sterp-legacy:
        forms:
          - "frmChainTrace.ListClicked (STERP-App/dotnet/STERP.Desktop/Forms/Xmd/frmChainTrace.vb:66-85)"
        facade:
          - "XmdService.ChainTraceList (STERP-App/dotnet/STERP.Business/Xmd/XmdService.vb:75-79)"
          - "XmdService.IsSetTraceable (STERP-App/dotnet/STERP.Business/Xmd/XmdService.vb:142-148)"
          - "ServiceBase.Deployed / SqlHelper.ObjectExists (STERP-App/dotnet/STERP.Business/ServiceBase.vb:59-61; STERP-App/dotnet/STERP.Data/SqlHelper.cs:148-156)"
        programs: []
        procedures:
          - "rpt.usp_ChainTrace (STERP-App/db/procs/rpt/usp_ChainTrace.sql:13-179)"
        reports: []
        jobs: []
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Read-only. The OBJECT_ID probe and the procedure call each run on their own connection in autocommit (SqlHelper); rpt.usp_ChainTrace has no persistent writes (XACT_ABORT ON, table variable only)."
      x-sterp-wave: "W4"
      x-sterp-screen-gate:
        anyOf:
          - "FIN.ENQUIRY.VIEW"
        sources:
          - "menu:RPT.CONTROLS.CHAIN=FIN.ENQUIRY.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/xmd/v1/jobs/RECONCTL/runs":
    servers:
      - url: "https://localhost:7102"
        description: "STERP.Jobs (batch)"
    post:
      operationId: "xmd_submitReconctlRun"
      summary: "Submit control-account reconciliation RECONCTL (catalogue RPT-015)"
      description: "Runs RECONCTL (STERP-App/cobol/batch/xmd/RECONCTL.cob:206-661) for the eight control families AR, AP, INVENTORY, WIP, GRNI, VAT, BANK, ACCRUAL at one cutoff: GL side = SUM(DR - CR) of POSTED journal lines up to the cutoff by account ControlType; subsidiary side per family; difference = subsidiary - signed GL; DIFFERENCE when beyond the tolerance (XMD.RECON.TOLERANCE or TOL, default 0.01), NO CONTROL when no account of the type is posted, else AGREED; every non-agreed family raises (COMMIT) or counts (PREVIEW) a WARNING exception RECONCILIATION DIFFERENCE owned by the family role; COMMIT deletes the OPEN rpt.ReconciliationRun rows of the company/control/cutoff and inserts one row per family. RC 0 RECONCILED, 4 UNRECONCILED/undated/subsidiary or insert failure, 12 spool or GL failure (can be lowered to 4 by later failures, BRF-RECONCTL-02). Permission: catalogue row RPT-015 (FIN.ENQUIRY.VIEW) through core.usp_UiCheckAccess. Also a step of XMDCLOSE (STEP010) and of FIN's MONTHEND (STEP050) through the in-process job-step contract. Result JSON: #/components/schemas/XmdReconctlResult; spool RECONCTL-<CO>-<stamp>.lst. Specification FR-STERP-XMD-020."
      tags:
        - "Control account reconciliation"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/XmdReconctlParameters"
            examples:
              workflow1Step8:
                summary: "Demo workflow 1 step 8 / workflow 6 step 5 (FINCTRL, STC)"
                value:
                  CO: "STC"
                  ASAT: "20261031"
                  MODE: "PREVIEW"
              workflow4Step7:
                summary: "Demo workflow 4 step 7 (FINCTRL, CAL)"
                value:
                  CO: "CAL"
                  ASAT: "20261031"
                  MODE: "PREVIEW"
              commit:
                summary: "Write rpt.ReconciliationRun rows and raise exceptions"
                value:
                  CO: "STC"
                  ASAT: "20261031"
                  MODE: "COMMIT"
                  TOL: "0.01"
      responses:
        "202":
          description: "Run accepted and registered (core.usp_JobRunStart); poll the PLATFORM run resource."
          headers:
            Location:
              description: "/api/jobs/v1/runs/{jobRunId} on STERP.Jobs"
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JobRunAccepted"
              example:
                jobRunId: 41237
                jobName: "RECONCTL"
                status: "RUNNING"
                startedAt: "2026-10-31T18:02:11.0000000"
                links:
                  self: "/api/jobs/v1/runs/41237"
                  sysout: "/api/jobs/v1/runs/41237/sysout"
                  spool: "/api/jobs/v1/runs/41237/spool"
                  result: "/api/jobs/v1/runs/41237/result"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-XMD-020"
        - "FR-STERP-XMD-013"
      x-sterp-legacy:
        forms:
          - "frmReportLauncher.RunClicked (STERP-App/dotnet/STERP.Desktop/Forms/System/frmReportLauncher.vb:83-110) via menu RPT.CONTROLS.RECON"
        facade:
          - "ReportService.Run (STERP-App/dotnet/STERP.Business/System/ReportService.vb:98-181)"
        programs:
          - "RECONCTL (STERP-App/cobol/batch/xmd/RECONCTL.cob:206-661)"
          - "XMDBATPR (STERP-App/cobol/copy/XMDBATPR.cpy:28-316)"
        procedures:
          - "core.usp_RaiseException (via EXCPRAIS)"
          - "core.usp_JobRunStart / core.usp_JobRunEnd (via JOBLOG)"
        reports:
          - "RPT-015 (STERP-App/db/seed/97-xmd-reports.sql:56-58)"
        jobs:
          - "XMDCLOSE STEP010 (STERP-App/jobs/XMDCLOSE.cmd:20-25)"
          - "MONTHEND STEP050 (STERP-App/jobs/MONTHEND.cmd:61)"
      x-sterp-job-result: "#/components/schemas/XmdReconctlResult"
      x-sterp-permission:
        - "FIN.ENQUIRY.VIEW"
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-uow: "No SQLIO BEGN in RECONCTL: every statement autocommits. Per non-agreed family one EXCPRAIS call (core.usp_RaiseException, own unit); in COMMIT per family a DELETE of OPEN rpt.ReconciliationRun rows then an INSERT, as two separate units (SME-670); JOBLOG START/END separate. A failure leaves earlier families' rows committed."
      x-sterp-wave: "W4"
      x-sterp-screen-gate:
        anyOf:
          - "FIN.ENQUIRY.VIEW"
        sources:
          - "menu:RPT.CONTROLS.RECON=FIN.ENQUIRY.VIEW"
          - "report:RPT-015=FIN.ENQUIRY.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
        note: "parameter-dependent: report rows filtered by core.usp_UiReportList -> core.usp_UiCheckAccess (ReportDef.PermissionCode)"
  "/api/xmd/v1/jobs/EXCPAGE/runs":
    servers:
      - url: "https://localhost:7102"
        description: "STERP.Jobs (batch)"
    post:
