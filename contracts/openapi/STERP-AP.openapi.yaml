  "/api/ap/v1/purchase-invoices/duplicate-check":
    post:
      operationId: "ap_checkDuplicateInvoice"
      summary: "Duplicate check of a supplier document (APR0010)"
      description: "InvoiceService.DuplicateCheck -> APINVREG DUPCHK (APINVREG.cob:89-370): defaults INVOICE/PAPER/FX 1/GBP; reference normalised by STRUTIL DOCREF (upper-case, keep A-Z and 0-9 only, other characters removed, leading zeros kept, 40 characters); header edits APR0001-APR0006 (received date defaults to the business date, so a later document date fails APR0006). Exact duplicate (same supplier, type and normalised reference, not REJECTED; the document itself included because no invoice id is passed) -> 422 APR0010 with the problem extension member data; similar documents (same gross or date) -> 200 WARNING APR0011; otherwise 200 \"No duplicate or similar document found\". Nothing is written. This screen does not capture invoices."
      tags:
        - "Invoice Register and Matching"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
