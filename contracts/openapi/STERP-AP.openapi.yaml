openapi: "3.1.0"
info:
  title: "STERP Creditors (accounts payable) API (STERP-AP)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Module API of the STERP-AP slice (wave W7, API segment ap): supplier and bank verification, purchase invoice register, duplicate check and matching, payment proposal, approval and instructions (STERP.Api), and the creditors batch jobs APAGED, APBACS, APREMIT, APPPR, APVAT6M and the PAYRUN stream (STERP.Jobs). It replaces the VB facades InvoiceService, PaymentService and SupplierService, the forms frmInvoiceRegister, frmPaymentRun and frmSupplierVerify and the AP COBOL programs on the shared STERP database. The legacy behaviour is the contract: return/reason codes, messages, data effects and units of work are those of the cited legacy code, including carried defects (for example the second payment decision that approves without reading the decision, BR-APPAYAPR-021, and the discarded Bacs modulus result, BR-APBACS-023). Specification: memory/STERP-App/agent-06/application-specs/STERP-AP.md; shared conventions: 01-shared-platform-contracts.md. Generic job run status, SYSOUT and spool resources are defined by STERP-PLATFORM."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Supplier and Bank Verification"
    description: "frmSupplierVerify / SupplierService (menus AP.SUPPLIER.VERIFY, AP.SUPPLIER.BANKAPP)"
  - name: "Invoice Register and Matching"
    description: "frmInvoiceRegister / InvoiceService (menu AP.INVOICE.REG); enquiry, matching and duplicate check, not invoice capture"
  - name: "Payment Proposal and Run"
    description: "frmPaymentRun / PaymentService (menus AP.PAYMENT.RUN, AP.PAYMENT.AUTH, AP.PAYMENT.REL)"
  - name: "Creditors Reports"
    description: "Creditors Reports menu (AP.RPT.*) and report catalogue rows APAGED, RPT-002, APREMIT, APBACS, APPPR, APVAT6M"
  - name: "Supplier payment run stream"
    description: "jobs/PAYRUN.cmd and catalogue row JOB.PAYRUN"
paths:
  "/api/ap/v1/suppliers":
    get:
      operationId: "ap_listSuppliers"
      summary: "List suppliers with balance and verification counts"
      description: "Supplier list of the session company with ledger balance, blocked and reserved sterling and bank verification counts, ordered by supplier code. Legacy chain: frmSupplierVerify.LoadData -> SupplierService.Suppliers -> ap.usp_SupplierEnquiry @CompanyCode, @SupplierCode (empty -> NULL), @Mode (db/procs/ap/usp_ApEnquiry.sql:8-34). filter matches the supplier code exactly or a legal-name fragment; mode HOLD keeps held suppliers, UNVERIFIED those with an unapproved current bank row or a NOMATCH/CLOSEMATCH result; other values behave as ALL. Complete result set, legacy order (contracts 4.10)."
      tags:
        - "Supplier and Bank Verification"
      parameters:
        - name: "filter"
          in: "query"
          required: false
          description: "Supplier code or legal-name fragment; omitted or empty -> NULL (all)."
          schema:
            type: "string"
            x-sterp-legacy-field: "@SupplierCode varchar(20)"
            x-sterp-length: 20
          example: "S0002"
        - name: "mode"
          in: "query"
          required: false
          description: "ALL, HOLD or UNVERIFIED; omitted -> ALL (decision D-AP-06)."
          schema:
            type: "string"
            x-sterp-legacy-field: "@Mode varchar(10)"
            x-sterp-length: 10
            default: "ALL"
          example: "ALL"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
      responses:
        "200":
          description: "Completed."
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ListEnvelope"
                  - type: "object"
                    properties:
                      items:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/ApSupplierEnquiryRow"
              example:
                items:
                  - companyCode: "STC"
                    supplierCode: "S0002"
                    legalName: "Pennine Tube and Section Ltd"
                    status: "ACTIVE"
                    businessSize: "MEDIUM"
                    currencyCode: "GBP"
                    termsCode: "N45"
                    paymentMethod: "BACS"
                    vatLocation: "GB"
                    vatRegNo: "GB522331499"
                    sanctionsStatus: "CLEAR"
                    purchaseHold: false
                    paymentHold: false
                    holdReason: null
                    balanceGBP: 148.14
                    blockedGBP: 0.0
                    reservedGBP: 0.0
                    bankCount: 2
                    unapprovedBanks: 0
                    copFailures: 0
                count: 1
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
        "501":
          "$ref": "#/components/responses/NotImplemented"
      x-sterp-requirements:
        - "FR-STERP-AP-010"
        - "FR-STERP-AP-018"
      x-sterp-legacy:
        forms:
          - "dotnet/STERP.Desktop/Forms/Creditors/frmSupplierVerify.vb:44-50"
        facade:
          - "dotnet/STERP.Business/Creditors/SupplierService.vb:41-43 SupplierService.Suppliers"
        sql:
          - "ap.usp_SupplierEnquiry db/procs/ap/usp_ApEnquiry.sql:8-34"
          - "ap.vw_SupplierBalance db/views/ap/01-ApViews.sql:37-58"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One read of ap.usp_SupplierEnquiry on a short autocommit connection (SqlHelper model, contracts 6.4); no writes."
      x-sterp-wave: "W7"
      x-sterp-screen-gate:
        anyOf:
          - "AP.BANK.APPROVE"
          - "AP.SUPPLIER.VIEW"
        sources:
          - "menu:AP.SUPPLIER.BANKAPP=AP.BANK.APPROVE"
          - "menu:AP.SUPPLIER.VERIFY=AP.SUPPLIER.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/ap/v1/suppliers/{supplierCode}/banks":
    get:
      operationId: "ap_listSupplierBanks"
      summary: "List the bank records of a supplier"
      description: "Every bank record of the supplier, newest first, with the derived usable state. Legacy chain: frmSupplierVerify.BanksClicked -> SupplierService.Banks -> ap.usp_ListSupplierBanks (db/procs/ap/usp_ApEnquiry.sql:38-51). Bank details are returned unmasked as legacy and are tagged sensitive (contracts 5.9)."
      tags:
        - "Supplier and Bank Verification"
      parameters:
        - name: "supplierCode"
          in: "path"
          required: true
          description: "Supplier account code (upper-cased by the engine)."
          schema:
            type: "string"
            x-sterp-legacy-field: "SV-SUPPLIER / BV-SUPPLIER PIC X(20); ap.Supplier.SupplierCode varchar(20)"
            x-sterp-length: 20
          example: "S0002"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
      responses:
        "200":
          description: "Completed."
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ListEnvelope"
                  - type: "object"
                    properties:
                      items:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/ApSupplierBankRow"
              example:
                items:
                  - supplierBankId: 42
                    bankRef: "QA2610"
                    beneficiaryName: "Pennine Tube and Section Ltd"
                    currencyCode: "GBP"
                    sortCode: "400515"
                    accountNumber: "12345678"
                    iban: null
                    paymentMethod: "BACS"
                    status: "PENDING"
                    copResult: null
                    copCheckedAt: null
                    callBackVerifiedBy: null
                    preparedBy: "APMGR"
                    approvedBy: null
                    approvedAt: null
                    validFrom: "2026-10-07"
                    validTo: null
                    usableState: "AWAITING APPROVAL"
                count: 1
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
        "501":
          "$ref": "#/components/responses/NotImplemented"
      x-sterp-requirements:
        - "FR-STERP-AP-011"
        - "FR-STERP-AP-018"
      x-sterp-legacy:
        forms:
          - "dotnet/STERP.Desktop/Forms/Creditors/frmSupplierVerify.vb:82-92"
        facade:
          - "dotnet/STERP.Business/Creditors/SupplierService.vb:46-48 SupplierService.Banks"
        sql:
          - "ap.usp_ListSupplierBanks db/procs/ap/usp_ApEnquiry.sql:38-51"
      x-sterp-permission: []
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One read of ap.usp_ListSupplierBanks; no writes."
      x-sterp-wave: "W7"
      x-sterp-screen-gate:
        anyOf:
          - "AP.BANK.APPROVE"
          - "AP.SUPPLIER.VIEW"
        sources:
          - "menu:AP.SUPPLIER.BANKAPP=AP.BANK.APPROVE"
          - "menu:AP.SUPPLIER.VERIFY=AP.SUPPLIER.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/ap/v1/suppliers/{supplierCode}/validate":
    post:
      operationId: "ap_validateSupplier"
      summary: "Validate a supplier (may it be ordered from and paid?)"
      description: "APSUPVAL VALIDATE: reads 24 supplier columns, open balance and item count of OPEN/PARTIAL items, mandatory due-diligence counts, then the eligibility table (APSUPVAL.cob:356-423): both refused -> RC 06 APS0006 (HTTP 202), one refused -> RC 04 APS0007, diligence outstanding -> RC 04 APS0008, else RC 00 with a blank message. Unknown supplier -> RC 16 APS0003 (404). termDays is always 0 (set only by TERMCHK). No permission check and no writes in legacy."
      tags:
        - "Supplier and Bank Verification"
      parameters:
        - name: "supplierCode"
          in: "path"
          required: true
          description: "Supplier account code (upper-cased by the engine)."
          schema:
            type: "string"
            x-sterp-legacy-field: "SV-SUPPLIER / BV-SUPPLIER PIC X(20); ap.Supplier.SupplierCode varchar(20)"
