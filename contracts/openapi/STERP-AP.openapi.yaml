  "/api/ap/v1/suppliers/{supplierCode}/banks/prepare":
    post:
      operationId: "ap_prepareSupplierBank"
      summary: "Prepare a GB/GBP Bacs bank change (PENDING)"
      description: "SupplierService.PrepareBank: the facade first checks every value against its COMMAREA width (SupplierService.vb:112-128) - a bank reference longer than 10 characters returns 422 APBINPUT \"Bank reference must be at most 10 characters. Nothing was recorded.\" and nothing is written (never truncated). Then APBANKVR PREPARE (APBANKVR.cob:155-384): permission AP.BANK.MAINT (RC 06 APB0022), beneficiary required (APB0003), GB sort code six digits (APB0004) and account eight digits (APB0005), PENDING sensitive row inserted with PreparedBy = session user and ValidFrom = business date, audit PREPARE, RC 04 APB0010."
      tags:
        - "Supplier and Bank Verification"
      parameters:
        - name: "supplierCode"
          in: "path"
          required: true
          description: "Supplier account code (upper-cased by the engine)."
          schema:
            type: "string"
            x-sterp-legacy-field: "SV-SUPPLIER / BV-SUPPLIER PIC X(20); ap.Supplier.SupplierCode varchar(20)"
            x-sterp-length: 20
          example: "S0002"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ApBankPrepareRequest"
            example:
              bankRef: "QA2610"
              beneficiary: "Pennine Tube and Section Ltd"
              sortCode: "400515"
              accountNo: "12345678"
              bankName: "Fictional QA Bank"
              requestSource: "EMAIL"
      responses:
        "200":
          description: "RC 04 APB0010 (WARNING) on success, as legacy."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
