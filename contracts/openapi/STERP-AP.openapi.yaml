        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ApDuplicateCheckRequest"
            example:
              supplierCode: "S0001"
              documentType: "INVOICE"
              supplierDocRef: "AAS/118220"
              statedGross: 28800.0
              documentDate: "2026-07-04"
      responses:
        "200":
          description: "No exact duplicate: RC 00 or RC 04 APR0011 (similar documents)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "outcome"
                  - "data"
                properties:
                  outcome:
                    "$ref": "#/components/schemas/Outcome"
                  data:
                    "$ref": "#/components/schemas/ApDuplicateCheckResult"
              example:
                outcome:
                  returnCode: 4
                  severity: "WARNING"
                  reasonCode: "APR0011"
                  message: "A similar document is already registered for this supplier; review it before proceeding"
                  messageCount: 1
                  documentRef: "AP-003"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
