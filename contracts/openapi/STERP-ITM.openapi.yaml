    post:
      operationId: "itm_reviewItemActivation"
      summary: "Activation review (ITEMVAL VALIDATE)"
      description: "Runs the activation review of ItemService.Review(item, \"VALIDATE\") (ItemService.vb:76-83): ITEMVAL function VALIDATE (ITEMVAL.cob:89-133 validation, :140-228 item read, :611-671 outcome, :673-1014 checks). RC 00 no faults, RC 04 ITM0004 warnings only (200 WARNING, message \"Item <item> has the information its enabled processes need\", :637-646), RC 08 ITM0004 any ERROR fault (\"Activation review found <n> item(s) to resolve before release\", :647-655; 422 with the review returned in the problem `data` member, contracts 4.7), RC 16 ITM0001 unknown item (404), RC 12 SQL0001 (500). At most 24 faults (:661-670). Reads only; no writes. No request body."
      tags:
        - "Item and Part Maintenance"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "itemCode"
          in: "path"
          required: true
          description: "Legacy item code (the page trims and upper-cases it, frmItemMaster.vb:90)."
          schema:
            type: "string"
            maxLength: 40
            x-sterp-length: 40
            x-sterp-legacy-field: "IV-ITEM-CODE PIC X(40) / inv.Item.ItemCode varchar(40)"
          example: "NUT-M6-NYLOC"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ItmItemActivationReviewEnvelope"
              example:
                outcome:
                  returnCode: 4
                  severity: "WARNING"
                  reasonCode: "ITM0004"
                  message: "Item NUT-M6-NYLOC has the information its enabled processes need"
                  messageCount: 0
                  documentRef: ""
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  itemCode: "NUT-M6-NYLOC"
                  action: "VALIDATE"
                  lifecycle: "RELEASED"
                  ready: "Y"
                  faults:
                    - fReq: "ITM-004"
                      fSeverity: "WARNING"
                      fField: "StewardUser"
                      fText: "No master data steward owns this item"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          description: "RC 08 (ITM0004 with ERROR faults, or ITM0001); the problem carries the review in `data` (contracts 4.7). Example fault text from ITEMVAL.cob:831-845; the item is illustrative."
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ItmActivationReviewProblem"
              example:
                type: "https://sterp.local/problems/business-rule"
                title: "Business rule refused the request"
                status: 422
                detail: "Activation review found 1 item(s) to resolve before release"
                returnCode: 8
                reasonCode: "ITM0004"
                severity: "ERROR"
                messageCount: 1
                correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  itemCode: "NUT-M6-NYLOC"
                  action: "VALIDATE"
                  ready: "N"
                  faults:
                    - fReq: "ITM-025"
                      fSeverity: "ERROR"
                      fField: "ItemVatClass SALE"
