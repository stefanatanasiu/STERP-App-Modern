        - "Screen and catalogue gate (contracts 5.4, binding): ITM.COUNT.ENTER via menu ITM.STOCKCOUNT (db/seed/27-itm-menu.sql:24); checked through core.usp_UiCheckAccess before the handler; refusal 403 PRM0006 \"<user> does not hold <permission>\" (informative listing; binding codes are x-sterp-screen-gate)."
