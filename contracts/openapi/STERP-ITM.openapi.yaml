openapi: "3.1.0"
info:
  title: "STERP Items and stock control API (STERP-ITM)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Online module API (STERP.Api) and batch job submissions (STERP.Jobs) of slice ITM, wave W1, target application STERP-ITM: item master enquiry and activation review, stock enquiry, availability, movement history, lot/serial trace, stock movement posting, stock counts and the six ITM batch programs. The legacy behaviour (VB facades STERP.Business/Items, COBOL cobol/online/itm and cobol/batch/itm, inv procedures) is the contract: STERP-ITM.md and 01-shared-platform-contracts.md are binding; examples use the STERP demo data and are illustrative where noted. Components named Itm*Commarea describe the public in-process contracts (IC-ITM-STKMOVE, -STKRESV, -AVAILQ, -UOMCONV, -LOTSER, -SUBSTCHK) used by SO, PO, KIT, CST and XMD; they are not HTTP payloads."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Item and Part Maintenance"
    description: "Legacy frmItemMaster (menu ITM.ITEM)."
  - name: "Stock Enquiry"
    description: "Legacy frmStockEnquiry (menu ITM.STOCKENQ)."
  - name: "Stock Movement Entry"
    description: "Legacy frmStockMovement (menu ITM.STOCKMOVE)."
  - name: "Stock Count and Adjustment"
    description: "Legacy frmStockCount (menu ITM.STOCKCOUNT)."
  - name: "Stock Reports"
    description: "Legacy report catalogue rows of module itm (menu ITM.REPORTS) and COUNTADJ."
paths:
  "/api/itm/v1/items/{itemCode}":
    get:
      operationId: "itm_getItem"
      summary: "Item header (every inv.Item column)"
      description: "Returns the governed catalogue identity of one item: `SELECT * FROM inv.Item WHERE CompanyCode = @c AND ItemCode = @i` (ItemService.Header, ItemService.vb:36-39), every column including rowVersion (decision D-ITM-11). No row: 404 with detail \"Item <item> does not exist in <company>.\" (frmItemMaster.vb:93-96). Example values are illustrative (seed db/seed/20-itm-items-a.sql:57)."
      tags:
        - "Item and Part Maintenance"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "itemCode"
          in: "path"
          required: true
          description: "Legacy item code (the page trims and upper-cases it, frmItemMaster.vb:90)."
          schema:
            type: "string"
            maxLength: 40
            x-sterp-length: 40
            x-sterp-legacy-field: "IV-ITEM-CODE PIC X(40) / inv.Item.ItemCode varchar(40)"
          example: "NUT-M6-NYLOC"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ItmItem"
              example:
                companyCode: "STC"
                itemCode: "NUT-M6-NYLOC"
                description: "Nyloc nut M6, stainless A4"
                longDescription: null
                itemClass: "BOUGHT"
                category: "FASTENER"
                productGroup: null
                stewardUser: null
                stockUomCode: "EA"
                purchaseUomCode: "PK500"
                salesUomCode: null
                issueUomCode: null
                quantumQty: 1.0
                isIndivisible: true
                netWeightKg: 0.003
                volumeM3: null
                drawingRef: null
                specificationRef: null
                currentRevision: "A"
                traceabilityType: "NONE"
                shelfLifeDays: null
                minRemainingShelfLifeDays: null
                requiresInspection: false
                makeBuy: "BUY"
                valuationGroup: "HARDWARE"
                costMethod: "MWA"
                standardBatchQty: null
                inventoryAccountGroup: null
                revenueAccountGroup: null
                isPurchasable: true
                isSaleable: true
                isManufacturable: false
                isConsumable: true
                isStocked: true
                isDrcSpecifiedGoods: false
                ukcaMarked: false
                conformityDocRef: null
                dangerousGoodsUn: null
                dangerousGoodsClass: null
                dangerousGoodsPackGroup: null
                reachStatus: null
                weeeCategory: null
                batteryCategory: null
                lifecycleStatus: "RELEASED"
                successorItemCode: null
                predecessorItemCode: null
                statusReason: null
                releasedAt: null
                releasedBy: null
                retentionClass: "FIN7"
                createdBy: "SEED"
                createdAt: "2026-10-05T09:00:00.0000000"
                modifiedBy: null
                modifiedAt: null
                rowVersion: "AAAAAAAAB9E="
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-ITM-010"
        - "FR-STERP-ITM-040"
      x-sterp-legacy:
        forms:
          - "frmItemMaster.LoadData (frmItemMaster.vb:88-107)"
        facade:
          - "ItemService.Header (ItemService.vb:36-39)"
        sql:
          - "inv.Item (db/tables/20-inv/02-Item.sql:4-20)"
      x-sterp-permission:
        - "Business permission checks in the legacy flow: none (no ITM program calls PERMCHK and the facade checks none)."
        - "Screen and catalogue gate (contracts 5.4, binding): ITM.ITEM.VIEW via menu ITM.ITEM (db/seed/27-itm-menu.sql:21); checked through core.usp_UiCheckAccess before the handler; refusal 403 PRM0006 \"<user> does not hold <permission>\" (informative listing; binding codes are x-sterp-screen-gate)."
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One SELECT in autocommit on a short connection (legacy SqlHelper ad-hoc query, SqlHelper.cs:56-120); no transaction."
      x-sterp-wave: "W1"
      x-sterp-screen-gate:
        anyOf:
          - "ITM.ITEM.VIEW"
        sources:
          - "menu:ITM.ITEM=ITM.ITEM.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
