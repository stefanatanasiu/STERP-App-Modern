      operationId: "itm_recordCountedQuantity"
      summary: "Record a counted quantity (generic maintenance ITM.COUNTLINE)"
      description: "StockService.SaveCount (StockService.vb:141-148) -> MaintService.Save('ITM.COUNTLINE', 'CHANGE', {CountId, LineNum, CountedQty, Status=COUNTED}) -> EXEC core.usp_UiMaintSave @MaintCode, @UserCode, @CompanyCode, @Mode, @Data (XML; MaintService.vb:31-36,51-60). The quantity text is passed as typed and converted by the procedure (D-ITM-12). A procedure THROW 'STERP-<s>-<code>: text' -> 422 with that reason (legacy showed '<text>  (<code>)'); any other error -> 500 SYS0001. No intervening quantity or header status is written (contrast COUNTADJ ENTER, SME-1490); no concurrency token."
      tags:
        - "Stock Count and Adjustment"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "countId"
          in: "path"
          required: true
          description: "Count id of the selected line."
          schema:
            type: "integer"
            format: "int32"
            x-sterp-legacy-field: "inv.StockCountLine.CountId int (maintenance key, 27-itm-menu.sql:290)"
          example: 7
        - name: "lineNum"
          in: "path"
          required: true
          description: "Line number."
          schema:
            type: "integer"
            format: "int32"
            x-sterp-legacy-field: "inv.StockCountLine.LineNum int (maintenance key, 27-itm-menu.sql:291)"
          example: 1
      requestBody:
        required: true
        description: "The counted quantity as typed in the prompt."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ItmCountedQuantityRequest"
            example:
              countedQty: "58"
      responses:
        "200":
          description: "Success"
          content:
