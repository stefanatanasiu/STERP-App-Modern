      description: "Submits job OPENSTK to STERP.Jobs with the legacy KEY=VALUE arguments as a JSON object (contracts 8.2-8.3; behaviour in STERP-ITM.md FR-STERP-ITM-036, FR-STERP-ITM-037). Registers the run with core.usp_JobRunStart (as ReportService.Run, ReportService.vb:98-182) and the program registers itself through JOBLOG (double registration, SME-010). Returns 202 with JobRunAccepted; poll /api/jobs/v1/runs/{jobRunId} (PLATFORM) for status, SYSOUT, spool and result. Exit codes keep the legacy meaning."
      tags:
        - "Stock Reports"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: "Legacy KEY=VALUE arguments (unknown keys ignored, as CMDARGS)."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ItmOpenstkJobParameters"
            example:
              CO: "CAL"
              SITE: "GLA"
              ASAT: "20260331"
              MODE: "PREVIEW"
      responses:
        "202":
          description: "Run accepted (JobRunAccepted); Location: /api/jobs/v1/runs/{jobRunId}."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/JobRunAccepted"
              example:
                jobRunId: 90412
                jobName: "OPENSTK"
                status: "RUNNING"
                startedAt: "2026-10-19T23:40:00.0000000"
                links:
                  self: "/api/jobs/v1/runs/90412"
                  sysout: "/api/jobs/v1/runs/90412/sysout"
                  spool: "/api/jobs/v1/runs/90412/spool"
                  result: "/api/jobs/v1/runs/90412/result"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-ITM-036"
        - "FR-STERP-ITM-037"
      x-sterp-legacy:
        reports:
          - "ITM.OPENSTK"
        cobol:
          - "OPENSTK (cobol/batch/itm/OPENSTK.cob)"
          - "STKMOVE OPENING"
        sql:
          - "inv.usp_PostStockMovement"
        files:
          - "FL-042"
          - "FL-043"
      x-sterp-permission:
        - "Business permission checks in the legacy flow: none (no ITM program calls PERMCHK and the facade checks none)."
        - "Screen and catalogue gate (contracts 5.4, binding): ITM.STOCK.ADJUST via report row ITM.OPENSTK (db/seed/27-itm-menu.sql:73); checked through core.usp_UiCheckAccess before the handler; refusal 403 PRM0006 \"<user> does not hold <permission>\" (informative listing; binding codes are x-sterp-screen-gate)."
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-uow: "No batch unit of work: each COMMIT row is posted by its own STKMOVE OPENING transaction; a rerun is idempotent through the per-row correlation id (OPENSTK.cob:486-498)."
      x-sterp-wave: "W1"
      x-sterp-screen-gate:
        anyOf:
          - "ITM.STOCK.ADJUST"
        sources:
          - "report:ITM.OPENSTK=ITM.STOCK.ADJUST"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
