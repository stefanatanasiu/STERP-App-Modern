      description: "Reproduces CostingService.Rollup. COSTROLL ROLLUP (target set blank, effective and cost date = business date, currency = company base currency, max depth 10, window 20, from-line 0): refusals CST0601/CST0602/CST0606 (422); BOMCOST COST for the STANDARD engineering bill at lotSize good units via the BOM public contract on this request's connection (STOP = depth 1); BOMCOST failure -> reason CST0603 with BOMCOST's return code and message; missing rates -> INCOMPLETE, CST0604, RC 04 (WARNING); labour = conversion - setup; LABOVH OVERHEAD only when a work centre is present (never on this route); total = material + labour + machine + setup + subcontract + overhead + other - recovery; total < 0 -> RC 06 CST0609 (HTTP 202 HOLD, no lines); unit = ROUNDED(total / good output, 6 dp). When ROLLUP RC <= 4 the costed tree is paged exactly as the facade does (GETLINE from 1 + lines read while moreLines = Y, at most 25 windows, silent stop on a failed GETLINE). The summary is the COMMAREA after the last engine call: after any GETLINE the totals are 0.00 and completeness COMPLETE (legacy parity F-COSTROLL-01; BC-CST-01 proposes returning the ROLLUP totals). Writes nothing in CST. Gate (contracts 5.4, binding): before the handler runs, the API checks the menu permission of the calling screen (CST.STANDARD.MAINT) through core.usp_UiCheckAccess; refusal is 403 PRM0006 '<user> does not hold <permission>'. The legacy flow has no business permission check, so no other check is added; x-sterp-permission repeats the gate code."
