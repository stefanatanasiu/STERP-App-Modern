openapi: "3.1.0"
info:
  title: "STERP Costing API (STERP-CST)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Costing slice (target application STERP-CST, API segment cst, wave W10) of the modernized STERP ERP. Online operations replace the desktop costing screens' facade CostingService and the COBOL engines STDCOST, COSTROLL (with BOMCOST through the BOM public contract), WHATIF, MARGIN, COSTNORM, LABOVH, JOBCOST and WIPCALC; batch operations replace the report programs CSTINVAL, CSTJOBPR, CSTVARRP, CSTSETCM and CSTWIPRF. The legacy behaviour is the contract: values, messages, reason and return codes, data effects and units of work reproduce the legacy implementation at commit 00631916 (see application-specs/STERP-CST.md and 01-shared-platform-contracts.md). Programs reached only from COBOL test drivers (FIFOVAL, LANDED, MWAVAL, NRVTEST, VARIANCE) are deferred and not exposed (SME-004)."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Item Cost Enquiry"
    description: "Costing > Item Cost Enquiry (frmCostEnquiry)"
  - name: "Cost Sets"
    description: "Costing > Cost Sets (frmCostSet)"
  - name: "Roll-up and What-if"
    description: "Costing > Roll-up and What-if (frmCostRollup)"
  - name: "Job Cost Enquiry"
    description: "Costing > Job Cost Enquiry and Work in Progress (frmJobCost)"
  - name: "Costing Reports"
    description: "Costing report catalogue CSTRP010-CSTRP050 (batch jobs on STERP.Jobs)"
paths:
  "/api/cst/v1/items/{itemCode}/cost-bases":
    get:
      operationId: "cst_getItemCostBases"
      summary: "Item cost enquiry - every held basis side by side"
      description: "Returns every cst.ItemCost pool of the item with average, carrying value, allowance, net carrying value, NRV, pool standard, last purchase cost, the oldest open FIFO layer's unit cost and the open-layer count, and the standard of the latest ACTIVE cost set, exactly as cst.usp_CostEnquiry returns them (ORDER BY SiteCode). Legacy chain: frmCostEnquiry.LoadData -> CostingService.CostEnquiry -> cst.usp_CostEnquiry @CompanyCode, @ItemCode, @Revision, @SiteCode (CostingService.vb:129-134; db/procs/cst/01-cst-enquiry.sql:69-113). A basis is stated, never substituted. Read-only. Gate (contracts 5.4, binding): before the handler runs, the API checks the menu permission of the calling screen (CST.COST.VIEW) through core.usp_UiCheckAccess; refusal is 403 PRM0006 '<user> does not hold <permission>'. The legacy flow has no business permission check, so no other check is added; x-sterp-permission repeats the gate code."
      tags:
        - "Item Cost Enquiry"
      parameters:
        - "$ref": "#/components/parameters/CstItemCode"
        - name: "revision"
          in: "query"
          required: false
          description: "Revision; omitted or empty is sent as NULL (all revisions, SqlHelper.cs:33)."
          schema:
            type: "string"
            maxLength: 4
            x-sterp-length: 4
            x-sterp-legacy-field: "@Revision varchar(4)"
          example: ""
        - name: "site"
          in: "query"
          required: false
          description: "Site of the pool; omitted or blank is sent as NULL (all pools, CostArea.Opt)."
          schema:
            type: "string"
            maxLength: 10
            x-sterp-length: 10
            x-sterp-legacy-field: "@SiteCode varchar(10)"
          example: "RDG"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Complete result set in procedure order."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CstItemCostBasisList"
              examples:
                demo:
                  summary: "Company pool of BAR-AL6082-25MM in the CST demo fixture (db/seed/94-cst-demo.sql:196-210); standardSet assumes FY2026STD is the latest ACTIVE set"
                  value:
                    items:
                      - itemCode: "BAR-AL6082-25MM"
                        revision: ""
                        siteCode: "*"
                        costMethod: "MWA"
                        qtyOnHand: 260.0
                        averageUnitCost: 18.5
                        carryingValueGbp: 4810.0
                        allowanceGbp: 650.0
                        netCarryingGbp: 4160.0
                        nrvUnitValue: 16.0
                        standardUnitCost: 18.5
                        lastPurchaseCost: null
                        fifoOldestUnit: null
                        fifoLayers: 0
                        standardSet: "FY2026STD"
                        standardFromSet: 18.5
                        isImpaired: "Y"
                    count: 1
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-CST-010"
        - "FR-STERP-CST-030"
      x-sterp-legacy:
        forms:
          - "frmCostEnquiry"
        facade:
          - "CostingService.CostEnquiry"
          - "CostArea.Opt"
        procedures:
          - "cst.usp_CostEnquiry"
        citations:
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:129-134"
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:61-64"
          - "STERP-App/db/procs/cst/01-cst-enquiry.sql:69-113"
          - "STERP-App/dotnet/STERP.Desktop/Forms/Costing/frmCostEnquiry.vb:30-42"
      x-sterp-permission:
        - "CST.COST.VIEW"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One procedure call in autocommit; read-only."
      x-sterp-wave: "W10"
      x-sterp-screen-gate:
        anyOf:
          - "CST.COST.VIEW"
        sources:
          - "menu:CST.ENQUIRY=CST.COST.VIEW"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/cst/v1/cost-sets":
    get:
      operationId: "cst_listCostSets"
      summary: "Cost set worklist"
      description: "Lists the company's cost sets with preparer and approver side by side, item counts and the SelfApproved flag, as cst.usp_CostSetList returns them (status rank ACTIVE, APPROVED, REVIEW, DRAFT, other; EffectiveFrom DESC; CostSetCode). Legacy chain: frmCostSet.LoadData -> CostingService.Sets -> cst.usp_CostSetList @CompanyCode, @Status (CostingService.vb:137-140; db/procs/cst/02-cst-lists.sql:11-41). Read-only. Gate (contracts 5.4, binding): before the handler runs, the API checks the menu permission of the calling screen (CST.STANDARD.MAINT) through core.usp_UiCheckAccess; refusal is 403 PRM0006 '<user> does not hold <permission>'. The legacy flow has no business permission check, so no other check is added; x-sterp-permission repeats the gate code."
      tags:
        - "Cost Sets"
      parameters:
        - name: "status"
          in: "query"
          required: false
          description: "DRAFT, REVIEW, APPROVED or ACTIVE; omitted (page ALL) is sent as NULL."
          schema:
            type: "string"
            maxLength: 10
            x-sterp-length: 10
            x-sterp-legacy-field: "@Status varchar(10)"
          example: "REVIEW"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Complete result set in procedure order."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CstCostSetList"
              examples:
                demo:
                  summary: "status=REVIEW on the demo database (db/seed/94-cst-demo.sql:164-187)"
                  value:
                    items:
                      - costSet: "FY2027STD"
                        name: "Standard cost set, financial year 2027"
                        purpose: "STANDARD"
                        status: "REVIEW"
                        currency: "GBP"
                        fiscalYear: 2027
                        effectiveFrom: "2027-01-01"
                        comparedTo: "FY2026STD"
                        preparedBy: "KWATSON"
                        approvedBy: null
                        approvedAt: null
                        activatedAt: null
                        items: 4
                        selfApproved: ""
                    count: 1
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-CST-011"
        - "FR-STERP-CST-031"
      x-sterp-legacy:
        forms:
          - "frmCostSet"
        facade:
          - "CostingService.Sets"
          - "CostArea.Opt"
        procedures:
          - "cst.usp_CostSetList"
        citations:
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:137-140"
          - "STERP-App/db/procs/cst/02-cst-lists.sql:11-41"
          - "STERP-App/dotnet/STERP.Desktop/Forms/Costing/frmCostSet.vb:41-54"
      x-sterp-permission:
        - "CST.STANDARD.MAINT"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "One procedure call in autocommit; read-only."
      x-sterp-wave: "W10"
      x-sterp-screen-gate:
        anyOf:
          - "CST.STANDARD.MAINT"
        sources:
          - "menu:CST.COSTSET=CST.STANDARD.MAINT"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/cst/v1/cost-sets/{costSet}/review":
    post:
      operationId: "cst_reviewCostSet"
      summary: "Move a DRAFT cost set to REVIEW (STDCOST REVIEW)"
      description: "Runs STDCOST REVIEW with SC-COMMIT Y: company required (CST0401), set upper-cased and read (absent: 404 CST0402), status must be DRAFT (else 422 CST0403 'Cost set is <status> - it must be DRAFT for this action'), then UPDATE cst.CostSet SET Status = 'REVIEW', ReviewedBy, ModifiedBy = user, ModifiedAt = SYSDATETIME(). approvedBy in the answer is the acting user (legacy overwrite, BR-STDCOST-020). Legacy chain: frmCostSet.ReviewClicked -> CostingService.Review -> STDCOST 2000/2300/2400 (CostingService.vb:168-172; STDCOST.cob:258-262,286-406). Gate (contracts 5.4, binding): before the handler runs, the API checks the menu permission of the calling screen (CST.STANDARD.MAINT) through core.usp_UiCheckAccess; refusal is 403 PRM0006 '<user> does not hold <permission>'. The legacy flow has no business permission check, so no other check is added; x-sterp-permission repeats the gate code."
      tags:
        - "Cost Sets"
      parameters:
        - "$ref": "#/components/parameters/CstCostSet"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CstEmptyRequest"
            examples:
              none:
                summary: "No fields"
                value: {}
      responses:
        "200":
          description: "Set moved to REVIEW."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CstCostSetActionEnvelope"
              examples:
                illustrative:
                  summary: "Illustrative DRAFT set FY2028STD reviewed by COSTACC"
                  value:
                    outcome:
                      returnCode: 0
                      severity: "OK"
                      reasonCode: ""
                      message: ""
                      messageCount: 0
                      documentRef: "CST-007"
                      correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    data:
                      costSet: "FY2028STD"
                      compareSet: "FY2027STD"
                      status: "REVIEW"
                      purpose: "STANDARD"
                      preparedBy: "KWATSON"
                      approvedBy: "COSTACC"
                      itemCount: 0
                      revalGbp: 0.0
                      adverse: "N"
                      completeness: "COMPLETE"
                      warning: ""
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-CST-012"
        - "FR-STERP-CST-031"
        - "FR-STERP-CST-060"
      x-sterp-legacy:
        forms:
          - "frmCostSet"
        facade:
          - "CostingService.Review"
          - "CostingService.SetArea"
        programs:
          - "STDCOST/REVIEW"
        citations:
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:168-172"
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:157-165"
          - "STERP-App/cobol/online/cst/STDCOST.cob:286-457"
          - "STERP-App/dotnet/STERP.Desktop/Forms/Costing/frmCostSet.vb:61-63"
      x-sterp-permission:
        - "CST.STANDARD.MAINT"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "STDCOST reads the set, then one UPDATE of cst.CostSet in autocommit (no BEGN/COMT in STDCOST, cobol/online/cst/STDCOST.cob:332-371); no lock or rowversion predicate; correlation id only (no IDEMPOT)."
      x-sterp-wave: "W10"
      x-sterp-screen-gate:
        anyOf:
          - "CST.STANDARD.MAINT"
        sources:
          - "menu:CST.COSTSET=CST.STANDARD.MAINT"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/cst/v1/cost-sets/{costSet}/approve":
    post:
      operationId: "cst_approveCostSet"
      summary: "Approve a reviewed cost set; the preparer may not approve (STDCOST APPROVE)"
      description: "Runs STDCOST APPROVE with SC-COMMIT Y: status must be REVIEW (422 CST0403); when TRIM(PreparedBy) = TRIM(acting user) the answer is RC 06 CST0405 'The preparer of a cost set may not approve it' with nothing written (HTTP 202, severity HOLD); otherwise UPDATE cst.CostSet SET Status = 'APPROVED', ApprovedBy = user, ApprovedAt, ModifiedBy, ModifiedAt. The separation of preparer and approver is never relaxed. Legacy chain: frmCostSet.ApproveClicked (confirmation) -> CostingService.Approve -> STDCOST 2100/2300 (CostingService.vb:178-182; STDCOST.cob:266-270,286-376). Gate (contracts 5.4, binding): before the handler runs, the API checks the menu permission of the calling screen (CST.STANDARD.MAINT) through core.usp_UiCheckAccess; refusal is 403 PRM0006 '<user> does not hold <permission>'. The legacy flow has no business permission check, so no other check is added; x-sterp-permission repeats the gate code."
      tags:
        - "Cost Sets"
      parameters:
        - "$ref": "#/components/parameters/CstCostSet"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CstEmptyRequest"
            examples:
              none:
                summary: "No fields"
                value: {}
      responses:
        "200":
          description: "Set approved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CstCostSetActionEnvelope"
              examples:
                demo:
                  summary: "FY2027STD approved by COSTACC (demo step 8 cancels this action unless separately authorised)"
                  value:
                    outcome:
                      returnCode: 0
                      severity: "OK"
                      reasonCode: ""
                      message: ""
                      messageCount: 0
                      documentRef: "CST-007"
                      correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    data:
                      costSet: "FY2027STD"
                      compareSet: "FY2026STD"
                      status: "APPROVED"
                      purpose: "STANDARD"
                      preparedBy: "KWATSON"
                      approvedBy: "COSTACC"
                      itemCount: 0
                      revalGbp: 0.0
                      adverse: "N"
                      completeness: "COMPLETE"
                      warning: ""
        "202":
          description: "HOLD (RC 06): self-approval refused, nothing written (contracts 4.6)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CstCostSetActionEnvelope"
              examples:
                selfApproval:
                  summary: "The preparer tries to approve: refused, nothing written"
                  value:
                    outcome:
                      returnCode: 6
                      severity: "HOLD"
                      reasonCode: "CST0405"
                      message: "The preparer of a cost set may not approve it"
                      messageCount: 1
                      documentRef: "CST-007"
                      correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    data:
                      costSet: "FY2027STD"
                      compareSet: "FY2026STD"
                      status: "REVIEW"
                      purpose: "STANDARD"
                      preparedBy: "KWATSON"
                      approvedBy: ""
                      itemCount: 0
                      revalGbp: 0.0
                      adverse: "N"
                      completeness: "COMPLETE"
                      warning: ""
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-CST-013"
        - "FR-STERP-CST-031"
        - "FR-STERP-CST-060"
      x-sterp-legacy:
        forms:
          - "frmCostSet"
        facade:
          - "CostingService.Approve"
          - "CostingService.SetArea"
        programs:
          - "STDCOST/APPROVE"
        citations:
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:178-182"
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:157-165"
          - "STERP-App/cobol/online/cst/STDCOST.cob:286-457"
          - "STERP-App/dotnet/STERP.Desktop/Forms/Costing/frmCostSet.vb:66-70"
      x-sterp-permission:
        - "CST.STANDARD.MAINT"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "STDCOST reads the set, then one UPDATE of cst.CostSet in autocommit (no BEGN/COMT in STDCOST, cobol/online/cst/STDCOST.cob:332-371); no lock or rowversion predicate; correlation id only (no IDEMPOT)."
      x-sterp-wave: "W10"
      x-sterp-screen-gate:
        anyOf:
          - "CST.STANDARD.MAINT"
        sources:
          - "menu:CST.COSTSET=CST.STANDARD.MAINT"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/cst/v1/cost-sets/{costSet}/activate":
    post:
      operationId: "cst_activateCostSet"
      summary: "Activate an approved STANDARD cost set (STDCOST ACTIVATE)"
      description: "Runs STDCOST ACTIVATE with SC-COMMIT Y: status must be APPROVED (422 CST0403) and purpose STANDARD (422 CST0404 'A simulation or quote set cannot be activated'); UPDATE cst.CostSet SET Status = 'ACTIVE', ActivatedAt, ModifiedBy, ModifiedAt; then returns the IMPACT figures. Activation revalues nothing (no ItemCost, ItemCostHistory or journal write; previous ACTIVE set not superseded; self-approved sets not refused - SME-743, SME-744, SME-745). Legacy chain: frmCostSet.ActivateClicked (confirmation) -> CostingService.Activate -> STDCOST 2200/2300/3000 (CostingService.vb:185-189; STDCOST.cob:274-282,286-457). Gate (contracts 5.4, binding): before the handler runs, the API checks the menu permission of the calling screen (CST.STANDARD.MAINT) through core.usp_UiCheckAccess; refusal is 403 PRM0006 '<user> does not hold <permission>'. The legacy flow has no business permission check, so no other check is added; x-sterp-permission repeats the gate code."
      tags:
        - "Cost Sets"
      parameters:
        - "$ref": "#/components/parameters/CstCostSet"
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CstEmptyRequest"
            examples:
              none:
                summary: "No fields"
                value: {}
      responses:
        "200":
          description: "Set activated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CstCostSetActionEnvelope"
              examples:
                illustrative:
                  summary: "Illustrative: FY2027STD after approval by COSTACC; impact figures as the preview"
                  value:
                    outcome:
                      returnCode: 0
                      severity: "OK"
                      reasonCode: ""
                      message: ""
                      messageCount: 0
                      documentRef: "CST-007"
                      correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                    data:
                      costSet: "FY2027STD"
                      compareSet: "FY2026STD"
                      status: "ACTIVE"
                      purpose: "STANDARD"
                      preparedBy: "KWATSON"
                      approvedBy: "COSTACC"
                      itemCount: 7
                      revalGbp: 16094.69
                      adverse: "N"
                      completeness: "COMPLETE"
                      warning: ""
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-CST-014"
        - "FR-STERP-CST-031"
        - "FR-STERP-CST-060"
      x-sterp-legacy:
        forms:
          - "frmCostSet"
        facade:
          - "CostingService.Activate"
          - "CostingService.SetArea"
        programs:
          - "STDCOST/ACTIVATE"
        citations:
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:185-189"
          - "STERP-App/dotnet/STERP.Business/Costing/CostingService.vb:157-165"
          - "STERP-App/cobol/online/cst/STDCOST.cob:286-457"
          - "STERP-App/dotnet/STERP.Desktop/Forms/Costing/frmCostSet.vb:73-77"
      x-sterp-permission:
        - "CST.STANDARD.MAINT"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "STDCOST reads the set, then one UPDATE of cst.CostSet in autocommit (no BEGN/COMT in STDCOST, cobol/online/cst/STDCOST.cob:332-371); no lock or rowversion predicate; correlation id only (no IDEMPOT). The impact queries run afterwards outside any transaction."
      x-sterp-wave: "W10"
      x-sterp-screen-gate:
        anyOf:
          - "CST.STANDARD.MAINT"
        sources:
          - "menu:CST.COSTSET=CST.STANDARD.MAINT"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/cst/v1/cost-sets/{costSet}/impact":
