openapi: "3.1.0"
info:
  title: "STERP Batch and Jobs host (STERP-JOBS)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Host-level endpoints of the STERP.Jobs batch web service. Run resources are in STERP-PLATFORM; job submissions in each slice document."
servers:
  - url: "https://localhost:7102"
security: []
tags:
  - name: "Host"
    description: "Host-level endpoints (health and OpenAPI publication)."
paths:
  "/health/live":
    get:
      operationId: "jobs_getLiveness"
      summary: "Process liveness"
      description: "Anonymous liveness probe."
      tags:
        - "Host"
      security: []
      responses:
        "200":
          description: "Alive"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
              example:
                status: "Healthy"
                checks: []
      x-sterp-requirements:
        - "FR-STERP-JOBS-013"
      x-sterp-legacy:
        replaces: "none"
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-wave: "W0"
      x-sterp-permission: []
      x-sterp-uow: "read-only; no database writes"
  "/health/ready":
    get:
      operationId: "jobs_getReadiness"
      summary: "Readiness: database probe, schema drift check, delivered slices"
      description: "Runs the PING-equivalent database probe and the frozen-contract drift check (contracts 6.11)."
      tags:
        - "Host"
      security: []
      responses:
        "200":
          description: "Ready"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
              example:
                status: "Healthy"
                checks:
                  - name: "database"
                    status: "Healthy"
                  - name: "schema-drift"
                    status: "Healthy"
                deliveredSlices:
                  - "PLATFORM"
                driftDifferences: []
        "503":
          description: "Not ready"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
      x-sterp-requirements:
        - "FR-STERP-JOBS-001"
        - "FR-STERP-JOBS-013"
      x-sterp-legacy:
        programs:
          - program: "PING"
            citation: "STERP-App/cobol/online/common/PING.cob"
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-wave: "W0"
      x-sterp-permission: []
      x-sterp-uow: "read-only; no database writes"
  "/openapi/index.json":
    get:
      operationId: "jobs_listOpenApiDocuments"
      summary: "List the OpenAPI documents served by this host"
      description: "Contract-first publication of the binding documents of delivered slices."
      tags:
        - "Host"
      security: []
      responses:
        "200":
          description: "Index"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OpenApiIndex"
      x-sterp-requirements:
        - "FR-STERP-JOBS-002"
      x-sterp-legacy:
        replaces: "none"
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-wave: "W0"
      x-sterp-permission: []
      x-sterp-uow: "read-only; no database writes"
  "/openapi/{documentName}.{format}":
    get:
      operationId: "jobs_getOpenApiDocument"
      summary: "Get one binding OpenAPI document"
      description: "Returns the binding document as YAML or JSON."
      tags:
        - "Host"
      security: []
      parameters:
        - name: "documentName"
          in: "path"
          required: true
          schema:
            type: "string"
          example: "STERP-PLATFORM"
        - name: "format"
          in: "path"
          required: true
          schema:
            type: "string"
            enum:
              - "yaml"
              - "json"
      responses:
        "200":
          description: "Document"
          content:
            "application/yaml":
              schema:
                type: "string"
            "application/json":
              schema:
                type: "object"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-sterp-legacy:
        replaces: "none"
      x-sterp-engine: "batch"
      x-sterp-outcome: "direct"
      x-sterp-wave: "W0"
      x-sterp-permission: []
      x-sterp-uow: "read-only; no database writes"
      x-sterp-requirements:
        - "FR-STERP-JOBS-002"
components:
  securitySchemes:
    windows:
      type: "http"
      scheme: "negotiate"
      description: "Windows integrated authentication (Kerberos/NTLM). Browsers send the signed-on Windows identity automatically; curl: add --negotiate -u : (contracts section 5.1)."
  parameters:
    XSterpCompany:
      name: "X-STERP-Company"
      in: "header"
      required: true
      description: "Company code of the session (legacy SterpSession.CompanyCode -> CA-COMPANY / @CompanyCode). Must be in the caller's access list (core.usp_GetUserContext result set 2); otherwise 403 API0002."
      schema:
        type: "string"
        maxLength: 10
        x-sterp-legacy-field: "CA-COMPANY PIC X(10)"
      example: "STC"
    XSterpSite:
      name: "X-STERP-Site"
      in: "header"
      required: false
      description: "Site code of the session (legacy SterpSession.SiteCode -> CA-SITE). Required by site-scoped operations; must pair with the company in the access list."
      schema:
        type: "string"
        maxLength: 10
        x-sterp-legacy-field: "CA-SITE PIC X(10)"
      example: "RDG"
    XSterpBusinessDate:
      name: "X-STERP-Business-Date"
      in: "header"
      required: false
      description: "Business date (legacy SterpSession.BusinessDate -> CA-BUSINESS-DATE yyyyMMdd). Default: server local date, as legacy DateTime.Today (CobolGateway.cs:77)."
      schema:
        type: "string"
        format: "date"
        x-sterp-legacy-field: "CA-BUSINESS-DATE PIC 9(8)"
      example: "2026-10-07"
    XSterpRunAs:
      name: "X-STERP-Run-As"
      in: "header"
      required: false
      description: "SYSADM 'Continue as' user code (LoginService.SignOnAs). Honoured only when the authenticated user resolves to SYSADM; otherwise 403 API0003."
      schema:
        type: "string"
        maxLength: 20
        x-sterp-legacy-field: "CA-USER PIC X(20)"
      example: "SALESREP"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Legacy correlation id (CA-CORRELATION-ID X(36)); default a new GUID per request (CobolGateway.cs:78). Send one stable key per user instruction where the legacy reused a correlation id (COM-015)."
      schema:
        type: "string"
        maxLength: 36
        x-sterp-legacy-field: "CA-CORRELATION-ID PIC X(36)"
      example: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
  schemas:
    Outcome:
      type: "object"
      description: "Legacy STCAHDR result (STERP-App/cobol/copy/STCAHDR.cpy:12-32; CobolResult.cs:6-26). returnCode 0 OK, 4 WARNING, 6 HOLD (HTTP 202). Failures (8, 12, 16) are returned as ProblemDetails."
      required:
        - "returnCode"
        - "severity"
        - "reasonCode"
        - "message"
        - "messageCount"
        - "correlationId"
      properties:
        returnCode:
          type: "integer"
          enum:
            - 0
            - 4
            - 6
          x-sterp-legacy-field: "CA-RETURN-CODE PIC 9(2)"
        severity:
          type: "string"
          enum:
            - "OK"
            - "WARNING"
            - "HOLD"
        reasonCode:
          type: "string"
          maxLength: 8
          x-sterp-legacy-field: "CA-REASON-CODE PIC X(8)"
        message:
          type: "string"
          maxLength: 200
          x-sterp-legacy-field: "CA-MESSAGE PIC X(200)"
        messageCount:
          type: "integer"
          x-sterp-legacy-field: "CA-MSG-COUNT PIC 9(2)"
        documentRef:
          type:
            - "string"
            - "null"
          maxLength: 10
          x-sterp-legacy-field: "CA-REQ-REF PIC X(10)"
        correlationId:
          type: "string"
          maxLength: 36
          x-sterp-legacy-field: "CA-CORRELATION-ID PIC X(36)"
    ProblemDetails:
      type: "object"
      description: "RFC 9457 problem (contracts 4.6-4.7). type = https://sterp.local/problems/{business-rule|severe|not-found|validation|forbidden|unauthenticated|not-implemented}; detail = legacy message; reasonCode = legacy reason (or API#### for target-only conditions)."
      required:
        - "type"
        - "title"
        - "status"
      properties:
        type:
          type: "string"
          format: "uri"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type:
            - "string"
            - "null"
        instance:
          type:
            - "string"
            - "null"
        returnCode:
          type:
            - "integer"
            - "null"
          description: "legacy CA-RETURN-CODE (8, 12, 16 or other)"
        reasonCode:
          type:
            - "string"
            - "null"
        severity:
          type:
            - "string"
            - "null"
          enum:
            - "ERROR"
            - "SEVERE"
            - "NOT FOUND"
            - "E"
            - "W"
            - "I"
            - null
        messageCount:
          type:
            - "integer"
            - "null"
        correlationId:
          type:
            - "string"
            - "null"
        traceId:
          type:
            - "string"
            - "null"
        errors:
          type:
            - "object"
            - "null"
          additionalProperties:
            type: "array"
            items:
              type: "string"
      example:
        type: "https://sterp.local/problems/business-rule"
        title: "Business rule refused the request"
        status: 422
        detail: "Period 202602 is hard closed."
        returnCode: 8
        reasonCode: "PER0003"
        severity: "ERROR"
        messageCount: 1
        correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
        traceId: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
    JobRunAccepted:
      type: "object"
      description: "Returned with HTTP 202 by every job submission (contracts 8.3). Poll /api/jobs/v1/runs/{jobRunId} on STERP.Jobs."
      required:
        - "jobRunId"
        - "jobName"
        - "status"
      properties:
        jobRunId:
          type: "integer"
          format: "int64"
          x-sterp-legacy-field: "core.JobRun.JobRunId bigint"
        jobName:
          type: "string"
          maxLength: 40
          x-sterp-legacy-field: "core.JobRun.JobName varchar(40)"
        status:
          type: "string"
          enum:
            - "RUNNING"
            - "OK"
            - "WARNING"
            - "FAILED"
            - "ABENDED"
        startedAt:
          type: "string"
          format: "x-sterp-local-date-time"
        links:
          type: "object"
          properties:
            self:
              type: "string"
            sysout:
              type: "string"
            spool:
              type: "string"
            result:
              type: "string"
    ListEnvelope:
      type: "object"
      description: "Complete legacy result set in legacy order (contracts 4.10). Use allOf with an 'items' array of your row schema."
      required:
        - "items"
        - "count"
      properties:
        items:
          type: "array"
          items: {}
        count:
          type: "integer"
    Health:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "Healthy"
            - "Degraded"
            - "Unhealthy"
        checks:
          type: "array"
          items:
            type: "object"
            properties:
              name:
                type: "string"
              status:
                type: "string"
              description:
                type:
                  - "string"
                  - "null"
              data:
                type: "object"
        deliveredSlices:
          type: "array"
          items:
            type: "string"
        driftDifferences:
          type: "array"
          items:
            type: "string"
    OpenApiIndex:
      type: "object"
      properties:
        documents:
          type: "array"
          items:
            type: "object"
            properties:
              name:
                type: "string"
              title:
                type: "string"
              slice:
                type: "string"
              wave:
                type: "string"
              yaml:
                type: "string"
              json:
                type: "string"
  responses:
    BadRequest:
      description: "Malformed request or context header (API0001, API0004)."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: "Not authenticated (API0401)."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    Forbidden:
      description: "No STERP user (API0010), company/site not permitted (API0002), run-as refused (API0003), or a legacy permission refusal."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    NotFound:
      description: "Legacy RC 16 (NOT FOUND)."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    BusinessRule:
      description: "Legacy RC 08 or procedure THROW 'STERP-<s>-<code>: text' - no business effect."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    Severe:
      description: "Legacy RC 12 (SQL0001 and other severe errors) or SYS0001."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
    NotImplemented:
      description: "API0501 - the operation belongs to a slice not yet delivered, or a job stream step is in an undelivered slice."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
