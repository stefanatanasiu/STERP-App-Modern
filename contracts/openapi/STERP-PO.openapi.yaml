openapi: "3.1.0"
info:
  title: "STERP Purchasing API (STERP-PO)"
  version: "1.0.0+a06-20261020T112437Z-034eff00"
  description: "Online and batch API of slice STERP-PO (wave W6, API segment po) of the modernized STERP ERP: purchase requisitions (POREQ) and the approved-source check (SOURCSEL), purchase orders (POORDER, POPRICE, BUDGCHK, POSUPCHK, PAYTERMC, POAPPRV, POAMEND), goods receipt in one unit of work with stock movement and GRNI journal (RECEIPT, TOLCHK, POPOST via the PLATFORM GL posting gateway and the ITM STKMOVE contract), inspection (INSPECT) and the batch programs REQGEN, POPIPE, OVERDUE, SUPPPERF and PODOC. The legacy behaviour is the contract: every operation reproduces the VB facade (dotnet/STERP.Business/Purchasing) and the COBOL or SQL logic it called, with the legacy return codes, reason codes, messages and data effects (application spec application-specs/STERP-PO.md; contracts 01-shared-platform-contracts.md). Each operation checks the permission of the legacy menu row of its screen (403 PRM0006) and requires X-STERP-Site. Where the legacy screen showed the COMMAREA answer after a failure, the problem carries it in data (spec rule R4). Units without a production entry route (IMPVAT, LANDCOST, POCLOSE, SUPPRET, SVCACC, PODEMO and test-only facade functions) are not offered (dispositions CSV)."
servers:
  - url: "https://localhost:7101"
    description: "STERP.Api (online)"
security:
  - windows: []
tags:
  - name: "Purchase Requisition"
    description: "Legacy screen frmRequisition (menu PO.REQ.ENTRY, permission PO.REQ.ENTER): RequisitionService -> POREQ, SOURCSEL, BUDGCHK."
  - name: "Purchase Order Entry and Approval"
    description: "Legacy screen frmPurchaseOrder (menu PO.ORDER.ENTRY, permission PO.ORDER.ENTER): PurchaseOrderService -> POORDER, POPRICE, BUDGCHK, POSUPCHK, PAYTERMC, POAPPRV, POAMEND, po.usp_OpenOrders."
  - name: "Goods Receipt and Inspection"
    description: "Legacy screen frmGoodsReceipt (menu PO.RECEIPT.ENTRY, permission PO.RECEIPT.CONFIRM): GoodsReceiptService -> RECEIPT, TOLCHK, POPOST, INSPECT, ITM STKMOVE."
  - name: "Purchasing Reports"
    description: "Report catalogue programs launched by frmReportLauncher (menu PO.RPT.*): REQGEN, POPIPE, OVERDUE, SUPPPERF, PODOC."
paths:
  "/api/po/v1/purchase-orders":
    get:
      operationId: "po_listOpenOrders"
      summary: "Open purchase orders of the session company and site (po.usp_OpenOrders)"
      description: "Reproduces PurchaseOrderService.OpenOrders (dotnet/STERP.Business/Purchasing/PurchaseOrderService.vb:45-50), used by frmPurchaseOrder F5 (frmPurchaseOrder.vb:113-120): EXEC po.usp_OpenOrders @CompanyCode, @SiteCode (session), @SupplierCode, @OrderNumber, @IncludeClosed (db/procs/po/usp_PoEnquiry.sql:32-89). Empty filters are passed as NULL (SqlHelper.cs:33). Returns the complete result set in procedure order (earliest due date, order number), at most the procedure default @MaxRows 500; CLOSED and CANCELLED orders only with includeClosed; OverdueLines uses the database server date. FR-STERP-PO-021."
      tags:
        - "Purchase Order Entry and Approval"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "supplierCode"
          in: "query"
          required: false
          description: "Supplier filter (@SupplierCode varchar(20)); the page sends its Supplier box."
          schema:
            type: "string"
            x-sterp-legacy-field: "@SupplierCode varchar(20)"
            maxLength: 20
            x-sterp-length: 20
          example: "S0006"
        - name: "orderNumber"
          in: "query"
          required: false
          description: "Order filter (@OrderNumber varchar(30)); the page sends its Order box."
          schema:
            type: "string"
            x-sterp-legacy-field: "@OrderNumber varchar(30)"
            maxLength: 30
            x-sterp-length: 30
          example: "PO00000004"
        - name: "includeClosed"
          in: "query"
          required: false
          description: "Include CLOSED and CANCELLED orders (@IncludeClosed bit); the screen always sends false."
          schema:
            type: "boolean"
            x-sterp-legacy-field: "@IncludeClosed bit"
          example: false
      responses:
        "200":
          description: "Complete legacy result set (contracts 4.10)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PoOpenOrderList"
              example:
                items:
                  - orderNumber: "PO00000004"
                    orderType: "STANDARD"
                    siteCode: "BHM"
                    supplierCode: "S0001"
                    buyerUser: "BUYER"
                    orderDate: "2026-10-01"
                    currencyCode: "GBP"
                    status: "ISSUED"
                    deliveryStatus: "NOTRECEIVED"
                    matchStatus: null
                    termsCode: "D2N30"
                    termsSnapshot: null
                    incotermsRule: null
                    netAmount: 410.83
                    vatAmount: 0.0
                    grossAmount: 410.83
                    commitmentGbp: 410.83
                    approvedBy: "PURMGR"
                    approvedAt: "2026-10-01T10:15:00.0000000"
                    issuedAt: "2026-10-01T10:20:00.0000000"
                    acknowledgedAt: null
                    blanketOrderNumber: null
                    budgetCode: null
                    lineCount: 1
                    outstandingQty: 40.0
                    outstandingGbp: 410.83
                    receivedNotInvoicedGbp: 0.0
                    earliestDueDate: null
                    latestDueDate: null
                    overdueLines: null
                    isCommitment: true
                count: 1
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PO-021"
        - "FR-STERP-PO-020"
      x-sterp-legacy:
        forms:
          - "frmPurchaseOrder.OnRefreshKey (frmPurchaseOrder.vb:113-120)"
        facade:
          - "PurchaseOrderService.OpenOrders (PurchaseOrderService.vb:45-50)"
        programs: []
        procedures:
          - "po.usp_OpenOrders (db/procs/po/usp_PoEnquiry.sql:32-89)"
      x-sterp-permission:
        - "PO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "direct"
      x-sterp-uow: "Read only: one procedure call on its own ADO.NET connection in autocommit (SqlHelper.cs:56-120)."
      x-sterp-wave: "W6"
      x-sterp-screen-gate:
        anyOf:
          - "PO.ORDER.ENTER"
        sources:
          - "menu:PO.ORDER.ENTRY=PO.ORDER.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
    post:
      operationId: "po_createPurchaseOrder"
      summary: "Create a DRAFT purchase order (POORDER CREATE)"
      description: "Reproduces PurchaseOrderService.Create (PurchaseOrderService.vb:65-84) -> POORDER CREATE (cobol/online/po/POORDER.cob:182-285): defaults (127-174), supplier required ORD0001, type domain ORD0008, CALLOFF needs a blanket ORD0017, PAYTERMC APPLY when a terms code is given (289-316; RC >= 8 aborts, statutory breach RC 6 ORD0014 keeps the draft -> HTTP 202), number from NUMGEN series POORD (1194-1215, ORD0010), INSERT DRAFT po.PurchaseOrder with terms snapshot, Incoterms, delivery snapshot and correlation id; outcome CAPTURED. buyer := user, orderDate := business date. FR-STERP-PO-022."
      tags:
        - "Purchase Order Entry and Approval"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PoCreatePurchaseOrderRequest"
            example:
              orderType: "STANDARD"
              supplier: "S0006"
              currency: "GBP"
              termsCode: "D2N30"
              incoterms: ""
              namedPlace: ""
              supplierRef: "CF-2026-118"
              budgetCode: ""
      responses:
        "200":
          description: "Legacy RC 0 (OK) or 4 (WARNING) - envelope with the COMMAREA answer."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PoPurchaseOrderEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Draft order PO00000012 opened for supplier S0006 on 30 days from receipt of a valid invoice, 2.00% settlement discount within 10 days"
                  messageCount: 0
                  documentRef: "PO00000012"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  orderNumber: "PO00000012"
                  orderType: "STANDARD"
                  supplier: "S0006"
                  buyer: "BUYER"
                  orderDate: "2026-10-07"
                  currency: "GBP"
                  status: "DRAFT"
                  outcome: "CAPTURED"
        "202":
          description: "Legacy RC 6 (HOLD): needs an authority or is held; see outcome.reasonCode (contracts 4.6)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PoPurchaseOrderEnvelope"
              example:
                outcome:
                  returnCode: 6
                  severity: "HOLD"
                  reasonCode: "ORD0014"
                  message: "Payment terms of 90 days exceed the maximum of 60 days allowed for a SMALL supplier and need an authorised exception"
                  messageCount: 1
                  documentRef: "PO00000012"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  orderNumber: "PO00000012"
                  supplier: "S0006"
                  termsCode: "N90"
                  status: "DRAFT"
                  outcome: "CAPTURED"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PO-022"
        - "FR-STERP-PO-020"
      x-sterp-legacy:
        forms:
          - "frmPurchaseOrder.NewClicked (frmPurchaseOrder.vb:123-131)"
          - "frmPurchaseOrder.AddClicked (frmPurchaseOrder.vb:135-146)"
        facade:
          - "PurchaseOrderService.Create (PurchaseOrderService.vb:65-84)"
        programs:
          - "POORDER#CREATE (POORDER.cob:182-285)"
          - "PAYTERMC#APPLY (PAYTERMC.cob:66-86,383-414)"
          - "NUMGEN (PLATFORM)"
        procedures: []
      x-sterp-permission:
        - "PO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Autocommit: POORDER issues no BEGN; the NUMGEN draw commits in its own transaction (core.usp_NextDocumentNumber outermost) and the po.PurchaseOrder INSERT commits on its own (contracts 6.4)."
      x-sterp-wave: "W6"
      x-sterp-screen-gate:
        anyOf:
          - "PO.ORDER.ENTER"
        sources:
          - "menu:PO.ORDER.ENTRY=PO.ORDER.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/po/v1/purchase-orders/{orderNumber}/lines":
    post:
      operationId: "po_addPurchaseOrderLine"
      summary: "Add a priced line to a purchase order (POORDER ADDLINE, POPRICE PRICE)"
      description: "Reproduces PurchaseOrderService.AddLine (PurchaseOrderService.vb:87-118) -> POORDER ADDLINE (POORDER.cob:324-392): status gate ORD0003 (ISSUED, CLOSED, CANCELLED, ACKNOWLEDGED), description and quantity ORD0004, STOCK item must exist and be purchasable ORD0018 (407-452), item or account ORD0005; autoPrice Y (unit price 0) prices through POPRICE PRICE at OR-ORDER-DATE = business date (453-486; failure -> RC 4, price kept); value ROUNDED6 effective price then ROUNDED2 net = effective x qty x FX + charge, VAT from the (unsent, hence 0) rate (487-504); next line number (505-528); DELETE schedules + line and INSERT the OPEN line (529-626); header re-total (627-656). FR-STERP-PO-023."
      tags:
        - "Purchase Order Entry and Approval"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - "$ref": "#/components/parameters/PoOrderNumber"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PoAddPurchaseOrderLineRequest"
            example:
              lineType: "STOCK"
              itemCode: "BAR-AL6082-25MM"
              description: "Aluminium bar 6082-T6, 25 mm round"
              orderedQty: 40
              uomCode: "M"
              unitPrice: 0
              discountPct: 0
              accountCode: ""
              costCentre: ""
              destSite: "BHM"
              schReqDate: "2026-10-21"
      responses:
        "200":
          description: "Legacy RC 0 (OK) or 4 (WARNING) - envelope with the COMMAREA answer."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PoPurchaseOrderEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: "Line Aluminium bar 6082-T6, 25 mm round valued at 500.00 added to order PO00000012"
                  messageCount: 0
                  documentRef: "PO00000012"
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  orderNumber: "PO00000012"
                  lineNum: 1
                  unitPrice: 12.5
                  pricePer: 1.0
                  priceSource: "CONTRACT"
                  lineNetGbp: 500.0
                  netAmount: 500.0
                  vatAmount: 0.0
                  grossAmount: 500.0
                  commitmentGbp: 500.0
                  status: "DRAFT"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PO-023"
        - "FR-STERP-PO-020"
      x-sterp-legacy:
        forms:
          - "frmPurchaseOrder.AddClicked (frmPurchaseOrder.vb:135-146)"
        facade:
          - "PurchaseOrderService.AddLine (PurchaseOrderService.vb:87-118)"
        programs:
          - "POORDER#ADDLINE (POORDER.cob:324-656)"
          - "POPRICE#PRICE (POPRICE.cob:104-334)"
        procedures: []
      x-sterp-permission:
        - "PO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Autocommit: no BEGN; the DELETE+DELETE+INSERT batch (POORDER.cob:529-626) runs as one SQL batch without an explicit transaction and the header re-total UPDATE commits separately."
      x-sterp-wave: "W6"
      x-sterp-screen-gate:
        anyOf:
          - "PO.ORDER.ENTER"
        sources:
          - "menu:PO.ORDER.ENTRY=PO.ORDER.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/po/v1/purchase-prices/price":
    get:
      operationId: "po_explainPurchasePrice"
      summary: "Explain the purchase price of a supplier and item (POPRICE PRICE)"
      description: "Reproduces PurchaseOrderService.Explain (PurchaseOrderService.vb:182-195) used by Explain price (frmPurchaseOrder.vb:150-163) -> POPRICE PRICE (POPRICE.cob:104-334): supplier and item required POP1001, quantity > 0 POP1003, pricing date = business date, currency default base currency; item beats group, CONTRACT beats QUOTE beats LIST, then priority, then latest effective-from (152-219); none -> RC 16 POP1002; MANUAL when no basis; highest break reached (276-321); gross ROUNDED2, discount ROUNDED2, net (322-334). The facade substitutes UNKNOWN for a blank basis (PurchaseOrderService.vb:210-215). FR-STERP-PO-024."
      tags:
        - "Purchase Order Entry and Approval"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "supplier"
          in: "query"
          required: true
          description: "Supplier (PR-SUPPLIER)."
          schema:
            type: "string"
            x-sterp-legacy-field: "PR-SUPPLIER PIC X(20)"
            maxLength: 20
            x-sterp-length: 20
          example: "S0001"
        - name: "itemCode"
          in: "query"
          required: true
          description: "Item (PR-ITEM-CODE)."
          schema:
            type: "string"
            x-sterp-legacy-field: "PR-ITEM-CODE PIC X(40)"
            maxLength: 40
            x-sterp-length: 40
          example: "BAR-AL6082-25MM"
        - name: "quantity"
          in: "query"
          required: false
          description: "Quantity (PR-QUANTITY S9(13)V9(6)); 0 or absent -> 422 POP1003."
          schema:
            type: "number"
            x-sterp-legacy-field: "PR-QUANTITY PIC S9(13)V9(6)"
            format: "decimal"
          example: 40
        - name: "uomCode"
          in: "query"
          required: false
          description: "Unit of measure (PR-UOM-CODE)."
          schema:
            type: "string"
            x-sterp-legacy-field: "PR-UOM-CODE PIC X(10)"
            maxLength: 10
            x-sterp-length: 10
          example: "M"
        - name: "currency"
          in: "query"
          required: false
          description: "Currency (PR-CURRENCY); default session base currency."
          schema:
            type: "string"
            x-sterp-legacy-field: "PR-CURRENCY PIC X(3)"
            maxLength: 3
            x-sterp-length: 3
          example: "GBP"
      responses:
        "200":
          description: "Legacy RC 0 (OK) or 4 (WARNING) - envelope with the COMMAREA answer."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PoPriceEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: ""
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  supplier: "S0001"
                  itemCode: "BAR-AL6082-25MM"
                  uomCode: "M"
                  quantity: 40.0
                  pricingDate: "2026-10-07"
                  currency: "GBP"
                  unitPrice: 12.5
                  pricePer: 1.0
                  effectivePrice: 12.5
                  discountPct: 0.0
                  netValue: 500.0
                  grossValue: 500.0
                  priceBasis: "CONTRACT"
                  agreementRef: "CTR-S0001-DEMO"
                  effectiveFrom: "2026-01-01"
                  effectiveTo: null
                  breakQtyUsed: 0.0
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PO-024"
        - "FR-STERP-PO-020"
      x-sterp-legacy:
        forms:
          - "frmPurchaseOrder.PriceClicked (frmPurchaseOrder.vb:150-163)"
        facade:
          - "PurchaseOrderService.Explain (PurchaseOrderService.vb:182-195)"
          - "PurchaseOrderService.ReadPrice (PurchaseOrderService.vb:210-215)"
        programs:
          - "POPRICE#PRICE (POPRICE.cob:104-334)"
        procedures: []
      x-sterp-permission:
        - "PO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read only (SELECTs in autocommit)."
      x-sterp-wave: "W6"
      x-sterp-screen-gate:
        anyOf:
          - "PO.ORDER.ENTER"
        sources:
          - "menu:PO.ORDER.ENTRY=PO.ORDER.ENTER"
        enforcedBy: "core.usp_UiCheckAccess (contracts 5.4)"
  "/api/po/v1/purchase-prices/breaks":
    get:
      operationId: "po_listPriceBreaks"
      summary: "Quantity-break ladder behind a purchase price (POPRICE BREAKS)"
      description: "Reproduces PurchaseOrderService.Breaks (PurchaseOrderService.vb:218-227) -> POPRICE BREAKS (POPRICE.cob:84-88,336-389): price selection then up to 10 breaks by from-quantity. Exactly as the facade, no quantity is sent, so POPRICE refuses the call POP1003 (RC 8, POPRICE.cob:130-136) and the screen grid is empty; the page binds an empty grid without a dialog (BC-PO-09 proposes sending the quantity). FR-STERP-PO-024."
      tags:
        - "Purchase Order Entry and Approval"
      parameters:
        - "$ref": "#/components/parameters/XSterpCompany"
        - "$ref": "#/components/parameters/XSterpSite"
        - "$ref": "#/components/parameters/XSterpBusinessDate"
        - "$ref": "#/components/parameters/XSterpRunAs"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - name: "supplier"
          in: "query"
          required: true
          description: "Supplier (PR-SUPPLIER)."
          schema:
            type: "string"
            x-sterp-legacy-field: "PR-SUPPLIER PIC X(20)"
            maxLength: 20
            x-sterp-length: 20
          example: "S0001"
        - name: "itemCode"
          in: "query"
          required: true
          description: "Item (PR-ITEM-CODE)."
          schema:
            type: "string"
            x-sterp-legacy-field: "PR-ITEM-CODE PIC X(40)"
            maxLength: 40
            x-sterp-length: 40
          example: "BAR-AL6082-25MM"
      responses:
        "200":
          description: "Defined for completeness; not reachable while BC-PO-09 is pending, because the call (like the facade) sends no quantity and POPRICE answers 422 POP1003."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PoPriceEnvelope"
              example:
                outcome:
                  returnCode: 0
                  severity: "OK"
                  reasonCode: ""
                  message: ""
                  messageCount: 0
                  documentRef: ""
                  correlationId: "3f1c2a9e-6d1b-4c8e-9a51-2b7d0c4e8f10"
                data:
                  supplier: "S0001"
                  itemCode: "BAR-AL6082-25MM"
                  breakCnt: 0
                  breakTable:
                    break: []
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/BusinessRule"
        "500":
          "$ref": "#/components/responses/Severe"
      x-sterp-requirements:
        - "FR-STERP-PO-024"
      x-sterp-legacy:
        forms:
          - "frmPurchaseOrder.PriceClicked (frmPurchaseOrder.vb:150-163)"
        facade:
          - "PurchaseOrderService.Breaks (PurchaseOrderService.vb:218-227)"
        programs:
          - "POPRICE#BREAKS (POPRICE.cob:336-389)"
        procedures: []
      x-sterp-permission:
        - "PO.ORDER.ENTER"
      x-sterp-engine: "online"
      x-sterp-outcome: "envelope"
      x-sterp-uow: "Read only."
      x-sterp-wave: "W6"
